[build-system]
build-backend = "uv_build"
# uv-build is intentionally left uncapped. uv warns on build that the sdist
# could break on a future breaking uv-build release, but repomatic is pure
# Python with none of the packaging edge cases that warning guards against (no
# compiled extensions, no GPU/CUDA targets). Flexibility is preferred here:
# repomatic runs across the ecosystem, where uv versions drift between projects,
# and a hard ceiling risks a chicken-and-egg deadlock when one project's uv
# moves ahead of repomatic's next release.
requires = [ "uv-build>=0.8" ]

[project]
# Docs: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
name = "repomatic"
version = "8.0.0.dev0"
description = "🏭 Automate repository maintenance, releases, and CI/CD workflows"
readme = "readme.md"
keywords = [
  "changelog-formatter",
  "dependabot-alternative",
  "github-actions",
  "github-labels",
  "github-workflow",
  "gitignore",
  "mailmap",
  "mypy",
  "nuitka",
  "python-automation",
  "release-automation",
  "repository-automation",
  "repository-management",
  "reusable-workflows",
  "software-factory",
  "sphinx-doc",
  "typo",
  "uv",
  "workflow-reusable",
]
license = "GPL-2.0-or-later"
license-files = [ "license" ]
authors = [ { name = "Kevin Deldycke", email = "kevin@deldycke.com" } ]
# Python versions and their status: https://devguide.python.org/versions/
requires-python = ">=3.11"
classifiers = [
  # See: https://pypi.org/pypi?%3Aaction=list_classifiers
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: Sphinx",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: BSD :: FreeBSD",
  "Operating System :: POSIX :: BSD :: NetBSD",
  "Operating System :: POSIX :: BSD :: OpenBSD",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Unix Shell",
  "Topic :: Documentation :: Sphinx",
  "Topic :: File Formats :: JSON",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: System :: Archiving :: Packaging",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Shells",
  "Topic :: System :: Software Distribution",
  "Topic :: Terminals",
  "Topic :: Text Processing :: Markup :: HTML",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  # click-extra 9.5 ships LazyChoice, which cli/main.py builds its project-aware
  # option types on, keeps the lazy command modules unloaded when a
  # configuration file is read, and fixes a Ctrl+C lost while run_jobs() waits
  # on a task (deps/sync.py, tooling/checksums.py).
  "click-extra>=9.5",
  # extra-platforms 12.0.2 reimplemented is_macos() with sys.platform, avoiding
  # the platform.platform() shell-out to ``cmd /c ver`` on Windows that broke
  # under patched subprocess in tests.
  "extra-platforms>=12.0.2",
  # packaging 20 added the major and minor aliases of Version, which
  # metadata/project.py compares to decide whether a version bump is allowed.
  "packaging>=20",
  # py-walk 0.3.3 anchors a one-part pattern like `/build` to the root, which
  # 0.3.1 read as `**/build`, and stops its logger installing a handler.
  # XXX Replace py-walk with wcmatch once the latter supports gitignore files:
  # https://github.com/facelessuser/wcmatch/issues/226
  "py-walk>=0.3.3",
  # pyproject-metadata 0.9 added PEP 639 (license expressions) and PEP 685 (extras
  # normalization); our StandardMetadata.from_pyproject() call benefits from these.
  "pyproject-metadata>=0.9",
  # PyYAML 6.0.1 pins Cython below 3 for its source build. 6.0 ships no wheel for
  # Python 3.12 and later, and its build fails there on a missing cython_sources
  # attribute.
  "pyyaml>=6.0.1",
  # tomlrt 2.2.4 made Document(table) keep a section's comments and spacing,
  # which NativeFormat.serialize (tooling/registry.py) relies on to turn a
  # [tool.X] section into a native config file.
  "tomlrt>=2.2.4",
  # wcmatch 10.0 fixed globbing inconsistencies with symlinks; our metadata
  # globbing uses iglob() with FOLLOW for symlink-aware file discovery.
  "wcmatch>=10",
]
urls.Changelog = "https://github.com/kdeldycke/repomatic/blob/main/changelog.md"
urls.Documentation = "https://repomatic.net"
urls.Download = "https://github.com/kdeldycke/repomatic/releases/tag/v8.0.0.dev0"
urls.Funding = "https://github.com/sponsors/kdeldycke"
urls.Homepage = "https://github.com/kdeldycke/repomatic"
urls.Issues = "https://github.com/kdeldycke/repomatic/issues"
urls.Repository = "https://github.com/kdeldycke/repomatic"
scripts.repomatic = "repomatic.__main__:main"

# Non-runtime development dependency groups.
[dependency-groups]
test = [
  # coverage 7.16.2 fixes two branch misreports of the sys.monitoring core, the
  # default on Python 3.14 and later, which move the `report.fail_under`
  # ratchet on the 3.14 and 3.15 cells.
  "coverage[toml]>=7.16.2",
  # pytest 9.0.3 fixes CVE-2025-71176: the `tmp_path` base directory followed
  # symlinks. The native `[tool.pytest]` table below arrived in 9.0.0, and an
  # older pytest reads none of it.
  "pytest>=9.0.3",
  # pytest-cov 7.1.0 computes the total it checks against `report.fail_under`
  # the same way whatever reports are requested. 7.0 dropped the `.pth`
  # subprocess measurement, so a child interpreter a test spawns needs no
  # coverage variable stripped (tests/test_metadata.py).
  "pytest-cov>=7.1",
  # pytest-github-actions-annotate-failures 0.4.2 stops a `ValueError` on a
  # Windows runner when a warning comes from a file on another drive than the
  # checkout; 0.4.1 stopped annotating the same failure once per xdist worker.
  "pytest-github-actions-annotate-failures>=0.4.2",
  # pytest-randomly 5 turned the shuffle into a hook wrapper, so it runs before
  # every other plugin's pytest_collection_modifyitems. Below it, plugin
  # registration order decided who shuffled first, and the same seed replayed a
  # different order on another machine.
  "pytest-randomly>=5",
  # pytest-xdist 3.7.0 merges every `xdist_group` marker a test carries; before
  # it the last marker alone chose the group. The [psutil] extra is what
  # `--numprocesses=logical` counts the CPUs with.
  "pytest-xdist[psutil]>=3.7",
]
docs = [
  # click-extra 9.4 added click_extra_fail_on_warnings, which docs/conf.py sets to
  # fail the build on a dead fragment link. An older release ignores the line and
  # the build passes. The [sphinx] extra pulls docutils, pygments and sphinx.
  "click-extra[sphinx]>=9.4",
  # furo 2025.12.19 is the first release that accepts Sphinx 9 (`sphinx<10`);
  # 2025.09.25 caps it below 9, which the lock cannot satisfy.
  "furo>=2025.12.19",
  # myst-parser 5.1 ships the native "alert" extension (enabled in docs/conf.py)
  # that renders GitHub-style alerts as admonitions; earlier 5.x reject "alert".
  "myst-parser>=5.1",
  # Sphinx 9.1.0 reads `show-inheritance` from `autodoc_default_options` on an
  # `automodule` page again (sphinx-doc/sphinx#14198): 9.0 dropped it, and
  # every class page lost its Bases line.
  "sphinx>=9.1",
  # sphinx-autodoc-typehints 3.10.4 catches the `NameError` Python 3.14 raises
  # when it evaluates an annotation naming a `TYPE_CHECKING`-only import, the
  # idiom of every module here: below it each such signature loses its types.
  "sphinx-autodoc-typehints>=3.10.4",
  # sphinx-copybutton 0.5.2 strips nothing but what `copybutton_exclude` names,
  # which docs/conf.py sets to copy a shell-session command without its prompt
  # and output lines.
  "sphinx-copybutton>=0.5.2",
  # sphinx-datatables 1.0.0 is the first stable release; makes the binaries
  # catalog table searchable and sortable client-side (pulls sphinxcontrib-jquery).
  "sphinx-datatables>=1",
  # sphinx-design 0.7.0 is the first release that accepts Sphinx 9 (`sphinx<10`);
  # 0.6.1 caps it below 9.
  "sphinx-design>=0.7",
  # sphinx-sitemap 2.6.0 added `sitemap_excludes`, which docs/conf.py uses to
  # keep the search and index pages out of the sitemap.
  "sphinx-sitemap>=2.6",
  # sphinxcontrib-jquery 4.0 stopped enforcing subresource-integrity checks by
  # default: under 3.0 a build opened from the local filesystem could not load
  # jQuery. Declared because docs/conf.py loads it itself: sphinx-datatables
  # activates it too late to register jquery.js on its own.
  "sphinxcontrib-jquery>=4",
  # sphinxcontrib-mermaid 2.1.0 fixes the interaction of fullscreen, d3 zoom
  # and lazy rendering, which the class-tree override in docs/conf.py relies
  # on; 2.0.0 re-renders each diagram when furo's theme toggle flips.
  "sphinxcontrib-mermaid>=2.1",
  # sphinxext-opengraph 0.11.0 escapes the reserved HTML characters of
  # `og:description`; 0.13.0 is the first release built against Sphinx 8.
  "sphinxext-opengraph>=0.13",
  # autodoc imports every module it documents, and docs/tests.md documents the
  # test suite, whose modules import pytest. Without the test group the whole
  # tests package fails to import and each of its pages renders empty.
  { include-group = "test" },
]
# types-docutils: covers the docutils.nodes imports in docs/conf.py.
# types-pyyaml: stub release covering PyYAML 6.0 (safe_load, safe_dump, full_load).
typing = [
  "types-docutils>=0.22.3.20251115",
  "types-pyyaml>=6.0.12.9",
]

[tool.uv]
# Floor uv at the oldest release that writes uv.lock as it is committed, with
# no upper bound. uv 0.12.22 is the first to write lockfile revision 5 and the
# `[package.group-requires-python]` table the docs group's requires-python
# adds: an older uv relocks to revision 3 and drops the table. No ceiling, so
# contributors move forward without a manual bump each minor (a hard upper cap
# breaks every machine the day the next uv minor lands, since uv
# self-updates). CI does not install from this floor: each astral-sh/setup-uv
# step pins the exact uv it downloads, and sync-workflow-pins moves that pin
# forward. uv.lock stays stable across minors because sync-uv-lock discards a
# re-lock that only re-spells equivalent markers (see
# repomatic.deps.cooldown.sync_uv_lock).
required-version = ">=0.12.22"
# Docs group requires Python >= 3.14 for recent MyST-Parser and click-extra features.
dependency-groups.docs = { requires-python = ">= 3.14" }
# Cooldown period before using newly released packages. Kept equal to
# `[tool.repomatic] minimum-release-age`: that value gates the `uvx` installs
# every workflow runs, and a wider window here would lock a version those
# installs refuse to resolve. Relative dates are fine: uv 0.11.8+ writes a
# sentinel timestamp to uv.lock for relative spans, so re-resolving never
# produces churn.
exclude-newer = "1 week"
# Per-package cooldown control. A fixed date holds a package at the version
# available then (the day after it shipped), so `uv lock --upgrade` keeps that
# version instead of tracking newer releases. `sync-uv-lock` freezes new
# bypasses at that date and prunes each entry once its held version ages past
# `exclude-newer`, returning the package to the normal cooldown. repomatic is
# pinned to git main (no PyPI release to freeze), so it keeps a permanent
# "0 day" span.
# A fixed date on a package the lock does not hold covers a tool that the
# registry pins before its release cleared the window: without the entry,
# `repomatic run` cannot resolve that pin, and every job that needs the tool
# fails. `sync-uv-lock` prunes such an entry once the window has passed its
# cutoff.
# click-extra is published by this repository's own maintainer: the cooldown
# guards against a compromised upstream, which does not apply here, and it
# otherwise holds each release back a week from the one repository that
# consumes it first. The span admits one release: `sync-uv-lock` freezes it
# to a date, then prunes it.
exclude-newer-package = { certifi = "2026-10-22T00:00:00Z", click-extra = "2026-10-24T00:00:00Z", nuitka = "2026-10-18T00:00:00Z", repomatic = "0 day" }
# Package is at root level, not in "./src/".
build-backend.module-root = ""
build-backend.source-exclude = [
  "**/.DS_Store",
  "**/__pycache__",
  "docs/_build",
  "docs/_linkcheck",
]
# Ship the test suite, and the repository files it reads, in the sdist, so
# distribution packagers can build and test straight from the PyPI sdist instead
# of fetching a GitHub tag tarball. source-include feeds the sdist only: the
# wheel stays module-only.
build-backend.source-include = [
  ".claude-plugin/**",
  ".claude/**",
  ".github/**",
  ".gitignore",
  ".mailmap",
  "changelog.md",
  "claude.md",
  "docs/**",
  "tests/**",
  "uv.lock",
]

# Nuitka binary build options. repomatic translates this section to CLI flags
# at build time via `repomatic run nuitka` (Nuitka itself reads it only under
# `--project`, a mode repomatic cannot use: https://repomatic.net/nuitka#upstream-workarounds).
# Values with spaces are fine: the tool runner passes them as a proper argv.
[tool.nuitka]
copyright = "Kevin Deldycke <kevin@deldycke.com> and contributors. Distributed under GPL-2.0-or-later license."
file-description = "🏭 Automate repository maintenance, releases, and CI/CD workflows"
# Numeric only: Nuitka rejects PEP 440 .devN suffixes. Kept in sync with the
# package version by the dedicated [tool.bumpversion] rule that strips the suffix.
file-version = "8.0.0"
include-data-dir = [
  "repomatic/data/awesome_template=repomatic/data/awesome_template",
  "repomatic/data/skills=repomatic/data/skills",
]
include-data-files = [
  "repomatic/templates/*.md=repomatic/templates/",
  "repomatic/templates/*.noformat=repomatic/templates/",
]
# The CLI group imports its command modules by name, and the template loader
# names its package in a constant: Nuitka follows neither string, so both
# packages are compiled in.
include-package = [ "repomatic.cli", "repomatic.templates" ]
# click-extra ships themes.toml as package data loaded via importlib.resources;
# Nuitka does not auto-bundle non-Python data files, so the binary crashes on
# startup unless it is declared here.
include-package-data = [ "click_extra" ]
# Each platform points at its native icon format (all rendered from
# favicon.svg). Passing a non-native image (like a PNG to
# --windows-icon-from-ico) makes Nuitka require the imageio package to convert
# it, which fails the build. Per-OS flags not matching the build host are ignored.
linux-icon = "docs/assets/icon.png"
macos-app-icon = "docs/assets/icon.icns"
product-name = "Repomatic"
product-version = "8.0.0"
windows-icon-from-ico = "docs/assets/icon.ico"

[tool.ruff]
preview = true
fix = true
# Disabled for the reasons documented in the bundled repomatic/data/ruff.toml.
unsafe-fixes = false
show-fixes = true
# Enable reformatting of code snippets in docstrings.
# https://docs.astral.sh/ruff/formatter/#docstring-formatting
format.docstring-code-format = true
# D205: 1 blank line required between summary line and description.
#   The first line of a docstring is its summary, read alone by Sphinx and by
#   Click's `--help`, so a summary spilling onto a second line is cut mid-sentence.
#   See: https://docs.astral.sh/ruff/rules/missing-blank-line-after-summary/
# D209: Multi-line docstring closing quotes should be on a separate line.
#   See: https://docs.astral.sh/ruff/rules/new-line-after-last-paragraph/
# E501: Line too long.
#   The formatter wraps code and autopep8 wraps comments, but neither touches a
#   docstring or a string literal, which is where overlong lines survive.
#   See: https://docs.astral.sh/ruff/rules/line-too-long/
# PLC0415: `import` should be at the top-level of a file.
#   A function-local import hides a dependency and escapes isort.
#   See: https://docs.astral.sh/ruff/rules/import-outside-top-level/
# PLW1514: `open` and friends called without an explicit `encoding` argument.
#   Windows defaults text I/O to cp1252, so a bare `open()`, `read_text()` or
#   `write_text()` breaks on non-ASCII content, and only on Windows runners.
#   Preview rule; its type inference misses unannotated `Path` locals, so
#   PEP 597's `PYTHONWARNDEFAULTENCODING=1` remains the complete runtime net.
#   See: https://docs.astral.sh/ruff/rules/unspecified-encoding/
# RUF100, RUF102, RUF103, RUF104: a `# noqa` that no rule needs, that names a
#   rule ruff does not know, or that is malformed, is a suppression nobody
#   reviews. Correct under the full rule set only: selected alone, RUF100 reads
#   every `# noqa` as unused.
#   See: https://docs.astral.sh/ruff/rules/unused-noqa/
# TC: an import used only in annotations belongs in the `if TYPE_CHECKING:` block.
#   Ruff reads the block in its `TYPE_CHECKING = False` form, which spares the
#   `typing` import at runtime.
#   See: https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
# CPY001: every Python file opens with the GPL header, docs and tests included.
#   Local to this repository: the pattern below names its copyright holder.
#   See: https://docs.astral.sh/ruff/rules/missing-copyright-notice/
lint.extend-select = [
  "CPY001",
  "D205",
  "D209",
  "E501",
  "PLC0415",
  "PLW1514",
  "RUF100",
  "RUF102",
  "RUF103",
  "RUF104",
  "TC"
]
# D401 and D403 stay out of the selection above, since the rewrite each asks
#   for is wrong here: D401 rejects the noun-phrase docstring a property or a
#   getter opens with (`The options that pick a template`), and D403
#   capitalizes a tool name opening one (`uv`, `macOS`, `ruff`).
# D301: Use `r"""` if any backslashes in a docstring.
#   A Click command's docstring is its `--help` text, and `\b` marks a paragraph
#   Click must not rewrap. The raw prefix this rule asks for turns that backspace
#   character into two printable ones, so the marker stops working and shows up
#   in the help output.
#   See: https://docs.astral.sh/ruff/rules/escape-sequence-in-docstring/
# D400: First line should end with a period.
#   Allows docstrings to end up with any punctuation, not just a period.
#   See: https://github.com/astral-sh/ruff/issues/1858#issuecomment-1382640623
# ERA001: Found commented-out code.
#   Do not remove commented code, as it might be used for documentation.
#   See: https://docs.astral.sh/ruff/rules/#eradicate-era
# LOG015: Root logger calls (logging.info(), etc.).
#   The CLI configures the root logger via Click, so root logger calls are intentional.
#   See: https://docs.astral.sh/ruff/rules/root-logger-call/
lint.ignore = [ "D301", "D400", "ERA001", "LOG015" ]
# The default pattern wants a year, which the header carries none of.
lint.flake8-copyright.notice-rgx = "Copyright Kevin Deldycke <kevin@deldycke.com> and contributors\\."
lint.isort.combine-as-imports = true
# Allow rules to add `from __future__ import annotations` in cases where
# this would simplify a fix or enable a new diagnostic.
# https://docs.astral.sh/ruff/settings/#lint_future-annotations
lint.future-annotations = true
# Report rule codes, not the human-readable names preview mode defaults to.
# See the bundled repomatic/data/ruff.toml for the rationale.
output-prefer-rule-codes = true

[tool.typos]
# Correct capitalization for proper nouns, plus "PATCHed"
# and "PNGs": typos cuts an all-caps run before its trailing lowercase letters,
# so "PNGs" is checked as "PN" + "Gs" and rewritten to "ONGs", and "PATCHed" as
# "PATC" + "Hed" and rewritten to "PATCHead". Only an identifier accept
# suppresses either, since the checker never sees the whole word. Any acronym
# carrying a lowercase suffix needs its own entry here.
default.extend-identifiers = { Github = "GitHub", IOS = "iOS", Javascript = "JavaScript", MacOS = "macOS", PATCHed = "PATCHed", PNGs = "PNGs", PyPi = "PyPI", Typescript = "TypeScript" }
# False positives: "astroid" is a Python AST library (not "asteroid"); "certifi" is the CA bundle package a dependency graph lists under requests (not "certify"); "oject" appears when "pyproject.toml" is split across line breaks in CLI help output; "sur" is macOS 11 Big Sur and Homebrew's big_sur bottle tag (not "sure").
default.extend-words = { astroid = "astroid", certifi = "certifi", oject = "oject", sur = "sur", Contribuer = "Contribuer", quater = "quater" }
# Skip content between <!-- typos:off --> and <!-- typos:on --> markers.
default.extend-ignore-re = [ "(?s)<!-- typos:off -->.*?<!-- typos:on -->", "\\{qeury\\}", 'base32 "[0-9a-z]{52}"' ]
default.extend-ignore-identifiers-re = [
  # error: `WARNIN` should be `WARNING`
  #     ╭▸ ./tests/test_lint_changelog.py:533:46
  #     │
  # 533 │     # Both sources available — NOTE only, no WARNINGs.
  #     ╰╴
  "WARNIN",
]
# Check hidden files and directories too, which typos skips by default: the
# `.github/` workflows and the `.claude/` agents and skills live there.
files.ignore-hidden = false
# Hidden files bring in paths typos must never rewrite. `.git` holds the
# repository internals. `sync-gitignore` regenerates `.gitignore`, which also
# carries globs like `[Ii]nclude` that typos reads as a typo it cannot fix.
# `.mailmap` lists contributor names, where a fix renames a person.
files.extend-exclude = [ ".git", ".gitignore", ".mailmap" ]
# Skip the content of SVG files. A terminal capture renders each run of
# same-styled characters as one <text> element, so a word cut at a run boundary
# leaves a fragment the checker reads as a misspelling. Correcting it in place
# adds a letter to a run of fixed width, while the next run still carries the
# rest of the word, so the picture gains a doubled letter. typos ships an "svg"
# file type, so no glob is needed here. Filenames stay checked.
type.svg.check-file = false

[tool.mypy]
mypy_path = "docs"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
pretty = true
warn_unused_configs = true
overrides = [
  { module = [
    "py_walk.*",
    "sphinxcontrib.mermaid",
  ], ignore_missing_imports = true },
]

[tool.pytest]
addopts = [
  "--durations=10",
  "--cov",
  "--cov-report=term",
  # One worker per logical CPU: `auto` counts physical cores once psutil is
  # installed, which halves the workers on the x86 runners.
  "--numprocesses=logical",
  # `loadgroup` honours the `xdist_group` marker tests/test_sphinx_crossrefs.py
  # carries, which keeps its docs build on one worker. `load` ignores the marker.
  "--dist=loadgroup",
  # Import test modules via importlib instead of prepending their root dir to
  # sys.path. Avoids "import file mismatch" collection errors when an installed
  # copy of the package coexists with the source tree, as in distro builds.
  "--import-mode=importlib",
]
# https://docs.pytest.org/en/latest/customize.html#pyproject-toml
markers = [
  "once: Tests that only need to run once, not across the full CI matrix.",
]
# A config key pytest does not know, a marker this table does not declare, and
# two parametrize cases sharing one id fail collection instead of printing a
# warning that scrolls past.
strict_config = true
strict_markers = true
strict_parametrization_ids = true
# Restrict collection to the test suite, so pytest never descends into the
# package or an installed copy of it in dual-copy builds.
testpaths = [ "tests" ]
# Make sure tests that are expected to fail do not resurrect and start working all of a sudden.
xfail_strict = true

# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage]
run.source = [ "repomatic" ]
run.branch = true
# Coverage ratchet: the suite fails below this. Keep it about one point under
# the lowest matrix cell, and raise it when the cells climb. The cells agree
# within a tenth of a point, so a drop larger than the margin is a regression.
# A run from the sdist skips the repo_maintenance tests, and lands a quarter
# point under the matrix cells.
#
# The `once-tests` workflow job overrides this to 0: its slice covers only part
# of the package. A focused local run trips it too, so pair those with
# `--no-cov`.
report.fail_under = 96
report.precision = 2

[tool.bumpversion]
current_version = "8.0.0.dev0"
# Parse versions with an optional .devN suffix (PEP 440).
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(\\.dev(?P<dev>\\d+))?"
serialize = [
  "{major}.{minor}.{patch}.dev{dev}",
  "{major}.{minor}.{patch}",
]
ignore_missing_files = true
allow_dirty = true
parts.dev.optional_value = "release"
# When dev is "release" (its optional value), the .devN suffix is omitted.
# Bumping patch/minor/major resets dev to "0", producing X.Y.Z.dev0.
# Bumping dev goes from "0" to "release", stripping the suffix for release.
parts.dev.values = [ "0", "release" ]

[[tool.bumpversion.files]]
# Update Python package version in any __init__.py file.
glob = "./**/__init__.py"
ignore_missing_version = true

[[tool.bumpversion.files]]
# Update version in [project] section. Anchored to a line start (regex) so it
# does not also match version-suffixed keys like file-version/product-version
# under [tool.nuitka], which contain `version = "X"` as a substring (their
# values collide with the package version on release commits, where the .devN
# suffix is absent).
filename = "./pyproject.toml"
regex = true
search = '(?m)^version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
# Update version in download URL.
filename = "./pyproject.toml"
search = "releases/tag/v{current_version}"
replace = "releases/tag/v{new_version}"

[[tool.bumpversion.files]]
# Keep the numeric file-version/product-version under [tool.nuitka] in sync,
# when present. Nuitka rejects PEP 440 .devN suffixes, so the file-specific
# serialize strips them; the `-version = "` prefix matches both keys at once.
# ignore_missing_version makes this a no-op in projects without [tool.nuitka].
filename = "./pyproject.toml"
ignore_missing_version = true
serialize = [ "{major}.{minor}.{patch}" ]
search = '-version = "{current_version}"'
replace = '-version = "{new_version}"'

[[tool.bumpversion.files]]
# Update the version in Markdown changelog.
filename = "./changelog.md"
search = "## [`{current_version}` (unreleased)]("
replace = "## [`{new_version}` (unreleased)]("

[[tool.bumpversion.files]]
# Update the version in the citation file. Anchored to a line start (regex) so
# it does not also match the `cff-version:` schema field, which would otherwise
# be overwritten with the package version on every bump as soon as the two
# values coincide once.
filename = "./citation.cff"
regex = true
search = "(?m)^version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
# Update the release date in the citation file.
filename = "./citation.cff"
regex = true
search = "date-released: \\d{{4}}-\\d{{2}}-\\d{{2}}"
replace = "date-released: {utcnow:%Y-%m-%d}"

[tool.lychee]
# https://lychee.cli.rs/guides/config/
exclude = [
  # GitHub issue comment fragments are dynamically loaded and can't be verified.
  "^https://github.com/.+/issues/[0-9]+#issuecomment-.*$",
  # Release binary download URLs redirect to the GitHub CDN (objects.githubusercontent.com).
  "^https://github.com/.+/releases/.+/download/.*$",
  # Allow redirects of generic DOI URLs to their specific Zenodo release page.
  "^https://doi.org/.+/zenodo.*$",
  # Bitdefender returns 403 to bots.
  "bitdefender\\.com",
  # archive.ph rate-limits crawlers.
  "archive\\.ph",
  # Sci-Hub serves a certificate that fails validation. The bundled awesome-list
  # contributing guide points readers at it for research papers, in both its
  # English and Chinese versions, so this repository checks those links itself.
  "sci-hub\\.st",
  # npmjs.com returns 403 to bots.
  "^https://www\\.npmjs\\.com/package/.*$",
  # VirusTotal analysis pages are a JS app that rate-limits bots, and the
  # binaries page links one per released binary.
  "^https://www\\.virustotal\\.com/gui/.*$",
  # githubstatus.com returns 405 to HEAD requests from bots.
  "githubstatus\\.com",
  # The Cloudflare dashboard answers 403 to anyone not signed in, which every
  # crawler is. The setup guide and the Cloudflare page link it deliberately:
  # a `?to=/:account/...` URL resolves against whichever account the reader is
  # signed into, and pre-fills a token form no anonymous request can reach.
  "^https://dash\\.cloudflare\\.com/.*$",
  # Local intra-docs fragments, which lychee cannot judge. It reads the Markdown
  # source, which holds neither MyST `(target)=` labels nor the anchors that
  # directives like `{click:config}` generate at build time. And it computes
  # GitHub's slug (`cachedir` for `cache.dir`), where `docs/conf.py` pins
  # docutils' `make_id` (`cache-dir`). The Sphinx build checks these links
  # instead: `docs/conf.py` fails it on a `myst.xref_missing` warning.
  # Anchored to `file://` so external `.../docs/*.md#` URLs stay checked.
  # XXX: re-test once `lychee` ships lycheeverse/lychee#2250. See the `{todo}`
  # in `repomatic/tooling/registry.py`.
  "^file://.*/docs/[\\w.-]+\\.md#",
]
exclude_path = [
  # Template files contain $variable placeholders that are not real URLs.
  "repomatic/templates/",
]

[tool.repomatic]
abandoned-versions = [
  "4.1.0",
  "4.6.1",
  "4.7.0",
  "4.8.0",
  "5.0.0",
  "6.0.0",
  "6.18.0",
]
changelog.archive-location = "./docs/changelog-archive.md"
# Give every module its own reference page (`/repomatic.awesome_toc`) instead of
# stacking a package's modules onto one. Page length then follows the module it
# documents rather than the package it sits in, so the reference cannot grow
# unreadable as the package does. The guide pages carry the prose and link here.
docs.apidoc-extra-args = [ "--separate" ]
exclude = [ "workflows" ]
# No checked module imports Sphinx, so mypy would report the bundled override
# as an unused section.
lint-repo.declined.mypy.overrides.'{ module = ["sphinx.*"], ignore_missing_imports = true, follow_imports = "skip" }' = "No checked module imports Sphinx."
# Render the Click command tree as roff `.1` files and attach a
# `repomatic-manpages.tar.gz` asset to every GitHub release. The script target
# mirrors `click_extra_manpages` in `docs/conf.py`, so the release tarball and
# the HTML docs site stay in lockstep.
manpages.script = "repomatic.cli.main:repomatic"
# The comparison is logarithmic because the nearest peer outweighs repomatic by
# two orders of magnitude, and a linear axis draws every project but the largest
# two along the bottom edge.
metrics.charts = [
  { only = [ "repomatic" ], output = "./docs/assets/star-history.svg", title = "GitHub star history of repomatic" },
  { output = "./docs/assets/star-history-compared.svg", scale = "logarithmic", title = "GitHub star history of repomatic and its alternatives" },
]
metrics.store = "./docs/assets/metrics.csv"
# The alternatives the benchmark page tabulates, plus repomatic itself. Sampled
# weekly so the page's maintenance claims rest on a dated reading rather than on
# whenever someone last looked. Keyed by the name the benchmark's own columns
# use.
metrics.subjects.all-repos = "asottile/all-repos"
metrics.subjects.allstar = "ossf/allstar"
metrics.subjects.cookiecutter = "cookiecutter/cookiecutter"
metrics.subjects.copier = "copier-org/copier"
metrics.subjects.cruft = "cruft/cruft"
metrics.subjects.repomatic = "kdeldycke/repomatic"
metrics.subjects.safe-settings = "github/safe-settings"
metrics.subjects.semantic-release = "semantic-release/semantic-release"
metrics.subjects.settings = "repository-settings/app"
metrics.subjects.tf-github = "integrations/terraform-provider-github"
metrics.sync = true
pypi-package-history = [ "gha-utils", "repokit" ]
# Claude Code plugin archive packed by release.yaml's pack-plugin job and
# attached to every GitHub release by the engine's extra-assets job. The
# marketplace reads the plugin from the repository instead, so a release missing
# this asset still installs; what it strands is the offline install and the
# Claude Desktop upload, the only route to Cowork and claude.ai.
release-assets = [ "repomatic-claude-plugin.zip" ]
# Migration in progress: this repository dogfoods its own Cloudflare Pages lane
# on repomatic.net, so the feature reaches a release proven rather than
# theoretical. Until the Pages project and its API token exist, the Docs
# workflow's Cloudflare deploy and drift jobs fail and nothing publishes: that
# is the intended state, and the setup guide issue is what says so, closing on
# its own once the token lands. `site.cloudflare-project` stays unset on
# purpose, exercising the default that names the project after the repository.
site.deploy = "cloudflare-pages"
# One cell resolves every direct dependency to the lowest version its specifier
# allows, on the floor Python of the fastest runner. The lockfile holds the
# newest release of each, so no other cell runs a declared floor.
test-matrix.full-include = [
  { os = "ubuntu-26.04-arm", python-version = "3.11", resolution = "lowest-direct" },
]

[tool.actionlint]
# actionlint reads no pyproject section of its own: repomatic serializes this one
# to a temporary YAML config and passes it via `--config-file`.
#
# actionlint validates a literal `runs-on:` against a built-in label list that
# does not yet carry GitHub's Ubuntu 26.04 images, so it rejects them as
# unknown. Declaring them here is the mechanism actionlint's own error message
# points to. They are ordinary GitHub-hosted images, not self-hosted runners:
# that key is simply where actionlint accepts a label it does not ship. Drop
# this entry once rhysd/actionlint#682 ships in a release. Meanwhile it opens no
# hole: a typo'd runner is still caught by `lint-repo`'s own check against
# KNOWN_RUNNERS.
self-hosted-runner.labels = [ "ubuntu-26.04", "ubuntu-26.04-arm" ]
