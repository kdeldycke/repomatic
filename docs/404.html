<!DOCTYPE html>
<!--
  Served for any path the site does not publish. Copied verbatim into the build
  by `html_extra_path` in `conf.py`, and picked up by both hosts this site has
  run on: GitHub Pages and Cloudflare Pages each answer an unmatched route with
  `/404.html`. Without it, Cloudflare falls back to the home page and answers
  `200`, which tells a crawler that every misspelled URL is a real one.

  Deliberately self-contained: no theme, no stylesheet, no script. A 404 is
  reached from arbitrary depth, so a relative asset path would break on half of
  them, and a page whose job is to explain a missing file should not depend on
  another file being found. The three colors are the brand ink and wash of
  `assets/logo-square.svg`, plus the next step down the same zinc scale for the
  dark background.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found - Repomatic</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.6;
    color: #27272a;
    background: #ffffff;
  }
  main { max-width: 32rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
  p { margin: 0 0 1.5rem; }
  a { color: #27272a; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: inline-block; margin: 0 0.75rem; }
  @media (prefers-color-scheme: dark) {
    body { color: #d4d4d8; background: #18181b; }
    a { color: #d4d4d8; }
  }
</style>
</head>
<body>
<main>
  <h1>This page does not exist</h1>
  <p>
    Cloudflare Pages serves these pages without their <code>.html</code>
    extension, so <code>/install.html</code> answers at <code>/install</code>.
    Old links redirect on their own, which means this one was probably mistyped
    or has been retired.
  </p>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/install">Installation</a></li>
    <li><a href="/search">Search</a></li>
  </ul>
</main>
</body>
</html>
