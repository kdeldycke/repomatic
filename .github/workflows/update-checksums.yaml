---
# Async fallback for the tool registry checksum update.
#
# The primary path is atomic: Renovate's postUpgradeTask (renovate.json5)
# bumps the version in repomatic/tool_runner.py and writes the matching
# checksums to the separate repomatic/tool_checksums.py sidecar, so both land
# in one branch before the PR opens (the separate file sidesteps the same-file
# drop of https://github.com/renovatebot/renovate/discussions/42263). This
# workflow is the belt-and-suspenders backup: it runs after Renovate's push,
# recomputes the hashes, and commits any correction to the PR branch. When the
# primary path already wrote the right hashes it finds nothing stale and no-ops.
#
# This workflow is repomatic-internal: it patches files that only exist in this
# repo. It is intentionally excluded from the downstream workflow registry in
# registry.py.
name: 🔄 Update checksums
"on":
  # Allow manual runs to recompute checksums on a Renovate branch when the
  # auto-trigger below was missed.
  workflow_dispatch:
  push:
    branches:
      - "renovate/**"
    paths:
      - "repomatic/tool_checksums.py"
      - "repomatic/tool_runner.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

jobs:

  update-checksums:
    name: 🔄 Update checksums
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Push with REPOMATIC_PAT so the fix commit triggers CI checks
          # on the updated PR branch. The resulting push re-triggers this
          # workflow, but update-checksums finds no stale hashes and
          # git diff --quiet exits cleanly: no infinite loop.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Update stale registry checksums
        # Must use `uv run` (not `uvx --from .`). uvx builds an isolated
        # wheel where __file__ points to a temp site-packages path, so
        # update-checksums writes the new hashes there instead of the git
        # working tree. `uv run` installs in editable mode: __file__
        # resolves to the checkout, and git diff can see the changes.
        # No version pin needed: the workflow runs on this repo's own
        # source, so the CLI version is always the checked-out commit.
        run: uv --no-progress run --frozen -- repomatic update-checksums --registry
      - name: Commit and push if changed
        run: |
          git diff --quiet repomatic/tool_checksums.py && exit 0
          git config user.name "$(git log -1 --format='%cn')"
          git config user.email "$(git log -1 --format='%ce')"
          git add repomatic/tool_checksums.py
          git commit -m 'Update tool registry checksums'
          git push
