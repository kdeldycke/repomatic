---
# Repomatic's own release entry, identical in shape to what every downstream
# repo gets. It splits the release into two reusable lanes plus a PyPI publish:
#   build:        _release-build.yaml  (squash guard, metadata, package build)
#   publish-pypi: this file            (OIDC Trusted Publishing, needs: build)
#   release:      _release-engine.yaml (binaries, tag, draft, publish, scan)
#
# publish-pypi depends only on the build lane, so the wheel ships to PyPI right
# after it is built instead of waiting for binary compilation. The engine lane
# also depends on build: it reads the build lane's metadata as its `metadata`
# input, and its create-release/sync-dev-release jobs download the run-scoped
# wheel the build lane produced.
#
# publish-pypi lives in THIS file (not the engine) so the OIDC `job_workflow_ref`
# claim resolves to release.yaml: the workflow filename repomatic and every
# downstream register with PyPI's Trusted Publisher. See pypi/warehouse#11096
# and docs/workflows.md.
#
# This whole file is the codegen source for downstream callers:
# repomatic.github.workflow_sync copies these jobs and rewrites the local
# `uses: ./` references to pinned cross-repo refs (and drops the publish-pypi
# checkout). Edit the jobs with that downstream derivation in mind.
name: 🚀 Build & release
"on":
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Weekly full-fleet build: ordinary pushes only compile the
    # `[tool.repomatic] nuitka.dev-targets` canary subset, so this run is
    # what rebuilds every target between releases. It refreshes the dev
    # pre-release with all binaries, keeps each target's Nuitka compile
    # cache warm (actions/cache evicts entries unused for 7 days), and
    # surfaces platform-specific build breakage before release day. Batched
    # with autolock.yaml's Monday-night slot to group the weekly jobs.
    - cron: "43 0 * * 1"

permissions: {}

concurrency:
  # Declared on this push-triggered entry, not the reusable _release-engine.yaml it
  # calls: GitHub decides run cancellation from the entry workflow's group, and a
  # block on the engine lane (reached via `needs: build`) joins its group too late
  # to cancel queued or building runs. Regular commits share a per-branch group and
  # cancel each other; release commits ([changelog] Release / Post-release) get a
  # unique SHA-based group so an in-flight release is never cancelled by a later push.
  # Scheduled and manually dispatched runs get a run-scoped group: they build the
  # full target fleet on purpose, so neither a later push nor another run should
  # cancel them (a dispatch sharing the branch group was observed cancelled mid-build
  # by the next push), and they never cancel a push run either.
  group: >-
    ${{ github.workflow }}-${{
      (
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        && github.run_id
      )
      || (
        (startsWith(github.event.head_commit.message, '[changelog] Release')
        || startsWith(github.event.head_commit.message, '[changelog] Post-release'))
        && github.sha
      )
      || github.ref
    }}
  cancel-in-progress: true

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See https://repomatic.net/workflows#install-time-cooldown for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  build:
    # Local reusable call: repomatic builds with its own current fast lane
    # rather than a published ref.
    # XXX Workspace-relative rather than GitHub's `$/` self-repository syntax,
    # which actionlint rejects: https://github.com/rhysd/actionlint/issues/711
    uses: ./.github/workflows/_release-build.yaml # zizmor: ignore[self-repository]
    # The top-level `{}` grants a reusable-call job nothing, so name the union of
    # the scopes its nested jobs request: squashed-release needs issues:write,
    # build-package needs id-token:write (OIDC build provenance).
    permissions:
      id-token: write
      issues: write

  publish-pypi:
    name: 🐍 Publish to PyPI (${{ matrix.short_sha }})
    needs: build
    # Gate decoupled from the run's overall result: always() lets this job run even when an unrelated job (like binary
    # tests in the engine lane) failed the run, and package_built confirms the wheel actually built, so a cleanly-built
    # wheel still publishes. Both signals come from the build lane (_release-build.yaml).
    if: >-
      always()
      && needs.build.outputs.package_built == 'true'
      && needs.build.outputs.release_commits_matrix
    strategy:
      # GitHub evaluates `strategy.matrix` during job setup even when `if:` will skip the job. On a non-release push
      # the build lane emits an empty string for `release_commits_matrix` (not "null": see its output description for
      # why). A bare `fromJSON('')` aborts the whole run with "Unexpected value ''", so we fall back to an empty
      # `{"include":[]}` matrix, which expands the job to zero runs and skips it cleanly.
      matrix: ${{ fromJSON(needs.build.outputs.release_commits_matrix || '{"include":[]}') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # OIDC only: the PyPI Trusted Publishing token. The GitHub release notes
      # (with their PyPI admonition) are owned end to end by the engine lane's
      # create-release job, so this lane needs no write access to the repo.
      id-token: write
    steps:
      # Local composite action, checked out at the release commit, so repomatic
      # publishes with the same code it is releasing rather than a published ref.
      # `$/` would resolve against the workflow's own commit and ignore that
      # checkout, so this ref stays workspace-relative even once actionlint
      # accepts `$/`. See _SELF_REPOSITORY_IGNORE_RE in
      # repomatic/github/workflow_sync.py.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: ./.github/actions/publish-pypi # zizmor: ignore[self-repository]
        with:
          artifact-name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}

  release:
    # Local reusable call: repomatic releases with its own current engine rather
    # than a published ref. Gated on the build lane so create-release and
    # sync-dev-release can download the run-scoped wheel the build lane uploaded.
    # Also gated on pack-plugin, whose artifact the engine's extra-assets job
    # downloads: run artifacts are run-scoped, so it must exist before the engine
    # starts. That edge is repomatic's own and never reaches a downstream caller,
    # which has no pack-plugin job (see _generate_release_caller).
    # XXX Workspace-relative rather than GitHub's `$/` self-repository syntax,
    # which actionlint rejects: https://github.com/rhysd/actionlint/issues/711
    uses: ./.github/workflows/_release-engine.yaml # zizmor: ignore[self-repository]
    needs:
      - build
      - pack-plugin
    # The engine reads the build lane's metadata rather than computing it again.
    with:
      metadata: ${{ needs.build.outputs.metadata }}
    # Union of the engine jobs' scopes (the top-level `{}` grants nothing on its
    # own): compile-binaries needs id-token + attestations (plus contents:read)
    # and actions:write for its compile-cache prune, create-tag /
    # create-release / manpages / publish-release / scan-virustotal /
    # sync-dev-release need contents:write, and scan-virustotal needs
    # pull-requests:write for its PR.
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
      pull-requests: write
    secrets:
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  # Pack the bundled skills and agents as a Claude Code plugin and hand it to the
  # release engine's extra-assets job as a `release-asset-*` run artifact (see
  # `release-assets` in [tool.repomatic]). Placed after the `release` caller on
  # purpose: repomatic-local jobs belong below the managed lanes, which is also
  # where `repomatic init` keeps a downstream repo's own jobs.
  #
  # The job itself is unconditional, with no `if:` and no matrix, because `release`
  # needs it: a skip here would cascade into skipping the whole engine on regular
  # pushes, taking sync-dev-release with it. The artifact is only consumed on a
  # release push, so its steps are gated on one instead.
  pack-plugin:
    name: 🧩 Pack Claude Code plugin
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: fromJSON(needs.build.outputs.metadata).is_release_push
        with:
          # A release push carries the freeze commit *and* the post-release `.devN` bump, so `main` HEAD declares the
          # version after the one being released. `pack-plugin` stamps `__version__` into the manifest it archives, so
          # it has to run on the freeze commit or the published plugin advertises a `.devN` that was never released.
          ref: ${{ fromJSON(needs.build.outputs.metadata).release_commit }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: fromJSON(needs.build.outputs.metadata).is_release_push
        with:
          version: "0.13.0"
      # No --output: its default is the same filename `release-assets` declares,
      # and spelling it here would push the line past yamllint's cap once the
      # release freeze splices the pinned invocation in.
      - name: Pack plugin
        if: fromJSON(needs.build.outputs.metadata).is_release_push
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' pack-plugin
      - name: Upload plugin artifact
        if: fromJSON(needs.build.outputs.metadata).is_release_push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset-repomatic-claude-plugin.zip
          path: repomatic-claude-plugin.zip
