---
# Repomatic's own release entry, identical in shape to what every downstream
# repo gets: it triggers on push, calls the reusable _release-engine.yaml, then
# publishes to PyPI from a job in THIS file so the OIDC `job_workflow_ref` claim
# resolves to release.yaml: the workflow filename repomatic and every downstream
# register with PyPI's Trusted Publisher. Keeping publish-pypi out of the engine
# is what makes this work everywhere. See pypi/warehouse#11096 and
# docs/workflows.md.
name: 🚀 Build & release
"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  release:
    # Local reusable call: repomatic builds and releases with its own current
    # engine rather than a published ref.
    uses: ./.github/workflows/_release-engine.yaml
    secrets:
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  publish-pypi:
    name: 🐍 Publish to PyPI (${{ matrix.short_sha }})
    needs: release
    if: >-
      always()
      && needs.release.outputs.package_built == 'true'
      && needs.release.outputs.release_commits_matrix
    strategy:
      matrix: ${{ fromJSON(needs.release.outputs.release_commits_matrix || '{"include":[]}') }}
    runs-on: ubuntu-slim
    permissions:
      id-token: write
      # Lets the admonition step below edit the published release notes.
      contents: write
    steps:
      # Local composite action, checked out at the release commit, so repomatic
      # publishes with the same code it is releasing rather than a published ref.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.commit }}
      - uses: ./.github/actions/publish-pypi
        with:
          artifact-name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}
      # Backfill the "available on PyPI" admonition onto the release notes after
      # a successful OIDC upload, matching the downstream caller fragment.
      - name: Add PyPI admonition to release notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          RELEASE_NOTES: ${{ needs.release.outputs.release_notes_with_admonition }}
        run: >
          gh release edit "v${CURRENT_VERSION}"
          --notes-file -
          --repo "${{ github.repository }}" <<< "${RELEASE_NOTES}"
