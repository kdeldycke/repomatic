---
name: 🔬 Tests
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - repomatic/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yaml
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs — see
      # https://github.com/actions/runner/issues/1591. The real skip is the
      # `github.head_ref` check in the `metadata` job's `if:` below. Kept
      # here as documentation of intent.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    paths:
      - repomatic/**
      - tests/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/tests.yaml
  schedule:
    # Run tests monthly to catch regressions from dependency or environment changes.
    - cron: "17 9 1 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

jobs:

  metadata:
    name: 🧬 Project metadata
    # Skipping this job propagates to every `needs: metadata` job below.
    # The `pull_request.branches-ignore` filter above matches the PR's base
    # branch (always `main`), not its head branch (see
    # https://github.com/actions/runner/issues/1591), so the version-bump
    # PRs slip through it and must be filtered here via `github.head_ref`.
    # The branch list mirrors `repomatic.binary.VERSION_BUMP_BRANCHES` and
    # is pinned by tests/test_workflows.py.
    #
    # The `[changelog] Post-release bump ` commit prefix is intentionally
    # *not* in this list: that push also carries the release commit, and
    # the post-release-bump head commit is our only post-merge test of the
    # release-frozen tree. The commit-prefix list mirrors
    # `MANUAL_VERSION_BUMP_COMMIT_PREFIXES` and is pinned by
    # tests/test_workflows.py::test_tests_metadata_gate_skips_manual_bumps.
    if: >
      !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
      && !startsWith(github.event.head_commit.message || '', 'Bump major version to ')
      && !startsWith(github.event.head_commit.message || '', 'Bump minor version to ')
    runs-on: ubuntu-slim
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress 'repomatic==6.31.0' metadata
          --format github-json --output "$GITHUB_OUTPUT"
          build_targets cli_scripts coverage_cells package_name
          test_matrix test_matrix_pr

  tests:
    needs:
      - metadata
    strategy:
      # Info-gathering matrix with per-cell continue-on-error deciding what
      # fails the workflow: see docs/workflows.md "Matrix fail-fast strategy".
      fail-fast: false
      # Matrix is pre-computed by repomatic metadata. PRs get a reduced matrix
      # (fewer OS variants and Python versions) to save CI minutes.
      matrix: >-
        ${{ github.event_name != 'pull_request'
        && fromJSON(needs.metadata.outputs.metadata).test_matrix
        || fromJSON(needs.metadata.outputs.metadata).test_matrix_pr }}
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }} / py${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-tags: true
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Force native ARM64 Python on Windows ARM64
        # Workaround for https://github.com/astral-sh/uv/issues/12906: uv defaults to x86_64 Python on ARM64 Windows,
        # relying on transparent emulation, so the windows-11-arm cell would silently test emulated x86_64 Python
        # instead of native ARM64. Setting UV_PYTHON to an architecture-qualified specifier forces uv (and uvx) to use
        # native ARM64 Python for all steps. (validate-arch checks the runner image, not this job's interpreter.)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: echo "UV_PYTHON=cpython-${PYTHON_VERSION}-aarch64" >> "$GITHUB_ENV"
      - name: Install Python ${{ matrix.python-version }}
        # If UV cannot find the requested Python version, it exits with code 2, which let the job pass unnoticed on
        # Windows. So we force the shell to bash, even on Windows, and "set -e" to ensure any error in the install
        # process is caught and fails the job. It works because Windows runners too Git Bash available).
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          set -e
          uv --no-progress venv --python "${UV_PYTHON:-${PYTHON_VERSION}}"
      - name: Force UTF-8 encoding on Windows
        # Workaround for https://github.com/pallets/click/issues/2121: Windows GitHub Actions runners
        # redirect command output to files, which sets the encoding to the system default (cp1252).
        # Python CLI frameworks like Click then raise UnicodeEncodeError on non-ASCII output.
        if: runner.os == 'Windows'
        shell: bash
        run: echo "PYTHONIOENCODING=utf8" >> "$GITHUB_ENV"
      - name: Install project
        run: uv --no-progress sync --frozen --all-extras --group test

      - name: Unittests
        # Produce the coverage XML artifact consumed by the Codecov upload below.
        run: >
          uv --no-progress run --frozen -- pytest
          --cov-report=xml

      - name: Upload coverage to Codecov
        # Upload coverage only from the coverage-distinct cells: one runner per
        # OS at released Python (the `coverage_cells` set, mirroring the PR
        # matrix). Coverage depends on OS family and Python version, never CPU
        # architecture, so architecture twins, prerelease, and free-threaded
        # cells run the suite but produce coverage already captured by these.
        #
        # coverage_cells arrives as a space-joined string of `os|python-version`
        # tokens (the GitHub list-output convention), so the membership test
        # pads both operands with spaces to match a whole token, not a substring.
        #
        # Also skip sync-repomatic PRs (data-only changes with no coverable
        # lines) and fork PRs (secrets are not available). The version-bump PR
        # family is already filtered by the metadata job's `github.head_ref`
        # gate above.
        if: >
          github.head_ref != 'sync-repomatic'
          && env.CODECOV_TOKEN != ''
          && contains(format(' {0} ', fromJSON(needs.metadata.outputs.metadata).coverage_cells),
          format(' {0}|{1} ', matrix.os, matrix.python-version))
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        shell: bash
        run: >
          uvx --no-progress 'codecov-cli==11.2.8'
          --auto-load-params-from githubactions
          upload-process
          --git-service github
          --report-type coverage
          --token "${CODECOV_TOKEN}"

      - name: Self-tests against test suite
        # click-extra owns the test-suite engine and CLI; it reads the suite from
        # ./tests/cli-test-suite.toml (the click-extra 8.1 default, parsed with the
        # built-in tomllib so no extra is needed). `--jobs max` runs cases across every
        # logical core. The outer `uv run` provides the environment, avoiding per-case
        # uv lock contention between parallel workers. The target is this repo's own
        # console script (from repomatic metadata), so the self-test stays correct when
        # this workflow is synced to downstream repos.
        # Skipped for repos that ship no console script (nothing to self-test).
        if: fromJSON(needs.metadata.outputs.metadata).cli_scripts[0]
        env:
          CLI_SCRIPT: ${{ fromJSON(needs.metadata.outputs.metadata).cli_scripts[0] }}
        run: >
          uv run --frozen --no-progress --
          click-extra test-suite --command "${CLI_SCRIPT}" --jobs max

  test-package-install:
    name: 📦 Package install
    needs:
      - metadata
    # Installs from PyPI/GitHub (released version), not the PR code.
    if: >-
      github.event_name != 'pull_request'
      && fromJSON(needs.metadata.outputs.metadata).cli_scripts
    runs-on: ubuntu-slim
    env:
      CLI_SCRIPTS: ${{ fromJSON(needs.metadata.outputs.metadata).cli_scripts }}
      GIT_URL: git+https://github.com/${{ github.repository }}
      PACKAGE: ${{ fromJSON(needs.metadata.outputs.metadata).package_name }}
    steps:
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Install Python
        run: uv --no-progress venv --python 3.14
      - name: Run stable CLI
        run: |
          for script in $CLI_SCRIPTS; do
            uvx "$script" --version
            uvx --from "$PACKAGE" -- "$script" --version
            uv run --with "$PACKAGE" -- "$script" --version
          done
          module=$(echo "$PACKAGE" | tr '-' '_')
          uv run --with "$PACKAGE" -m "$module" --version
          uv run --with "$PACKAGE" python -m "$module" --version
      - name: Run dev CLI
        run: |
          for script in $CLI_SCRIPTS; do
            uvx --from "$GIT_URL" -- "$script" --version
          done
          module=$(echo "$PACKAGE" | tr '-' '_')
          uvx --from "$GIT_URL" -- python -m "$module" --version
      - name: Run stable CLI via uv tool
        run: |
          uv --no-progress tool install "$PACKAGE"
          for script in $CLI_SCRIPTS; do
            "$script" --version
          done
          uv --no-progress tool uninstall "$PACKAGE"
      - name: Run dev CLI via uv tool
        run: |
          uv --no-progress tool install "$GIT_URL"
          for script in $CLI_SCRIPTS; do
            "$script" --version
          done
          uv --no-progress tool uninstall "$PACKAGE"
      - name: Run stable CLI via pip
        run: |
          uv --no-progress pip install "$PACKAGE"
          for script in $CLI_SCRIPTS; do
            .venv/bin/"$script" --version
          done
          uv --no-progress pip uninstall "$PACKAGE"
      - name: Run dev CLI via pip
        run: |
          uv --no-progress pip install "$GIT_URL"
          for script in $CLI_SCRIPTS; do
            .venv/bin/"$script" --version
          done
          uv --no-progress pip uninstall "$PACKAGE"
      - name: Run CLI via pipx
        run: |
          uv --no-progress tool install pipx
          for script in $CLI_SCRIPTS; do
            pipx run "$script" --version
            pipx run --spec "$PACKAGE" "$script" --version
            pipx run --spec "$GIT_URL" "$script" --version
          done
          uv --no-progress tool uninstall pipx

  validate-arch:
    # Check architecture matches the one expected from the runner image. This is to ensure that the OS does not rely on
    # emulation to run the build. See:
    # https://docs.astral.sh/uv/concepts/python-versions/#transparent-x86_64-emulation-on-aarch64
    name: 🖥️ Validate ${{ matrix.os }} / ${{ matrix.arch }}
    needs:
      - metadata
    # Architecture validation is static; skip on PRs.
    if: >-
      github.event_name != 'pull_request'
      && fromJSON(needs.metadata.outputs.metadata).build_targets
    strategy:
      matrix:
        include: ${{ fromJSON(fromJSON(needs.metadata.outputs.metadata).build_targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check Python version
        run: |
          python --version
          python -m pip --version
      - name: Check architecture is ${{ matrix.arch }}
        shell: python
        run: |
          import platform

          arch = platform.machine()
          print(f"Detected architecture: {arch}")

          matrix_arch = "${{ matrix.arch }}"
          if matrix_arch == "x64":
              assert arch.lower() in ("x86_64", "amd64")
          elif matrix_arch == "arm64":
              assert arch.lower() in ("aarch64", "arm64")
          else:
              raise ValueError(f"Unrecognized architecture in the matrix: {matrix_arch}")