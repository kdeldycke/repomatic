# Cancels in-progress and queued workflow runs when a PR is closed.
#
# GitHub Actions does not cancel PR-triggered runs on PR close. The concurrency mechanism only
# cancels runs when a *new* run enters the same group, and closing a PR doesn't fire a new
# pull_request event for workflows using default activity types (opened, synchronize, reopened).
# This wastes CI resources, especially for long-running jobs like Nuitka binary builds.
---
name: ✂️ Cancel runs
"on":
  workflow_call:
  pull_request:
    types:
      - closed

permissions: {}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  cancel-runs:
    name: ✂️ Cancel PR runs
    if: github.event.pull_request.number
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      # Only needed on the upstream repo to build from source (--from .).
      # Downstream thin callers point to a tagged release where the version
      # is frozen to a PyPI pin, so no checkout is required.
      - if: github.repository == 'kdeldycke/repomatic'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Downstream runs have no checkout (the uvx call below is frozen to a PyPI pin at
          # release time), so the workdir is empty by design and there are never dependency
          # files for the default cache-dependency-glob to key on: the cache would never
          # invalidate.
          enable-cache: false
          ignore-empty-workdir: true
          version: "0.12.4"
      - name: Cancel in-progress runs for PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Pass the head ref through an env var: interpolating it directly into the run script
          # would be a code-injection vector (branch names are attacker-controlled).
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        # See repomatic/github/actions.py for the cancellation logic.
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.15.0' cancel-runs
          --branch "$PR_BRANCH"
          --current-run-id '${{ github.run_id }}'
