---
name: 🧹 Lint
"on":
  workflow_call:
    # The Cloudflare token is read only to report whether it exists: the
    # lint-repo job below cannot deploy anything, and never sees a value it
    # does not already have a name for.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      REPOMATIC_NOTIFICATIONS_PAT:
        required: false
      REPOMATIC_PAT:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false
  workflow_dispatch:
  push:
    branches:
      - main
    # Skip push events that only touch files no lint job inspects.
    # Per-job `*_changed` gates already prevent each linter from running
    # for unrelated changes; this filter additionally prevents the
    # workflow run entry from being scheduled at all when the entire
    # push is irrelevant. Keep this list strict: any file type any lint
    # job consumes must NOT appear here.
    paths-ignore:
      - "**/*.gif"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.webp"
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs: see
      # https://github.com/actions/runner/issues/1591. Kept here as
      # documentation of intent, since the skip only becomes real through a
      # `github.head_ref` check on a job's `if:`, propagated through `needs:`.
      - major-version-increment
      - minor-version-increment
      - prepare-release

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  metadata:
    name: 🧬 Project metadata
    # Skipping this job propagates to every `needs: metadata` job below,
    # so the entire workflow costs zero runner minutes for version-bump
    # PRs (head_ref check) AND their post-merge `push` to main / downstream
    # workflow_call invocations (commit-message check). The PR branch list
    # must stay in sync with repomatic.git_ops.VERSION_BUMP_BRANCHES; the
    # single commit-message clause relies on
    # repomatic.git_ops.CHANGELOG_COMMIT_PREFIX marking every machine-authored
    # version-machinery commit. Both enforced by repomatic's own test suite.
    if: >
      !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
      && !startsWith(github.event.head_commit.message || '', '[changelog] ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' metadata
          --format github-json --output "$GITHUB_OUTPUT"
          is_bot is_python_project python_files
          yaml_changed zsh_changed zsh_files
          workflows_changed npm_min_release_age_days

  lint-repo:
    name: 🏠 Lint repo
    needs:
      - metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Lint repository metadata
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN && 'true' || '' }}
          HAS_REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT && 'true' || '' }}
          HAS_VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY && 'true' || '' }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' lint-repo

  lint-types:
    name: 🛡️ Lint types
    needs:
      - metadata
    # Skip when no Python files are present. Version-bump PRs are already
    # filtered upstream by the metadata job's `if:` gate.
    if: fromJSON(needs.metadata.outputs.metadata).python_files
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Install all package dependencies
        # --all-extras and --all-groups are required as Mypy will check all Python files of the project, including
        # those related to optional features, tests, development and documentation.
        # Skip for non-Python projects (no pyproject.toml/uv.lock) where mypy can still lint standalone scripts.
        if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        run: uv --no-progress sync --frozen --all-extras --all-groups
      - name: Run Mypy
        # No file list: the tool runner resolves mypy's targets from the same
        # inventory this workflow's `python_files` comes from. See
        # `ToolSpec.default_paths` in repomatic/tooling/tool_registry.py.
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' run mypy

  lint-yaml:
    name: 📄 Lint YAML
    needs:
      - metadata
    # Skip when this event didn't touch any YAML file, and on bot PRs
    # (which don't heavily alter YAML).
    if: >
      (! fromJSON(needs.metadata.outputs.metadata).is_bot)
      && fromJSON(needs.metadata.outputs.metadata).yaml_changed
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run yamllint
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' run yamllint

  lint-zsh:
    name: 🐚 Lint Zsh
    needs:
      - metadata
    # Skip when this event didn't touch any Zsh file, and on bot PRs.
    if: >
      (! fromJSON(needs.metadata.outputs.metadata).is_bot)
      && fromJSON(needs.metadata.outputs.metadata).zsh_changed
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh
      - name: Lint
        env:
          ZSH_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).zsh_files }}
        run: echo "${ZSH_FILES}" | xargs -n1 zsh --no-exec

  lint-github-actions:
    name: ⚡ Lint GitHub Actions
    needs:
      - metadata
    # Skip when this event didn't touch any workflow file, and on
    # dependency update PRs (which don't heavily alter workflows).
    if: >
      (! fromJSON(needs.metadata.outputs.metadata).is_bot)
      && fromJSON(needs.metadata.outputs.metadata).workflows_changed
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-actionlint-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-actionlint-
      - name: Install shellcheck
        run: >
          sudo apt-get update
          && sudo apt-get install --yes --no-install-recommends shellcheck
      - name: Setup problem matcher
        # Source: https://github.com/rhysd/actionlint/blob/main/docs/usage.md#problem-matchers
        run: |
          curl -fsSL --output ./.github/actionlint-matcher.json \
            https://raw.githubusercontent.com/rhysd/actionlint/refs/tags/v1.7.12/.github/actionlint-matcher.json
          echo "::add-matcher::.github/actionlint-matcher.json"
      - name: Run actionlint
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' run actionlint

  lint-workflow-security:
    name: 🔒 Lint workflow security
    needs:
      - metadata
    # Skip when this event didn't touch any workflow file, and on bot PRs.
    if: >
      (! fromJSON(needs.metadata.outputs.metadata).is_bot)
      && fromJSON(needs.metadata.outputs.metadata).workflows_changed
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run zizmor
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' run zizmor

  lint-awesome:
    name: 🌟 Lint awesome
    needs:
      - metadata
    if: startsWith(github.event.repository.name, 'awesome-')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history to please linter's age checks.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Provision npm for the min-release-age cooldown
        # `repomatic run awesome-lint` installs awesome-lint with npm's
        # min-release-age cooldown, which needs npm 11.10.0+; older npm ignores
        # it, so provision a new-enough npm the way setup-uv provisions uv.
        # sync-workflow-pins bumps this pin like any npm literal, so `npm@X.Y.Z`
        # must stay right after `install` (its regex misses it otherwise) and the
        # flags trail. The flag set mirrors `_install_npm` (tool_runner.py).
        # Cooldown flows through an env var (npm's own `npm_config_min-release-age`
        # has a shell-hostile hyphen) sourced from the metadata job; enforcing it
        # here is belt-and-suspenders, ready if npm ever live-resolves the tree.
        env:
          NPM_MIN_RELEASE_AGE: ${{ fromJSON(needs.metadata.outputs.metadata).npm_min_release_age_days }}
        run: > # zizmor: ignore[adhoc-packages]
          npm install npm@12.0.2 --global --ignore-scripts --no-progress
          --no-update-notifier --no-fund --no-audit
          --min-release-age="$NPM_MIN_RELEASE_AGE"
      - name: Run awesome-lint
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' run awesome-lint

  lint-secrets:
    name: 🔐 Lint secrets
    needs:
      - metadata
    # Skip dependency update PRs.
    if: ${{ ! fromJSON(needs.metadata.outputs.metadata).is_bot }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-gitleaks-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-gitleaks-
      - name: Run gitleaks
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0'
          run gitleaks -- detect --source .
