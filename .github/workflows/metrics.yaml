# Accumulates what forges say about the repositories a project tracks: star
# counts over time, and the release and commit dates behind an activity reading.
#
# GitHub restricted its stargazer endpoints to a repository's own admins on
# 2026-06-30 (REST) and 2026-07-17 (GraphQL), which killed every third-party
# star chart on the web. The aggregate count stayed public, so this job
# snapshots it weekly and commits the result: a history that accrues in the
# repository cannot be revoked upstream.
#
# Only the sampling needs the network. Whatever renders the data reads the
# committed CSV and SVG, so a docs build stays hermetic.
#
# See repomatic/metrics.py for the collection rationale, repomatic/forge.py for
# the per-forge readers, and repomatic/metric_chart.py for the rendering.
---
name: "\U0001F4C8 Forge metrics"
"on":
  workflow_call:
    secrets:
      REPOMATIC_PAT:
        required: false
  workflow_dispatch:
  schedule:
    # Weekly: the charts plot multi-year trends, so a finer cadence would only
    # add commits without moving a curve. Deliberately never on push, since
    # sampling the same value twice in a day writes the same row.
    - cron: "41 5 * * 2"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  sample-metrics:
    name: "\U0001F4C8 Sample forge metrics"
    runs-on: ubuntu-26.04
    # Wider than the default: an exact star reconstruction pages through every
    # star a repository holds, one API call per hundred.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request is opened with this token, and one opened with the
          # default token triggers no `pull_request` workflow: the conformance
          # test guarding the store would never run on the branch carrying it.
          # Without the PAT the sampling still runs and the publishing is what
          # fails, which is the loud half: a silent skip would look like a
          # repository nobody stars.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"

      # `gh` inherits this token to read the aggregate counts, and the per-star
      # timestamps of the repositories it administers, which only an admin
      # token still sees. Every other forge is read anonymously.
      #
      # `--carry-from` names the branch below, so the store is read back from
      # the open pull request before this run appends to it: a reading cannot
      # be fetched twice, and measuring against the default branch alone would
      # drop every one still waiting there. See `carry_pr_branch_paths` in
      # repomatic/github/pr.py for why the charts need no such carrying.
      - name: Sample forge metrics
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic --verbosity INFO
          sample-metrics --carry-from sample-metrics

      # Nothing new to publish is the common case between two stars, and
      # `pr-sync` is idempotent, so the guard is in the command rather than in
      # an `if:` here. The whole tree is committed rather than a path list: the
      # store and the charts live wherever `[tool.repomatic.metrics]` puts them,
      # which this workflow cannot know, and the step above is the only writer
      # in a pristine checkout.
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sample-metrics
