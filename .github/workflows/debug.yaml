---
name: 🩺 Debug
"on":
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/debug.yaml
  schedule:
    # Run monthly on the 1st at 12:00 UTC to spot silent regressions.
    - cron: "0 12 1 * *"

permissions: {}

env:
  # bump-my-version caps click at <8.4; click-extra>=7.18 requires >=8.4.1.
  # [tool.uv] override-dependencies is not read by uvx --from ., so propagate
  # the override via UV_OVERRIDE. The override is safe: we only import
  # bump-my-version's config-loading helpers, none of which touch Click 8.4-
  # sensitive code. See uv-overrides.txt for the full rationale.
  UV_OVERRIDE: uv-overrides.txt

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number
      || github.ref
    }}
  cancel-in-progress: >-
    ${{ !startsWith(github.event.head_commit.message,
      '[changelog] Release') }}

jobs:

  metadata:
    name: 🧬 Project metadata
    runs-on: ubuntu-slim
    outputs:
      build_targets: ${{ steps.extend-matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress 'repomatic==6.25.0' --verbosity DEBUG metadata
          --format github-json --output "$GITHUB_OUTPUT"
          build_targets
      - name: Extend matrix with ubuntu-slim
        id: extend-matrix
        env:
          METADATA: ${{ steps.metadata.outputs.metadata }}
        run: |
          targets=$(echo "${METADATA}" | jq -c '(.build_targets | fromjson) + [{"os":"ubuntu-slim"}]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  dump-context:
    name: 🩺 ${{ matrix.os }} info dump
    needs:
      - metadata
    if: needs.metadata.outputs.build_targets
    strategy:
      # Info-gathering matrix: see docs/workflows.md "Matrix fail-fast strategy".
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.build_targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: crazy-max/ghaction-dump-context@4d9eeaf15dd59aa4346919ea84a84ccf514b4db8 # v3.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uvx --no-progress 'extra-platforms==12.0.3'