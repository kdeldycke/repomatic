---
name: 📦 Build package
# Fast lane of the release pipeline: squash-merge guard, project metadata, and
# the Python package build. Kept separate from _release-engine.yaml so the
# caller's publish-pypi job can depend on the freshly-built wheel alone and ship
# to PyPI without waiting for binary compilation. See release.yaml and
# docs/workflows.md.
"on":
  workflow_call:
    outputs:
      package_built:
        description: >
          Whether the build-package job fully succeeded ("true"/"false").
          The caller's publish-pypi job gates on this alongside always(), so a
          healthy wheel still reaches PyPI when an unrelated job (like binary
          tests in the engine) fails the overall run. The fromJSON(toJSON())
          wrapper works around actions/runner#3087, where a bare
          jobs.<id>.result resolves to an empty string in workflow_call outputs.
        value: ${{ fromJSON(toJSON(jobs.build-package)).result == 'success' }}
      release_commits_matrix:
        description: >
          Matrix of release commits (used by the caller's publish-pypi job to
          drive its own matrix and gate execution). Emits an empty string (not
          "null") when there are no release commits, so the caller's
          `|| '{"include":[]}'` fallback triggers correctly. `toJSON(null)`
          would produce the string "null" which is truthy in GHA expressions,
          defeating the `||` guard and causing `fromJSON("null")` to fail the
          strategy evaluation with "Unexpected value ''".
        value: >-
          ${{
            fromJSON(jobs.metadata.outputs.metadata).release_commits_matrix
            && toJSON(fromJSON(jobs.metadata.outputs.metadata).release_commits_matrix)
            || ''
          }}
permissions: {}

# No concurrency block: this lane is a release sub-component invoked by
# release.yaml, its jobs are cheap and idempotent, and the push-triggered
# release.yaml entry owns the concurrency group (its SHA-based unique group
# protects release commits, and a block here would contend with it).

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  detect-squash-merge:
    name: 🧯 No squash on release
    # Detect squash merges on release PRs and open an issue instead of releasing.
    # See RELEASE_COMMIT_PATTERN in repomatic/metadata/core.py for the detection mechanism.
    if: >-
      github.event_name == 'push'
      && startsWith(github.event.head_commit.message, 'Release `v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Extract PR reference
        id: extract
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          pr_ref=$(echo "${COMMIT_MSG}" | grep -oE '#[0-9]+' | tail -1)
          echo "pr_ref=${pr_ref}" >> "$GITHUB_OUTPUT"
      - name: Generate issue body
        id: issue-metadata
        env:
          PR_REF: ${{ steps.extract.outputs.pr_ref }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template detect-squash-merge
          --pr-ref "${PR_REF}"
          --output "$GITHUB_OUTPUT"
      - name: Open issue to notify maintainer
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ steps.issue-metadata.outputs.title }}
          BODY: ${{ steps.issue-metadata.outputs.body }}
        run: |
          issue_url=$(gh issue create \
            --title "${TITLE}" \
            --assignee "${GITHUB_ACTOR}" \
            --body "${BODY}")
          echo "issue_url=${issue_url}" >> "$GITHUB_OUTPUT"
      - name: Fail workflow
        env:
          ISSUE_URL: ${{ steps.issue.outputs.issue_url }}
        run: |
          echo "::error::Squash merge detected. Release was skipped. See ${ISSUE_URL}"
          exit 1

  metadata:
    name: 🧬 Project metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout pull request HEAD commit to ignore actions/checkout's merge commit. Fallback to push SHA.
          # See: https://github.com/actions/checkout/issues/504
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # We're going to browse all new commits.
          fetch-depth: 0
      - name: List all branches
        run: git branch --all
      - name: List all commits
        run: git log --decorate=full --oneline
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run repomatic metadata
        id: metadata
        run: >
          uv --no-progress run --frozen -- repomatic metadata
          --format github-json --output "$GITHUB_OUTPUT"
          new_commits_matrix release_commits_matrix build_targets nuitka_matrix
          is_python_project cli_scripts package_name current_version released_version
          release_notes release_notes_with_admonition skip_binary_build

  lint-deps:
    name: 🔗 Lint deps
    # Refuse to publish a project whose dependencies do not all resolve from the index its users
    # install from. A `[tool.uv.sources]` override never reaches the published metadata, so the
    # wheel builds and uploads exactly as it would have and only the install fails: nothing else
    # in the lane can see it. Fatal only on a release commit, so test-driving a git branch during
    # development stays frictionless while still annotating every push.
    # See repomatic/deps/dep_sources.py for the rules and the failure classes.
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).is_python_project
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release commit, not the push head: a rebase-merged release PR delivers the freeze
          # and the post-release bump together, so `main` HEAD already carries the next `.devN`.
          # The tree being published is the one that has to pass. Most recent release commit
          # first, as in release.yaml's pack-plugin; a push carrying two of them checks only the
          # newest, which is the same assumption the rest of the lane makes.
          ref: >-
            ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
            && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix.commit[0]
            || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Check dependency sources
        run: >
          uv --no-progress run --frozen -- repomatic lint-deps
          ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
          && '--fatal' || '--no-fatal' }}

  build-package:
    name: 📦 Build package (${{ matrix.short_sha }})
    # `lint-deps` is a hard gate, not a report: a failure here skips this job, which leaves
    # `package_built` false so the caller's publish-pypi never fires, and fails the whole lane so
    # the engine's create-tag / create-release / publish-release are skipped with it. Nothing
    # reaches PyPI or GitHub. tests/test_workflows.py holds this edge.
    needs:
      - lint-deps
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).is_python_project
    strategy:
      matrix: >-
        ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
        || fromJSON(needs.metadata.outputs.metadata).new_commits_matrix }}
    runs-on: ubuntu-26.04
    # Wider than the default: this job provisions a toolchain, so its runtime tracks how much it has to install.
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      # Bakes the tag SHA into the CLI module so a built artifact can report the
      # commit it came from. Gated on `cli_scripts` because click-extra locates that
      # module through `[project.scripts]`, and hard-errors with "No __init__.py
      # found" on a project that declares none. The `.dev` guard alone does not
      # catch it: it holds on every ordinary push and only opens on the release
      # commit, so a CLI-less project builds green for its whole life and fails the
      # one run that tags, publishes and releases it.
      - name: Pre-bake tag SHA
        if: >-
          !contains(matrix.current_version, '.dev')
          && fromJSON(needs.metadata.outputs.metadata).cli_scripts
        env:
          COMMIT: ${{ matrix.commit }}
        run: >
          uvx --no-progress 'click-extra==8.9.1'
          prebake field git_tag_sha "${COMMIT}"
      - name: Build package
        run: uv --no-progress build
      # Signs each dist file with the job's OIDC token via Sigstore and writes
      # `<dist>.publish.attestation` sidecars (PEP 740 format) directly into
      # ./dist/ so the artifact uploaded below carries its own attestations.
      # Skipped on fork PRs where the OIDC token is unavailable.
      - name: Sign distributions with PEP 740 attestations
        if: >-
          github.event_name != 'pull_request'
          || !github.event.pull_request.head.repo.fork
        shell: bash
        run: uvx --no-progress pypi-attestations sign ./dist/*.whl ./dist/*.tar.gz
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}
          path: ./dist/*
