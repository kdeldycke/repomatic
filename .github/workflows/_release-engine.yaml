---
name: 🚀 Build & release
# Read https://github.com/actions/runner/issues/491 for insights on complex workflow execution logic.
"on":
  workflow_call:
    secrets:
      REPOMATIC_PAT:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false
    # No workflow_call outputs: the caller's publish-pypi job sources
    # package_built, release_commits_matrix, and release_notes_with_admonition
    # from the _release-build.yaml fast lane instead. This engine only consumes
    # the wheel artifact (run-scoped) the build lane uploaded. See release.yaml.

  # Call-only engine: no push or workflow_dispatch trigger. Every repo (repomatic
  # included) drives this engine from its own release.yaml entry, which owns those
  # triggers and the publish-pypi job. Keeping the publish job out of the engine
  # is what lets each caller's OIDC `job_workflow_ref` claim resolve to its own
  # release.yaml for PyPI's Trusted Publisher. See pypi/warehouse#11096 and
  # docs/workflows.md.

permissions: {}

# No concurrency block: the push-triggered release.yaml entry owns the
# concurrency group. A block here would join its group behind the caller's
# `needs: build` gate, too late to cancel queued runs, and would contend with
# the entry's group. See repomatic/github/actions.py for rationale.

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal that tests/test_workflows.py holds
# equal to `[tool.repomatic] minimum-release-age`. Deliberate bypasses are
# per-package CLI flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 8
  UV_EXCLUDE_NEWER: "8 days"

jobs:

  metadata:
    name: 🧬 Project metadata
    runs-on: ubuntu-slim
    outputs:
      has_virustotal_key: ${{ steps.check-vt-key.outputs.has_key }}
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout pull request HEAD commit to ignore actions/checkout's merge commit. Fallback to push SHA.
          # See: https://github.com/actions/checkout/issues/504
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # We're going to browse all new commits.
          fetch-depth: 0
      - name: List all branches
        run: git branch --all
      - name: List all commits
        run: git log --decorate=full --oneline
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress --from . repomatic metadata
          --format github-json --output "$GITHUB_OUTPUT"
          new_commits_matrix release_commits_matrix build_targets nuitka_matrix
          nuitka_extras is_python_project package_name current_version
          released_version release_notes release_notes_with_admonition
          skip_binary_build manpages_script manpages_asset_name binaries_sync
          release_assets
      - name: Check VirusTotal API key
        id: check-vt-key
        env:
          HAS_KEY: ${{ secrets.VIRUSTOTAL_API_KEY && 'true' || '' }}
        run: echo "has_key=${HAS_KEY}" >> "$GITHUB_OUTPUT"

  compile-binaries:
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }}, ${{ matrix.short_sha }} build"
    needs:
      - metadata
    # Skip binary compilation for branches that don't affect code (e.g., update-mailmap, format-markdown).
    if: >-
      fromJSON(needs.metadata.outputs.metadata).nuitka_matrix
      && !(fromJSON(needs.metadata.outputs.metadata).skip_binary_build || false)
    strategy:
      # Asset-producing matrix: see docs/workflows.md "Matrix fail-fast strategy".
      fail-fast: false
      # Fall back to an empty `{"include":[]}` matrix when nuitka_matrix is null
      # (binary builds disabled via nuitka.enabled = false). GitHub resolves
      # strategy.matrix during job setup even when `if:` will skip the job, and a
      # null matrix combined with the matrix-derived `runs-on` below aborts the
      # whole run. See the publish-pypi job and docs/workflows.md.
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).nuitka_matrix || fromJSON('{"include":[]}') }}
    runs-on: ${{ matrix.os }}
    # Linux targets compile inside a manylinux_2_28 container (glibc 2.28), so
    # binaries carry a stable glibc floor instead of inheriting the runner
    # image's. macOS and Windows entries have no container key: the empty
    # expression makes the job run directly on the VM.
    container: ${{ matrix.container }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Setup venv
        # --managed-python forces uv's own python-build-standalone interpreter,
        # whose deployment floors are the ones we declare and verify (macOS
        # 10.15 on x64 and 11.0 on arm64, glibc below 2.28). Left to its
        # default preference, uv favors a matching system interpreter:
        # Homebrew's python on macOS runners is compiled for the runner's own
        # macOS version and drags every bundled library's floor up to it, and
        # /opt/python inside manylinux containers ships no libpython for
        # Nuitka to link against.
        # Windows keeps the runner's system CPython: uv ships no managed
        # windows-aarch64 interpreter, so forcing managed python on the arm64
        # runner cross-resolves to x86_64 and Nuitka emits an x64 binary
        # (caught by verify-binary). The system CPython is the canonical
        # Windows build, matching the documented floor.
        run: >
          uv --no-progress
          ${{ matrix.platform_id != 'windows' && '--managed-python' || '' }}
          venv --python 3.14
      - name: Sync optional-dependencies for Nuitka build
        # Install the [project.optional-dependencies] extras listed in
        # [tool.repomatic] nuitka.extras into the build venv, so Nuitka can
        # bundle their packages. See the nuitka_extras docstring in
        # repomatic/config.py for the full rationale.
        if: fromJSON(needs.metadata.outputs.metadata).nuitka_extras
        env:
          EXTRAS: ${{ fromJSON(needs.metadata.outputs.metadata).nuitka_extras }}
        shell: bash
        run: |
          # EXTRAS is a space-separated list emitted by Metadata.format_github_value.
          flags=""
          for extra in ${EXTRAS}; do
            flags="${flags} --extra ${extra}"
          done
          # shellcheck disable=SC2086
          uv --no-progress sync --frozen ${flags}
      - name: Pre-bake build metadata
        if: contains(matrix.current_version, '.dev')
        run: uvx --no-progress 'click-extra==8.7.0' prebake all
      - name: Build binary
        id: build-binary
        continue-on-error: true
        # The onefile build runs through `repomatic run nuitka`: the tool runner
        # installs the pinned Nuitka, translates the [tool.nuitka] section to CLI
        # flags, and prepends --mode=onefile. The matrix supplies only repomatic's
        # per-entry-point flags (like --python-flag=-m), which carry no spaces.
        # User flags with spaces belong in [tool.nuitka], which the tool runner
        # passes as a proper argv, so a plain word-split is enough here.
        env:
          NUITKA_PYTHON_FLAGS: ${{ matrix.nuitka_python_flags }}
          BIN_NAME: ${{ matrix.bin_name }}
          MODULE_PATH: ${{ matrix.module_path }}
          # Pin the macOS floor: without it, compiled objects and processed
          # dylibs inherit the build runner's own macOS version as their
          # minimum. Empty (and inert) on the other platforms.
          MACOSX_DEPLOYMENT_TARGET: >-
            ${{ matrix.platform_id == 'macos' && matrix.min_os || '' }}
        shell: bash
        run: |
          # NUITKA_PYTHON_FLAGS holds the entry point's --python-flag (if any),
          # meant to word-split.
          # shellcheck disable=SC2086
          uvx --no-progress --from . repomatic run nuitka -- \
            ${NUITKA_PYTHON_FLAGS} \
            --output-filename="${BIN_NAME}" "${MODULE_PATH}"
      - name: Upload Nuitka crash report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuitka-crash-report-${{ matrix.os }}-${{ matrix.short_sha }}.xml
          if-no-files-found: ignore
          path: nuitka-crash-report.xml
      - if: steps.build-binary.outcome == 'failure'
        run: |
          echo "Nuitka build failed, skipping the rest of the steps."
          exit 1
      - name: Verify binary architecture and OS floor
        # verify-binary parses the executable headers natively (no exiftool):
        # architecture on every platform, plus the glibc / macOS floor of the
        # binary and its *.dist tree, matched against the declared target
        # floors. A floor bump (from a runner, container or toolchain update)
        # fails the build here instead of shipping a binary that silently
        # dropped older distros.
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        run: >
          uvx --no-progress --from . repomatic
          verify-binary --target "${TARGET}" --binary "${BIN_NAME}"
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact name includes SHA for uniqueness across commits; the file
          # inside uses the clean release name (no SHA suffix).
          name: ${{ matrix.bin_name }}-${{ matrix.short_sha }}
          if-no-files-found: warn
          path: ${{ matrix.bin_name }}
      - name: Generate binary attestation
        id: attest-binary
        if: >-
          github.ref == 'refs/heads/main'
          && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ matrix.bin_name }}
      - name: Verify binary attestation
        # gh comes from the `repomatic run` registry rather than the image: the
        # manylinux container the Linux targets build in ships none at all, and
        # the runners that do ship one leave its version to the image. One
        # pinned, checksum-verified build now serves every target, which also
        # retires the third-party RPM repo this step used to add to the
        # container just to reach the attestation check.
        if: >-
          github.ref == 'refs/heads/main'
          && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
        env:
          GH_TOKEN: ${{ github.token }}
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        run: >
          uvx --no-progress --from . repomatic run gh --
          attestation verify "${BIN_NAME}"
          --repo "${{ github.repository }}"
          --signer-repo kdeldycke/repomatic
      - name: Upload attestation bundle
        if: >-
          github.ref == 'refs/heads/main'
          && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
          && steps.attest-binary.outputs.bundle-path
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-${{ matrix.bin_name }}-${{ matrix.short_sha }}
          path: ${{ steps.attest-binary.outputs.bundle-path }}

  test-binaries:
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }}, ${{ matrix.short_sha }} test"
    needs:
      - metadata
      - compile-binaries
    # Skip binary tests for branches that don't affect code (e.g., update-mailmap, format-markdown).
    if: >
      fromJSON(needs.metadata.outputs.metadata).nuitka_matrix
      && !(fromJSON(needs.metadata.outputs.metadata).skip_binary_build || false)
    strategy:
      # Advisory matrix (default fail-fast): see docs/workflows.md "Matrix fail-fast strategy".
      # Fall back to an empty `{"include":[]}` matrix when nuitka_matrix is null
      # (binary builds disabled via nuitka.enabled = false). GitHub resolves
      # strategy.matrix during job setup even when `if:` will skip the job, and a
      # null matrix combined with the matrix-derived `runs-on` below aborts the
      # whole run. See the publish-pypi job and docs/workflows.md.
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).nuitka_matrix || fromJSON('{"include":[]}') }}
    runs-on: ${{ matrix.os }}
    # Same container as the compile job: running the binary self-test suite
    # on glibc 2.28 proves the published Linux floor at runtime, not just in
    # the ELF headers.
    container: ${{ matrix.container }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifacts
        with:
          name: ${{ matrix.bin_name }}-${{ matrix.short_sha }}
      - name: Set binary permissions
        if: runner.os != 'Windows'
        env:
          DOWNLOAD_PATH: ${{ steps.artifacts.outputs.download-path }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: chmod +x "${DOWNLOAD_PATH}/${BIN_NAME}"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Run test suite for binary
        env:
          DOWNLOAD_PATH: ${{ steps.artifacts.outputs.download-path }}
          BIN_NAME: ${{ matrix.bin_name }}
          # Inherited by the compiled binary so it emits UTF-8 on piped stdout. Windows defaults
          # pipes to cp1252, whose bytes (an em dash in help text) crash the harness's strict-UTF-8
          # reader thread. Mirrors the "Force UTF-8 encoding on Windows" step in tests.yaml.
          PYTHONIOENCODING: utf8
          # The Linux self-test runs in the manylinux container as root over a runner-owned
          # checkout, so the binary's `git` subprocess hits "dubious ownership" (exit 128) and
          # crashes `metadata`. actions/checkout marks the repo safe only under a throwaway HOME,
          # not the container's persistent /github/home, so pass safe.directory through the
          # environment: git honors it regardless of HOME, and it is a no-op off-container.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        shell: bash
        # The binary self-test reads ./tests/cli-test-suite.toml (the click-extra 8.1
        # default), parsed with the built-in tomllib, so no optional extra is needed.
        run: >
          uv run --frozen --no-progress --
          click-extra test-suite
          --binary "${DOWNLOAD_PATH}/${BIN_NAME}"
          --jobs max

  create-tag:
    name: 📌 Tag release (${{ matrix.short_sha }})
    needs:
      - metadata
    # Only consider pushes to main branch as triggers for releases.
    if: github.ref == 'refs/heads/main' && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          # PAT required so tag pushes trigger downstream on.push.tags workflows.
          # See repomatic/git_ops.py module docstring.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Create and push tag
        # Idempotent: skips if tag already exists instead of failing. This allows re-running
        # workflows interrupted after tag creation.
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          COMMIT: ${{ matrix.commit }}
        run: >
          uvx --no-progress --from . repomatic git-tag
          --tag "v${CURRENT_VERSION}"
          --commit "${COMMIT}"
          --skip-existing

  create-release:
    name: 🐙 Create GitHub release draft (${{ matrix.short_sha }})
    needs:
      - metadata
      - create-tag
    # Make sure this job always starts if create-tag ran and succeeded.
    # The wheel is built by the _release-build.yaml lane; release.yaml gates this
    # engine on `needs: build`, so the artifact is uploaded before this runs.
    if: always() && needs.create-tag.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      # Allow project without REPOMATIC_PAT to create a GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.0"
      - name: Download Python package
        # Do not fetch build artifacts for non-Python projects (no wheel built).
        if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifacts
        with:
          path: release_artifact
          name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}
      - name: Delete dev pre-release
        # Clean up all rolling dev releases before creating the real release.
        # See repomatic/github/dev_release.py for rationale.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: uvx --no-progress --from . repomatic sync-dev-release --live --delete
      - name: Create GitHub release draft
        # Idempotent: skips if release already exists (e.g. workflow re-run).
        # Notes carry the PyPI availability admonition from the start: baking it
        # here (instead of editing the release from the caller's fast publish-pypi
        # lane) removes the cross-lane race where that edit ran before this job
        # had created the release. release_notes_with_admonition is empty for
        # non-PyPI projects, which then fall back to the plain notes. See
        # repomatic/metadata.py:release_notes_with_admonition for rationale.
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          COMMIT: ${{ matrix.commit }}
          REPO: ${{ github.repository }}
          RELEASE_NOTES: >-
            ${{ fromJSON(needs.metadata.outputs.metadata).release_notes_with_admonition
            || fromJSON(needs.metadata.outputs.metadata).release_notes }}
        run: |
          tag="v${CURRENT_VERSION}"
          if gh release view "${tag}" --repo "${REPO}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists, skipping creation."
          else
            shopt -s nullglob
            files=(release_artifact/*)
            gh release create "${tag}" \
              --draft \
              --target "${COMMIT}" \
              --title "${tag}" \
              --repo "${REPO}" \
              --notes-file - \
              "${files[@]}" <<< "${RELEASE_NOTES}"
          fi

  # Render the Click CLI command tree declared by `[tool.repomatic.manpages]` as roff `.1` files and attach them as a
  # tarball asset to the GitHub release draft. The upload must land before `publish-release` flips the draft to a
  # published release: GitHub immutable releases lock a published release's assets, so a post-publish upload fails
  # with HTTP 422. Opt-in: silently skipped when `manpages.script` is empty in the consumer's pyproject.toml. Shells
  # out to the `click-extra wrap --man --output-dir` CLI (click-extra 8.0+), against the consumer's already-synced
  # venv, so repomatic stays out of the resolution graph.
  manpages:
    name: 📖 Man pages (${{ matrix.short_sha }})
    needs:
      - metadata
      - create-release
    if: >-
      always()
      && needs.create-release.result == 'success'
      && fromJSON(needs.metadata.outputs.metadata).manpages_script != ''
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.0"
      - name: Install project
        run: uv --no-progress sync --frozen
      - name: Generate man pages
        env:
          SCRIPT: ${{ fromJSON(needs.metadata.outputs.metadata).manpages_script }}
        run: >
          uv --no-progress run --frozen --
          click-extra wrap --man --output-dir man "${SCRIPT}"
      - name: Bundle as tarball
        env:
          ASSET_NAME: >-
            ${{
              fromJSON(needs.metadata.outputs.metadata).manpages_asset_name
              || format('{0}-manpages', fromJSON(needs.metadata.outputs.metadata).package_name)
            }}
        run: tar --create --gzip --file "${ASSET_NAME}.tar.gz" man/
      # Same provenance chain as the compiled binaries and the extra-assets job.
      - name: Generate tarball attestation
        id: attest-manpages
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: >-
            ${{
              format(
                '{0}.tar.gz',
                fromJSON(needs.metadata.outputs.metadata).manpages_asset_name
                || format('{0}-manpages', fromJSON(needs.metadata.outputs.metadata).package_name)
              )
            }}
      - name: Verify tarball attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: >-
            ${{
              fromJSON(needs.metadata.outputs.metadata).manpages_asset_name
              || format('{0}-manpages', fromJSON(needs.metadata.outputs.metadata).package_name)
            }}
        run: >
          gh attestation verify "${ASSET_NAME}.tar.gz"
          --repo "${{ github.repository }}"
          --signer-repo kdeldycke/repomatic
      - name: Attach to release draft
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          ASSET_NAME: >-
            ${{
              fromJSON(needs.metadata.outputs.metadata).manpages_asset_name
              || format('{0}-manpages', fromJSON(needs.metadata.outputs.metadata).package_name)
            }}
          BUNDLE_PATH: ${{ steps.attest-manpages.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          cp "${BUNDLE_PATH}" manpages.attestation.json &&
          gh release upload "v${CURRENT_VERSION}"
          "${ASSET_NAME}.tar.gz" manpages.attestation.json
          --repo "${{ github.repository }}"
          --clobber

  # Attach the consumer-built extra assets declared by `release-assets` in `[tool.repomatic]`. Each declared filename
  # must arrive as a `release-asset-<filename>` run artifact, uploaded by a job the consumer defines in its own
  # release workflow (the same caller-side handoff as the wheel's build lane). Keeping the build in the downstream
  # repository means the engine never executes consumer-supplied commands: it only downloads, attests (same
  # provenance chain as the compiled binaries; verify with `gh attestation verify <file> --repo <consumer>
  # --signer-repo kdeldycke/repomatic`), and uploads to the release draft, before `publish-release` locks the
  # immutable release. Opt-in: silently skipped when `release-assets` is empty.
  extra-assets:
    name: 📎 Extra release assets (${{ matrix.short_sha }})
    needs:
      - metadata
      - create-release
    if: >-
      always()
      && needs.create-release.result == 'success'
      && join(fromJSON(needs.metadata.outputs.metadata).release_assets) != ''
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download asset artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true
      - name: Check all declared assets landed
        # A declared asset missing its artifact fails the release loudly here,
        # before the draft publishes without it.
        env:
          # Space-separated: see the release_assets docstring in repomatic/config.py.
          ASSET_NAMES: ${{ join(fromJSON(needs.metadata.outputs.metadata).release_assets, ' ') }}
        shell: bash
        run: |
          for name in ${ASSET_NAMES}; do
            if [[ ! -f "release-assets/${name}" ]]; then
              echo "::error::Declared release asset ${name} has no release-asset-* artifact."
              exit 1
            fi
          done
      - name: Generate assets attestation
        id: attest-assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release-assets/*
      - name: Verify assets attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for asset in release-assets/*; do
            gh attestation verify "${asset}" \
              --repo "${{ github.repository }}" \
              --signer-repo kdeldycke/repomatic
          done
      - name: Attach assets to release draft
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          BUNDLE_PATH: ${{ steps.attest-assets.outputs.bundle-path }}
        shell: bash
        run: |
          cp "${BUNDLE_PATH}" release-assets/extra-assets.attestation.json
          gh release upload "v${CURRENT_VERSION}" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber

  publish-release:
    name: 🎉 Publish GitHub release (${{ matrix.short_sha }})
    needs:
      - metadata
      - create-release
      - compile-binaries
      - manpages
      - extra-assets
    # Terminal step: flips the draft to a published (immutable) release, so it must wait for every asset-upload job
    # (binaries below, man pages in `manpages`). Gates only on create-release so the release still publishes when
    # binaries or man pages are skipped or fail; always() lets it run despite an upstream job's non-success.
    if: >-
      always()
      && needs.create-release.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download binary and attestation artifacts
        # Gate on != 'skipped' (not == 'success') so partial-matrix runs still
        # attach their healthy binaries: see docs/workflows.md "Matrix fail-fast strategy".
        if: needs.compile-binaries.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-${{ matrix.short_sha }}"
          path: ./compile-assets
          merge-multiple: true
      - name: Upload binaries and attestation bundles to release
        # Exclude Python packages (.tar.gz, .whl) already uploaded by create-release.
        # Each versioned binary is also uploaded under a versionless alias
        # (name-<version>-<target>.<ext> duplicated as name-<target>.<ext>), so the
        # stable releases/latest/download URLs always resolve. Aliases are
        # byte-identical copies: artifact attestations verify them unchanged
        # (digest-based), and the catalog recorder collapses them onto their
        # versioned sibling (see repomatic/binaries_page.py).
        if: needs.compile-binaries.result != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        shell: bash
        run: |
          shopt -s nullglob extglob
          files=(./compile-assets/!(*.tar.gz|*.whl))
          for binary in ./compile-assets/*-"${CURRENT_VERSION}"-*.@(bin|exe); do
            versionless="${binary/-"${CURRENT_VERSION}"-/-}"
            cp "${binary}" "${versionless}"
            files+=("${versionless}")
          done
          if [[ ${#files[@]} -gt 0 ]]; then
            gh release upload "v${CURRENT_VERSION}" \
              "${files[@]}" \
              --repo "${{ github.repository }}" \
              --clobber
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          REPO: ${{ github.repository }}
        run: >
          gh release edit "v${CURRENT_VERSION}"
          --draft=false
          --repo "${REPO}"

  scan-virustotal:
    name: 🛡️ VirusTotal scan (${{ matrix.short_sha }})
    needs:
      - metadata
      - publish-release
    # Run after publish-release so the release assets exist. Skip if no VT key.
    if: >-
      always()
      && needs.publish-release.result == 'success'
      && needs.metadata.outputs.has_virustotal_key
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
      # Each cell commits scan records to the default branch; serializing the
      # (rare) multi-release runs keeps them from racing on the same files.
      max-parallel: 1
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan records and the binaries page are committed on top of the
          # default branch tip, not the release commit. The PAT (when
          # available) lets the push trigger the docs deploy workflow.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          version: "0.12.0"
      - name: Download release binaries
        # Versioned patterns leave out the versionless alias copies, which
        # share their digest with a versioned sibling and would only submit
        # duplicate scans.
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        run: >
          gh release download "v${CURRENT_VERSION}"
          --repo "${{ github.repository }}"
          --pattern "*-${CURRENT_VERSION}-*.bin"
          --pattern "*-${CURRENT_VERSION}-*.exe"
          --dir ./binaries
      - name: Upload to VirusTotal and record detections
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        run: >
          uvx --no-progress --from . repomatic scan-virustotal
          --tag "v${CURRENT_VERSION}"
          --binaries-dir ./binaries
          --poll
          --poll-timeout 600
          --records docs/assets/virustotal-scans.json
      - name: Regenerate binaries page
        # See repomatic/binaries_page.py for the page design rationale.
        # Skipped when [tool.repomatic] binaries.sync is disabled.
        if: fromJSON(needs.metadata.outputs.metadata).binaries_sync != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          uvx --no-progress --from . repomatic sync-binaries
          --repo "${{ github.repository }}"
          --page docs/binaries.md
          --records docs/assets/virustotal-scans.json
          --backfill-records
      - name: Commit and push scan records
        # Direct push to the default branch, not a PR: this step records facts
        # about an already-published release. Skipped when [tool.repomatic]
        # binaries.sync is disabled. See docs/operation-contracts.md § Scan job
        # contract for the rationale.
        if: fromJSON(needs.metadata.outputs.metadata).binaries_sync != false
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >
          uvx --no-progress --from . repomatic git-commit-push
          --message "Record v${CURRENT_VERSION} binaries"
          --branch "${DEFAULT_BRANCH}"
          docs/binaries.md
          docs/assets/binaries.csv
          docs/assets/virustotal-scans.json

  sync-dev-release:
    name: 🔄 Sync dev pre-release
    needs:
      - metadata
      - compile-binaries
    # Run on non-release pushes to main after builds complete. The wheel comes
    # from the _release-build.yaml lane (release.yaml gates this engine on
    # `needs: build`), downloaded run-scoped below alongside the binaries.
    # Uses always() because compile-binaries may be skipped (no nuitka_matrix or skip_binary_build).
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && !fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
      && fromJSON(needs.metadata.outputs.metadata).current_version
    # Serialise this job across overlapping release runs: the dev pre-release is a
    # single mutable GitHub resource this job deletes, recreates and uploads to. The
    # run-level concurrency in release.yaml cancels a superseded run mid-sync, which
    # can leave the pre-release half-rewritten and fail the next run's sync. A
    # dedicated per-repository group that never cancels in progress lets each sync
    # finish cleanly before the next starts; GitHub keeps only the latest queued one,
    # so the pre-release still converges to the newest build.
    concurrency:
      group: sync-dev-release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release_assets
          merge-multiple: true
      - name: Sync dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          uvx --no-progress --from . repomatic sync-dev-release --live
          --upload-assets release_assets
