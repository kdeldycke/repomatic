---
name: 🚀 Build & release
# Read https://github.com/actions/runner/issues/491 for insights on complex workflow execution logic.
"on":
  workflow_call:
    inputs:
      metadata:
        description: >
          The `metadata` output of the _release-build.yaml lane: one JSON
          object holding every `repomatic show-metadata` key the jobs here
          read. The build lane computes it once for both lanes, and the
          caller passes it on from its `build` job.
        required: true
        type: string
    secrets:
      REPOMATIC_PAT:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false
    # No workflow_call outputs: the caller's publish-pypi job sources
    # package_built and release_commits_matrix from the _release-build.yaml
    # fast lane instead. This engine only consumes the wheel artifact
    # (run-scoped) the build lane uploaded. See release.yaml.

  # Call-only engine: no push or workflow_dispatch trigger. Every repo (repomatic
  # included) drives this engine from its own release.yaml entry, which owns those
  # triggers and the publish-pypi job. Keeping the publish job out of the engine
  # is what lets each caller's OIDC `job_workflow_ref` claim resolve to its own
  # release.yaml for PyPI's Trusted Publisher. See pypi/warehouse#11096 and
  # docs/workflows.md.

permissions: {}

# No concurrency block: the push-triggered release.yaml entry owns the
# concurrency group. A block here would join its group behind the caller's
# `needs: build` gate, too late to cancel queued runs, and would contend with
# the entry's group. See https://repomatic.net/workflows#concurrency-strategies.

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See https://repomatic.net/workflows#install-time-cooldown for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

# One rule for the uv cache: a job holding a write scope sets `enable-cache: false` on setup-uv. A cache entry is
# writable by any code running in any workflow of the default branch (the cache API is not gated by `permissions:`),
# so an entry restored into a job that tags, attests, uploads or publishes could reach a release. test-binaries, the
# one read-only job, keeps the cache.
jobs:

  compile-binaries:
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }}, ${{ matrix.short_sha }} build"
    # nuitka_matrix is empty when the project builds no binary, or when the event cannot change one (a branch that
    # does not affect code, like update-mailmap or format-markdown). See repomatic/metadata/matrix.py.
    if: fromJSON(inputs.metadata).nuitka_matrix
    strategy:
      # Asset-producing matrix: see docs/workflows.md "Matrix fail-fast strategy".
      fail-fast: false
      # Fall back to an empty `{"include":[]}` matrix when nuitka_matrix is null. GitHub resolves strategy.matrix
      # during job setup even when `if:` will skip the job, and a null matrix combined with the matrix-derived
      # `runs-on` below aborts the whole run. See the publish-pypi job and docs/workflows.md.
      matrix: ${{ fromJSON(inputs.metadata).nuitka_matrix || fromJSON('{"include":[]}') }}
    runs-on: ${{ matrix.os }}
    # Linux targets compile inside a manylinux_2_28 container (glibc 2.28), so
    # binaries carry a stable glibc floor instead of inheriting the runner
    # image's. macOS and Windows entries have no container key: the empty
    # expression makes the job run directly on the VM.
    container: ${{ matrix.container }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    # Headroom over the slowest measured cold-cache compile job (17.4 min on
    # windows-x64); see docs/nuitka.md § Compile caching for the full table.
    # Without it a hung compile squats a runner-cap slot for the 360-min default.
    timeout-minutes: 45
    permissions:
      id-token: write
      attestations: write
      contents: read
      # The compile-cache prune below deletes superseded cache entries.
      actions: write
    env:
      # Relocate every Nuitka cache (ccache/clcache objects, downloads,
      # bytecode) under the workspace, so the cache step below and Nuitka
      # agree on one path both on VM jobs and inside the manylinux containers.
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      # Name the ccache directory outright. Left to Nuitka, it gains one
      # subdirectory per Python ABI, and ccache then looks for its
      # `ccache.conf` there, not where `repomatic run nuitka` writes it.
      CCACHE_DIR: ${{ github.workspace }}/.nuitka-cache/ccache
      # Cross-VM hits depend on hashing the compiler binary's content: the
      # default mtime+size check trips on runner VMs, which do not keep
      # stable file timestamps. `repomatic run nuitka` also writes the
      # setting into $CCACHE_DIR/ccache.conf, so whichever channel reaches
      # the wrapper carries the same value. Nuitka's internal clcache on MSVC
      # ignores it.
      CCACHE_COMPILERCHECK: content
      # Inside the manylinux container, every `git` call after the checkout hits "dubious ownership": `prebake all`
      # then bakes no git field, and the self-tested binary crashes. See the test-binaries job for why the
      # environment carries safe.directory. Off-container it is a no-op.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
      # Windows defaults piped output to cp1252, where the table `prune-caches` prints and the help text the self-test
      # reads raise UnicodeEncodeError. Every Python process of the job, the compiled binary included, writes UTF-8.
      PYTHONIOENCODING: utf8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.4"
      # Persist the Nuitka compile caches across runs: ccache objects on gcc
      # targets, Nuitka's internal clcache objects on MSVC, plus downloads
      # and demoted-module bytecode. The per-commit key never hits exactly,
      # so every run saves a fresh snapshot and restores the latest previous
      # one via the prefix; ccache/clcache hash compiler, flags and sources
      # themselves, so a stale snapshot degrades to cache misses, never to
      # wrong objects. Release commits build cold, and macOS keeps no cache:
      # see `nuitka_cache` in repomatic/metadata/matrix.py.
      - name: Restore Nuitka compile cache
        if: matrix.nuitka_cache == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nuitka-cache
          key: nuitka-${{ matrix.target }}-${{ matrix.commit }}
          restore-keys: nuitka-${{ matrix.target }}-
      # The manylinux containers ship no ccache (Nuitka warns and compiles
      # cold), so the canary target pays full C compilation on every push.
      # A build keeping no cache has no use for it. EPEL is a distro archive,
      # exempt from the install cooldown (see
      # https://repomatic.net/workflows#install-time-cooldown). Non-fatal on mirror
      # hiccups: a build must not die for a missing cache helper.
      - name: Install ccache in container
        if: matrix.container && matrix.nuitka_cache == 'true'
        shell: bash
        run: >
          (dnf install --assumeyes --quiet epel-release
          && dnf install --assumeyes --quiet ccache)
          || echo "ccache unavailable, building uncached."
      - name: Setup venv
        # --managed-python forces uv's own python-build-standalone interpreter,
        # whose deployment floors are the ones we declare and verify (macOS
        # 10.15 on x64 and 11.0 on arm64, glibc below 2.28). Left to its
        # default preference, uv favors a matching system interpreter:
        # Homebrew's python on macOS runners is compiled for the runner's own
        # macOS version and drags every bundled library's floor up to it, and
        # /opt/python inside manylinux containers ships no libpython for
        # Nuitka to link against.
        run: uv --no-progress --managed-python venv --python 3.14
      - name: Prune superseded Nuitka compile caches
        # Every run saves a snapshot under its own commit key, so the one just
        # restored is the only previous entry still read. Dropping the rest
        # keeps the repository under its cache quota, past which GitHub
        # evicts live caches too. A refused deletion warns and never fails
        # the build. It runs after the venv step: its `uv run` would otherwise
        # create `.venv` with another interpreter first.
        if: matrix.nuitka_cache == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: nuitka-${{ matrix.target }}-
        run: uv --no-progress run --frozen -- repomatic prune-caches --prefix "$PREFIX"
      # The click-extra of the project's own lock, the one the self-test below runs.
      - name: Pre-bake build metadata
        if: contains(matrix.current_version, '.dev')
        run: uv --no-progress run --frozen -- click-extra prebake all
      - name: Build binary
        id: build-binary
        continue-on-error: true
        # `repomatic run nuitka` installs the pinned Nuitka into the project
        # venv with the `nuitka.extras` of [tool.repomatic], prepares the
        # compile cache, translates the [tool.nuitka] section to CLI flags and
        # adds what the target needs (see repomatic/tooling/nuitka.py). The
        # matrix supplies the entry point to compile: Nuitka generates the
        # launcher for it, as an installer does for a console script. User flags
        # with spaces belong in [tool.nuitka], which the tool runner passes as a
        # proper argv.
        env:
          MAIN_ENTRY_POINT: ${{ matrix.main_entry_point }}
          # Nuitka names its build folders after the project when no positional
          # main program names them.
          PROJECT_NAME: ${{ fromJSON(inputs.metadata).package_name }}
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        run: >
          uv --no-progress run --frozen -- repomatic run nuitka --
          --project-name="${PROJECT_NAME}"
          --main-entry-point="${MAIN_ENTRY_POINT}"
          --output-filename="${BIN_NAME}"
      - name: Upload Nuitka crash report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuitka-crash-report-${{ matrix.os }}-${{ matrix.short_sha }}.xml
          if-no-files-found: ignore
          path: nuitka-crash-report.xml
      # Sizing signal for the cache strategy: hit/miss counts are in Nuitka's
      # own "Cached C files" log lines above, this step adds what they omit.
      - name: Nuitka cache stats
        shell: bash
        run: du -sm .nuitka-cache/* 2>/dev/null || echo "No Nuitka cache dir."
      - if: steps.build-binary.outcome == 'failure'
        run: |
          echo "Nuitka build failed, skipping the rest of the steps."
          exit 1
      - name: Verify binary architecture and OS floor
        # verify-binary parses the executable headers natively (no exiftool):
        # architecture on every platform, plus the glibc / macOS floor of the
        # binary and its *.dist tree, matched against the declared target
        # floors. A floor bump (from a runner, container or toolchain update)
        # fails the build here instead of shipping a binary that silently
        # dropped older distros.
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        run: >
          uv --no-progress run --frozen -- repomatic
          verify-binary --target "${TARGET}" --binary "${BIN_NAME}"
      # On a non-release run, exercise the freshly-built binary in place: the
      # standalone test-binaries job only runs for release commits, so canary
      # and weekly-schedule builds still prove the binary works without paying
      # a second runner-queue slot. The job env carries safe.directory and
      # PYTHONIOENCODING.
      - name: Self-test binary
        if: ${{ !fromJSON(inputs.metadata).release_commits_matrix }}
        env:
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        run: >
          uv --no-progress run --frozen --
          click-extra test-suite
          --binary "./${BIN_NAME}"
          --jobs max
      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Artifact name includes SHA for uniqueness across commits; the file
          # inside uses the clean release name (no SHA suffix).
          name: ${{ matrix.bin_name }}-${{ matrix.short_sha }}
          if-no-files-found: warn
          path: ${{ matrix.bin_name }}
      - name: Generate binary attestation
        id: attest-binary
        if: fromJSON(inputs.metadata).is_release_push
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.bin_name }}
      - name: Verify the attestation and name its bundle after the binary
        # actions/attest writes every bundle to the same basename, so all matrix targets produce an `attestation.json`
        # and publish-release's `merge-multiple: true` download would keep only the last. See
        # repomatic/release/attestation.py, which owns the naming rule for every attested asset in this lane. The
        # verification runs the registry's gh, which the manylinux containers lack.
        if: >-
          fromJSON(inputs.metadata).is_release_push
          && steps.attest-binary.outputs.bundle-path
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-binary.outputs.bundle-path }}
        shell: bash
        run: >
          uv --no-progress run --frozen -- repomatic
          pack-attestation --bundle "${BUNDLE_PATH}" --verify
      - name: Upload attestation bundle
        # Globbed rather than named, so the filename stays the CLI's to decide.
        if: >-
          fromJSON(inputs.metadata).is_release_push
          && steps.attest-binary.outputs.bundle-path
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation-${{ matrix.bin_name }}-${{ matrix.short_sha }}
          path: "*.attestation.json"

  test-binaries:
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }}, ${{ matrix.short_sha }} test"
    needs:
      - compile-binaries
    # Release commits only: non-release builds self-test inside compile-binaries
    # instead of paying a second runner-queue slot per target. This standalone
    # job re-validates the artifact on a pristine VM, through the same
    # upload/download round-trip a user's binary takes. Skipped with
    # compile-binaries when nuitka_matrix is empty.
    # always() keeps it running when a sibling build failed: without it, one
    # red build cell skips this whole job and every healthy binary ships with
    # no runtime test at all (v7.9.0 shipped exactly that way).
    if: >
      always()
      && fromJSON(inputs.metadata).nuitka_matrix
      && fromJSON(inputs.metadata).release_commits_matrix
    strategy:
      # Info-gathering matrix: see docs/workflows.md "Matrix fail-fast strategy".
      # fail-fast off so the cell of a target whose build failed (its artifact
      # download errors out) does not cancel the healthy targets' tests.
      fail-fast: false
      # Fall back to an empty `{"include":[]}` matrix when nuitka_matrix is null, for the reason compile-binaries
      # gives.
      matrix: ${{ fromJSON(inputs.metadata).nuitka_matrix || fromJSON('{"include":[]}') }}
    runs-on: ${{ matrix.os }}
    # Same container as the compile job: running the binary self-test suite
    # on glibc 2.28 proves the published Linux floor at runtime, not just in
    # the ELF headers.
    container: ${{ matrix.container }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    # The suite runs in ~1-2 min; a hung run must not squat a runner-cap slot.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: artifacts
        with:
          name: ${{ matrix.bin_name }}-${{ matrix.short_sha }}
      - name: Set binary permissions
        if: runner.os != 'Windows'
        env:
          DOWNLOAD_PATH: ${{ steps.artifacts.outputs.download-path }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: chmod +x "${DOWNLOAD_PATH}/${BIN_NAME}"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
      - name: Run test suite for binary
        env:
          DOWNLOAD_PATH: ${{ steps.artifacts.outputs.download-path }}
          BIN_NAME: ${{ matrix.bin_name }}
          # Inherited by the compiled binary so it emits UTF-8 on piped stdout. Windows defaults
          # pipes to cp1252, whose bytes (an em dash in help text) crash the harness's strict-UTF-8
          # reader thread. Mirrors the "Force UTF-8 encoding on Windows" step in tests.yaml.
          PYTHONIOENCODING: utf8
          # The Linux self-test runs in the manylinux container as root over a runner-owned
          # checkout, so the binary's `git` subprocess hits "dubious ownership" (exit 128) and
          # crashes `show-metadata`. actions/checkout marks the repo safe only under a throwaway HOME,
          # not the container's persistent /github/home, so pass safe.directory through the
          # environment: git honors it regardless of HOME, and it is a no-op off-container.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: "*"
        shell: bash
        # The binary self-test reads ./tests/cli-test-suite.toml (the click-extra 8.1
        # default), parsed with the built-in tomllib, so no optional extra is needed.
        run: >
          uv --no-progress run --frozen --
          click-extra test-suite
          --binary "${DOWNLOAD_PATH}/${BIN_NAME}"
          --jobs max

  create-tag:
    name: 📌 Tag release (${{ matrix.short_sha }})
    if: fromJSON(inputs.metadata).is_release_push
    strategy:
      matrix: ${{ fromJSON(inputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
          # PAT required so tag pushes trigger downstream on.push.tags workflows.
          # See repomatic/git_ops.py module docstring.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Create and push tag
        # Idempotent: skips if tag already exists instead of failing. This allows re-running
        # workflows interrupted after tag creation.
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          COMMIT: ${{ matrix.commit }}
        run: >
          uv --no-progress run --frozen -- repomatic git-tag
          --tag "v${CURRENT_VERSION}"
          --commit "${COMMIT}"
          --skip-existing

  create-release:
    name: 🐙 Create GitHub release draft (${{ matrix.short_sha }})
    needs:
      - create-tag
    # Make sure this job always starts if create-tag ran and succeeded.
    # The wheel is built by the _release-build.yaml lane; release.yaml gates this
    # engine on `needs: build`, so the artifact is uploaded before this runs.
    if: always() && needs.create-tag.result == 'success'
    strategy:
      matrix: ${{ fromJSON(inputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      # Allow project without REPOMATIC_PAT to create a GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Download Python package
        # Do not fetch build artifacts for non-Python projects (no wheel built).
        if: fromJSON(inputs.metadata).is_python_project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: artifacts
        with:
          path: release_artifact
          name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}
      - name: Delete dev pre-release
        # Clean up all rolling dev releases before creating the real release.
        # See repomatic/github/dev_release.py for rationale.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: uv --no-progress run --frozen -- repomatic sync-dev-release --live --delete
      - name: Create GitHub release draft
        # Idempotent: skips if release already exists (e.g. workflow re-run). The notes are the changelog section of
        # the release commit, with the PyPI availability admonition baked in from the start: see build_draft_body in
        # repomatic/github/release_sync.py.
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          COMMIT: ${{ matrix.commit }}
        run: >
          uv --no-progress run --frozen -- repomatic create-release
          --version "${CURRENT_VERSION}" --commit "${COMMIT}"
          --assets release_artifact --skip-existing

  # Render the Click CLI command tree declared by `[tool.repomatic.manpages]` as roff `.1` files and attach them as a
  # tarball asset to the GitHub release draft. The upload must land before `publish-release` flips the draft to a
  # published release: GitHub immutable releases lock a published release's assets, so a post-publish upload fails
  # with HTTP 422. Opt-in: silently skipped when `manpages.script` is empty in the consumer's pyproject.toml. Shells
  # out to the `click-extra wrap --help-format man --output-dir` CLI, against the consumer's already-synced venv, so
  # repomatic stays out of the resolution graph. The consumer's click-extra floor is 9.0: that release moved the roff
  # source to `--help-format man` and gave `--man` the paged manual a reader wants, which writes no file.
  manpages:
    name: 📖 Man pages (${{ matrix.short_sha }})
    needs:
      - create-release
    if: >-
      always()
      && needs.create-release.result == 'success'
      && fromJSON(inputs.metadata).manpages_script != ''
    strategy:
      matrix: ${{ fromJSON(inputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Install project
        run: uv --no-progress sync --frozen
      - name: Generate man pages
        env:
          SCRIPT: ${{ fromJSON(inputs.metadata).manpages_script }}
        run: >
          uv --no-progress run --frozen --
          click-extra wrap --help-format man --output-dir man "${SCRIPT}"
      - name: Bundle as tarball
        # Named after the manpages_asset_name metadata key. See repomatic/release/manpages.py.
        run: uv --no-progress run --frozen -- repomatic pack-manpages
      # Same provenance chain as the compiled binaries and the extra-assets job.
      - name: Generate tarball attestation
        id: attest-manpages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ format('{0}.tar.gz', fromJSON(inputs.metadata).manpages_asset_name) }}
      - name: Verify tarball attestation
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-manpages.outputs.bundle-path }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pack-attestation --bundle "${BUNDLE_PATH}" --verify
      - name: Attach to release draft
        # pack-attestation names the bundle after the tarball it attests, and attaches both, so neither filename is
        # spelled here. See repomatic/release/attestation.py.
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          BUNDLE_PATH: ${{ steps.attest-manpages.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pack-attestation --bundle "${BUNDLE_PATH}" --upload-to "v${CURRENT_VERSION}"

  # Attach the consumer-built extra assets declared by `release-assets` in `[tool.repomatic]`. Each declared filename
  # must arrive as a `release-asset-<filename>` run artifact, uploaded by a job the consumer defines in its own
  # release workflow (the same caller-side handoff as the wheel's build lane). Keeping the build in the downstream
  # repository means the engine never executes consumer-supplied commands: it only downloads, attests (same
  # provenance chain as the compiled binaries; verify with `gh attestation verify <file> --repo <consumer>
  # --signer-repo kdeldycke/repomatic`), and uploads to the release draft, before `publish-release` locks the
  # immutable release. Opt-in: silently skipped when `release-assets` is empty.
  extra-assets:
    name: 📎 Extra release assets (${{ matrix.short_sha }})
    needs:
      - create-release
    if: >-
      always()
      && needs.create-release.result == 'success'
      && join(fromJSON(inputs.metadata).release_assets) != ''
    strategy:
      matrix: ${{ fromJSON(inputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      # Checkout first, before the download below: actions/checkout deletes everything in a workspace holding no
      # `.git` of its own, so downloading the assets ahead of it drops them on the floor. The tree is what lets the
      # final step resolve the CLI from `uv.lock`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Download asset artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-asset-*
          path: release-assets
          merge-multiple: true
      - name: Generate assets attestation
        id: attest-assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Check every declared asset landed, and verify the attestation
        # A declared asset missing its artifact fails the release loudly here, before the draft publishes without it.
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-assets.outputs.bundle-path }}
          PACKAGE_NAME: ${{ fromJSON(inputs.metadata).package_name }}
        run: >
          uv --no-progress run --frozen -- repomatic pack-attestation
          --bundle "${BUNDLE_PATH}" --dir release-assets --name "${PACKAGE_NAME}-extra-assets"
          --require-declared --verify
      - name: Attach assets to release draft
        # A repository declaring one asset gets a bundle named after it; several assets share one bundle, which then
        # takes the `--name` set name because no single filename can claim it. The bundle lands after the attest step
        # above, so it never ends up a subject of itself. See repomatic/release/attestation.py.
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          BUNDLE_PATH: ${{ steps.attest-assets.outputs.bundle-path }}
          PACKAGE_NAME: ${{ fromJSON(inputs.metadata).package_name }}
        run: >
          uv --no-progress run --frozen -- repomatic pack-attestation
          --bundle "${BUNDLE_PATH}" --dir release-assets --name "${PACKAGE_NAME}-extra-assets"
          --upload-to "v${CURRENT_VERSION}"

  publish-release:
    name: 🎉 Publish GitHub release (${{ matrix.short_sha }})
    needs:
      - create-release
      - compile-binaries
      - manpages
      - extra-assets
    # Terminal step: flips the draft to a published (immutable) release, so it must wait for every asset-upload job
    # (binaries below, man pages in `manpages`, consumer-built files in `extra-assets`). always() lets it run despite
    # an upstream job's non-success, and a skipped or failed `compile-binaries`/`manpages` still publishes: shipping
    # the Python distributions beats blocking the release on an unstable platform. Deliberate, and permanent rather
    # than deferred: publishing locks the assets, so a binary missing here can never be added to this version.
    # `v6.30.0`, `v7.5.0` and `v7.7.0` each shipped short this way, and each was recovered by releasing again, which
    # a fast cycle makes cheap. Fix the build and let the next version carry it: the `repomatic-ship` skill
    # (§ Repairing a short ship) covers the docs cleanup a short ship leaves behind.
    #
    # A failed `extra-assets` is the one exception, because the release is immutable the instant this job succeeds:
    # every file `release-assets` declares has to be on it by then or it never can be. Leaving the release as a draft
    # is the recoverable state (re-run the lane, or attach the file by hand), so the gate blocks only on 'failure' and
    # lets the 'skipped' of a repository that declared no extra assets through. This is what makes the promise
    # `extra-assets` and docs/workflows.md already state true.
    if: >-
      always()
      && needs.create-release.result == 'success'
      && needs.extra-assets.result != 'failure'
    strategy:
      matrix: ${{ fromJSON(inputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Checkout first, before the download below: actions/checkout deletes everything in a workspace holding no
      # `.git` of its own, so downloading the binaries ahead of it drops them on the floor. The CLI calls further down
      # resolve from `uv.lock`, so they need the release commit's tree: upstream always runs the unfrozen form,
      # whatever the freeze wrote. See repomatic/release/prepare_release.py for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.commit }}
      - name: Download binary and attestation artifacts
        # Gate on != 'skipped' (not == 'success') so partial-matrix runs still
        # attach their healthy binaries: see docs/workflows.md "Matrix fail-fast strategy".
        if: needs.compile-binaries.result != 'skipped'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-${{ matrix.short_sha }}"
          path: ./compile-assets
          merge-multiple: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Upload binaries and attestation bundles to release
        # Exclude Python packages (.tar.gz, .whl) already uploaded by create-release.
        # Each versioned binary is also uploaded under a versionless alias
        # (name-<version>-<target>.<ext> duplicated as name-<target>.<ext>), so the
        # stable releases/latest/download URLs always resolve. Aliases are
        # byte-identical copies: artifact attestations verify them unchanged
        # (digest-based), and the catalog recorder collapses them onto their
        # versioned sibling (see repomatic/release/binaries_page.py).
        if: needs.compile-binaries.result != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        run: >
          uv --no-progress run --frozen -- repomatic pack-binaries
          --version "${CURRENT_VERSION}" --dir ./compile-assets --upload-to "v${CURRENT_VERSION}"
      - name: Publish release
        # The registry's gh, pinned and checksummed, rather than the one the runner image happens to ship.
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          REPO: ${{ github.repository }}
        run: >
          uv --no-progress run --frozen -- repomatic run gh --
          release edit "v${CURRENT_VERSION}" --draft=false --repo "${REPO}"

  scan-virustotal:
    name: 🛡️ VirusTotal scan (${{ matrix.short_sha }})
    needs:
      - publish-release
    # Run after publish-release so the release assets exist. A job-level `if:` cannot read a secret, so the first
    # step probes the VirusTotal key and every other step is skipped without one.
    if: >-
      always()
      && needs.publish-release.result == 'success'
    strategy:
      matrix: ${{ fromJSON(inputs.metadata).release_commits_matrix }}
      # Each cell carries the pending scan records off the pull request
      # branch, appends its own, and republishes the branch. Serializing the
      # (rare) multi-release runs is what keeps that read-append-push cycle
      # from racing: raising this drops whichever cell pushed first.
      max-parallel: 1
    runs-on: ubuntu-26.04
    # The uploads and the polls share one rate budget (4 requests a minute on the free tier, two per upload), so the
    # six versioned binaries alone take three minutes to submit, before the up to 600 s the --poll-timeout grants the
    # verdicts. With the asset wait, the catalog rebuild and the pull request on top, 15 minutes is not enough. A stuck
    # poll must still not squat a runner-cap slot for the 360-min default.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check VirusTotal API key
        id: vt-key
        env:
          HAS_KEY: ${{ secrets.VIRUSTOTAL_API_KEY && 'true' || '' }}
        run: echo "has_key=${HAS_KEY}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.vt-key.outputs.has_key
        with:
          # Scan records and the binaries page are built on top of the default
          # branch tip, not the release commit, so the pull request opens
          # against a branch rather than a detached `HEAD`. The PAT (when
          # available) is what makes that pull request run its checks.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: steps.vt-key.outputs.has_key
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Download, upload to VirusTotal and record detections
        # See repomatic/release/virustotal.py for why the download waits on the
        # release's asset list and fetches only the versioned binaries.
        if: steps.vt-key.outputs.has_key
        env:
          GH_TOKEN: ${{ github.token }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        run: >
          uv --no-progress run --frozen -- repomatic scan-virustotal
          --tag "v${CURRENT_VERSION}"
          --download
          --repo "${{ github.repository }}"
          --binaries-dir ./binaries
          --poll
          --poll-timeout 600
          --records docs/assets/virustotal-scans.csv
          --carry-from scan-virustotal
      - name: Regenerate binaries page
        # See repomatic/release/binaries_page.py for the page design rationale.
        # Skipped when [tool.repomatic] binaries.sync is disabled.
        if: >-
          steps.vt-key.outputs.has_key
          && fromJSON(inputs.metadata).binaries_sync != false
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic sync-binaries
          --repo "${{ github.repository }}"
          --page docs/binaries.md
          --records docs/assets/virustotal-scans.csv
      - name: Sync pull request
        # One long-lived pull request every release appends to, not a direct
        # push: the records are a trend read across releases, so nothing is
        # lost by leaving it open. Skipped when [tool.repomatic] binaries.sync
        # is disabled. See docs/operation-contracts.md § Scan job contract.
        if: >-
          steps.vt-key.outputs.has_key
          && fromJSON(inputs.metadata).binaries_sync != false
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template scan-virustotal
          --add-path docs/binaries.md
          --add-path docs/assets/binaries.csv
          --add-path docs/assets/virustotal-scans.csv

  sync-dev-release:
    name: 🔄 Sync dev pre-release
    needs:
      - compile-binaries
    # Run on non-release pushes to main after builds complete. The wheel comes
    # from the _release-build.yaml lane (release.yaml gates this engine on
    # `needs: build`), downloaded run-scoped below alongside the binaries.
    # Uses always() because compile-binaries is skipped when nuitka_matrix is empty.
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && !fromJSON(inputs.metadata).release_commits_matrix
      && fromJSON(inputs.metadata).current_version
    # Serialise this job across overlapping release runs: the dev pre-release is a
    # single mutable GitHub resource this job deletes, recreates and uploads to. The
    # run-level concurrency in release.yaml cancels a superseded run mid-sync, which
    # can leave the pre-release half-rewritten and fail the next run's sync. A
    # dedicated per-repository group that never cancels in progress lets each sync
    # finish cleanly before the next starts; GitHub keeps only the latest queued one,
    # so the pre-release still converges to the newest build.
    concurrency:
      group: sync-dev-release-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.4"
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release_assets
          merge-multiple: true
      - name: Sync dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic sync-dev-release --live
          --upload-assets release_assets
