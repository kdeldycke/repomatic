---
name: 🚀 Build & release
# Read https://github.com/actions/runner/issues/491 for insights on complex workflow execution logic.
"on":
  workflow_call:
    secrets:
      REPOMATIC_PAT:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false
    # No workflow_call outputs: the caller's publish-pypi job sources
    # package_built, release_commits_matrix, and release_notes_with_admonition
    # from the _release-build.yaml fast lane instead. This engine only consumes
    # the wheel artifact (run-scoped) the build lane uploaded. See release.yaml.

  # Call-only engine: no push or workflow_dispatch trigger. Every repo (repomatic
  # included) drives this engine from its own release.yaml entry, which owns those
  # triggers and the publish-pypi job. Keeping the publish job out of the engine
  # is what lets each caller's OIDC `job_workflow_ref` claim resolve to its own
  # release.yaml for PyPI's Trusted Publisher. See pypi/warehouse#11096 and
  # docs/workflows.md.

permissions: {}

# No concurrency block: the push-triggered release.yaml entry owns the
# concurrency group. A block here would join its group behind the caller's
# `needs: build` gate, too late to cancel queued runs, and would contend with
# the entry's group. See repomatic/github/actions.py for rationale.

jobs:

  metadata:
    name: 🧬 Project metadata
    runs-on: ubuntu-slim
    outputs:
      has_virustotal_key: ${{ steps.check-vt-key.outputs.has_key }}
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Checkout pull request HEAD commit to ignore actions/checkout's merge commit. Fallback to push SHA.
          # See: https://github.com/actions/checkout/issues/504
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # We're going to browse all new commits.
          fetch-depth: 0
      - name: List all branches
        run: git branch --all
      - name: List all commits
        run: git log --decorate=full --oneline
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress --from . repomatic metadata
          --format github-json --output "$GITHUB_OUTPUT"
          new_commits_matrix release_commits_matrix build_targets nuitka_matrix
          nuitka_extras is_python_project package_name current_version
          released_version release_notes release_notes_with_admonition
          skip_binary_build manpages_script manpages_asset_name
      - name: Check VirusTotal API key
        id: check-vt-key
        env:
          HAS_KEY: ${{ secrets.VIRUSTOTAL_API_KEY && 'true' || '' }}
        run: echo "has_key=${HAS_KEY}" >> "$GITHUB_OUTPUT"

  compile-binaries:
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }}, ${{ matrix.short_sha }} build"
    needs:
      - metadata
    # Skip binary compilation for branches that don't affect code (e.g., update-mailmap, format-markdown).
    if: >-
      fromJSON(needs.metadata.outputs.metadata).nuitka_matrix
      && !(fromJSON(needs.metadata.outputs.metadata).skip_binary_build || false)
    strategy:
      # Asset-producing matrix: see docs/workflows.md "Matrix fail-fast strategy".
      fail-fast: false
      # Fall back to an empty `{"include":[]}` matrix when nuitka_matrix is null
      # (binary builds disabled via nuitka.enabled = false). GitHub resolves
      # strategy.matrix during job setup even when `if:` will skip the job, and a
      # null matrix combined with the matrix-derived `runs-on` below aborts the
      # whole run. See the publish-pypi job and docs/workflows.md.
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).nuitka_matrix || fromJSON('{"include":[]}') }}
    runs-on: ${{ matrix.os }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Setup venv
        run: uv --no-progress venv --python 3.14
      - name: Sync optional-dependencies for Nuitka build
        # Install the [project.optional-dependencies] extras listed in
        # [tool.repomatic] nuitka.extras into the build venv, so Nuitka can
        # bundle their packages. See the nuitka_extras docstring in
        # repomatic/config.py for the full rationale.
        if: fromJSON(needs.metadata.outputs.metadata).nuitka_extras
        env:
          EXTRAS: ${{ fromJSON(needs.metadata.outputs.metadata).nuitka_extras }}
        shell: bash
        run: |
          # EXTRAS is a space-separated list emitted by Metadata.format_github_value.
          flags=""
          for extra in ${EXTRAS}; do
            flags="${flags} --extra ${extra}"
          done
          # shellcheck disable=SC2086
          uv --no-progress sync --frozen ${flags}
      - name: Pre-bake build metadata
        if: contains(matrix.current_version, '.dev')
        run: uvx --no-progress 'click-extra==8.1.4' prebake all
      - name: Build binary
        id: build-binary
        continue-on-error: true
        # The onefile build runs through `repomatic run nuitka`: the tool runner
        # installs the pinned Nuitka, translates the [tool.nuitka] section to CLI
        # flags, and prepends --mode=onefile. The matrix supplies only repomatic's
        # per-entry-point flags (like --python-flag=-m), which carry no spaces.
        # User flags with spaces belong in [tool.nuitka], which the tool runner
        # passes as a proper argv, so a plain word-split is enough here.
        env:
          NUITKA_PYTHON_FLAGS: ${{ matrix.nuitka_python_flags }}
          BIN_NAME: ${{ matrix.bin_name }}
          MODULE_PATH: ${{ matrix.module_path }}
        shell: bash
        run: |
          # NUITKA_PYTHON_FLAGS holds the entry point's --python-flag (if any),
          # meant to word-split.
          # shellcheck disable=SC2086
          uvx --no-progress --from . repomatic run nuitka -- \
            ${NUITKA_PYTHON_FLAGS} \
            --output-filename="${BIN_NAME}" "${MODULE_PATH}"
      - name: Upload Nuitka crash report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuitka-crash-report-${{ matrix.os }}-${{ matrix.short_sha }}.xml
          if-no-files-found: ignore
          path: nuitka-crash-report.xml
      - if: steps.build-binary.outcome == 'failure'
        run: |
          echo "Nuitka build failed, skipping the rest of the steps."
          exit 1
      - name: Install exiftool - Linux
        if: runner.os == 'Linux'
        run: sudo apt --quiet --yes install exiftool
      - name: Install exiftool - macOS
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install exiftool - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install exiftool --no-progress --yes --retry-count=3
          if (-not (Get-Command exiftool -ErrorAction SilentlyContinue)) {
            Write-Error "exiftool not found on PATH after choco install"
            exit 1
          }
      - name: Verify binary architecture
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        run: >
          uvx --no-progress --from . repomatic
          verify-binary --target "${TARGET}" --binary "${BIN_NAME}"
      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Artifact name includes SHA for uniqueness across commits; the file
          # inside uses the clean release name (no SHA suffix).
          name: ${{ matrix.bin_name }}-${{ matrix.short_sha }}
          if-no-files-found: warn
          path: ${{ matrix.bin_name }}
      - name: Generate binary attestation
        id: attest-binary
        if: >-
          github.ref == 'refs/heads/main'
          && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ matrix.bin_name }}
      - name: Verify binary attestation
        if: >-
          github.ref == 'refs/heads/main'
          && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
        env:
          GH_TOKEN: ${{ github.token }}
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        run: >
          gh attestation verify "${BIN_NAME}"
          --repo "${{ github.repository }}"
          --signer-repo kdeldycke/repomatic
      - name: Upload attestation bundle
        if: >-
          github.ref == 'refs/heads/main'
          && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
          && steps.attest-binary.outputs.bundle-path
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestation-${{ matrix.bin_name }}-${{ matrix.short_sha }}
          path: ${{ steps.attest-binary.outputs.bundle-path }}

  test-binaries:
    name: "${{ matrix.state == 'stable' && '✅' || '⁉️' }} ${{ matrix.os }}, ${{ matrix.short_sha }} test"
    needs:
      - metadata
      - compile-binaries
    # Skip binary tests for branches that don't affect code (e.g., update-mailmap, format-markdown).
    if: >
      fromJSON(needs.metadata.outputs.metadata).nuitka_matrix
      && !(fromJSON(needs.metadata.outputs.metadata).skip_binary_build || false)
    strategy:
      # Advisory matrix (default fail-fast): see docs/workflows.md "Matrix fail-fast strategy".
      # Fall back to an empty `{"include":[]}` matrix when nuitka_matrix is null
      # (binary builds disabled via nuitka.enabled = false). GitHub resolves
      # strategy.matrix during job setup even when `if:` will skip the job, and a
      # null matrix combined with the matrix-derived `runs-on` below aborts the
      # whole run. See the publish-pypi job and docs/workflows.md.
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).nuitka_matrix || fromJSON('{"include":[]}') }}
    runs-on: ${{ matrix.os }}
    # We keep going when a job flagged as not stable fails.
    continue-on-error: ${{ matrix.state == 'unstable' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.commit }}
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifacts
        with:
          name: ${{ matrix.bin_name }}-${{ matrix.short_sha }}
      - name: Set binary permissions
        if: runner.os != 'Windows'
        env:
          DOWNLOAD_PATH: ${{ steps.artifacts.outputs.download-path }}
          BIN_NAME: ${{ matrix.bin_name }}
        run: chmod +x "${DOWNLOAD_PATH}/${BIN_NAME}"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Run test suite for binary
        env:
          DOWNLOAD_PATH: ${{ steps.artifacts.outputs.download-path }}
          BIN_NAME: ${{ matrix.bin_name }}
        shell: bash
        # The binary self-test reads ./tests/cli-test-suite.toml (the click-extra 8.1
        # default), parsed with the built-in tomllib, so no optional extra is needed.
        run: >
          uv run --frozen --no-progress --
          click-extra test-suite
          --binary "${DOWNLOAD_PATH}/${BIN_NAME}"
          --jobs max

  create-tag:
    name: 📌 Tag release (${{ matrix.short_sha }})
    needs:
      - metadata
    # Only consider pushes to main branch as triggers for releases.
    if: github.ref == 'refs/heads/main' && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.commit }}
          # PAT required so tag pushes trigger downstream on.push.tags workflows.
          # See repomatic/git_ops.py module docstring.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Create and push tag
        # Idempotent: skips if tag already exists instead of failing. This allows re-running
        # workflows interrupted after tag creation.
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          COMMIT: ${{ matrix.commit }}
        run: >
          uvx --no-progress --from . repomatic git-tag
          --tag "v${CURRENT_VERSION}"
          --commit "${COMMIT}"
          --skip-existing

  create-release:
    name: 🐙 Create GitHub release draft (${{ matrix.short_sha }})
    needs:
      - metadata
      - create-tag
    # Make sure this job always starts if create-tag ran and succeeded.
    # The wheel is built by the _release-build.yaml lane; release.yaml gates this
    # engine on `needs: build`, so the artifact is uploaded before this runs.
    if: always() && needs.create-tag.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      # Allow project without REPOMATIC_PAT to create a GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - name: Download Python package
        # Do not fetch build artifacts for non-Python projects (no wheel built).
        if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifacts
        with:
          path: release_artifact
          name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}
      - name: Delete dev pre-release
        # Clean up all rolling dev releases before creating the real release.
        # See repomatic/github/dev_release.py for rationale.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: uvx --no-progress --from . repomatic sync-dev-release --live --delete
      - name: Create GitHub release draft
        # Idempotent: skips if release already exists (e.g. workflow re-run).
        # Notes carry the PyPI availability admonition from the start: baking it
        # here (instead of editing the release from the caller's fast publish-pypi
        # lane) removes the cross-lane race where that edit ran before this job
        # had created the release. release_notes_with_admonition is empty for
        # non-PyPI projects, which then fall back to the plain notes. See
        # repomatic/metadata.py:release_notes_with_admonition for rationale.
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          COMMIT: ${{ matrix.commit }}
          REPO: ${{ github.repository }}
          RELEASE_NOTES: >-
            ${{ fromJSON(needs.metadata.outputs.metadata).release_notes_with_admonition
            || fromJSON(needs.metadata.outputs.metadata).release_notes }}
        run: |
          tag="v${CURRENT_VERSION}"
          if gh release view "${tag}" --repo "${REPO}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists, skipping creation."
          else
            shopt -s nullglob
            files=(release_artifact/*)
            gh release create "${tag}" \
              --draft \
              --target "${COMMIT}" \
              --title "${tag}" \
              --repo "${REPO}" \
              --notes-file - \
              "${files[@]}" <<< "${RELEASE_NOTES}"
          fi

  # Render the Click CLI command tree declared by `[tool.repomatic.manpages]` as roff `.1` files and attach them as a
  # tarball asset to the GitHub release draft. The upload must land before `publish-release` flips the draft to a
  # published release: GitHub immutable releases lock a published release's assets, so a post-publish upload fails
  # with HTTP 422. Opt-in: silently skipped when `manpages.script` is empty in the consumer's pyproject.toml. Shells
  # out to the `click-extra wrap --man --output-dir` CLI (click-extra 8.0+), against the consumer's already-synced
  # venv, so repomatic stays out of the resolution graph.
  manpages:
    name: 📖 Man pages (${{ matrix.short_sha }})
    needs:
      - metadata
      - create-release
    if: >-
      always()
      && needs.create-release.result == 'success'
      && fromJSON(needs.metadata.outputs.metadata).manpages_script != ''
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.commit }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - name: Install project
        run: uv --no-progress sync --frozen
      - name: Generate man pages
        env:
          SCRIPT: ${{ fromJSON(needs.metadata.outputs.metadata).manpages_script }}
        run: >
          uv --no-progress run --frozen --
          click-extra wrap --man --output-dir man "${SCRIPT}"
      - name: Bundle as tarball
        env:
          ASSET_NAME: >-
            ${{
              fromJSON(needs.metadata.outputs.metadata).manpages_asset_name
              || format('{0}-manpages', fromJSON(needs.metadata.outputs.metadata).package_name)
            }}
        run: tar --create --gzip --file "${ASSET_NAME}.tar.gz" man/
      - name: Attach to release draft
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          ASSET_NAME: >-
            ${{
              fromJSON(needs.metadata.outputs.metadata).manpages_asset_name
              || format('{0}-manpages', fromJSON(needs.metadata.outputs.metadata).package_name)
            }}
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          gh release upload "v${CURRENT_VERSION}" "${ASSET_NAME}.tar.gz"
          --repo "${{ github.repository }}"
          --clobber

  publish-release:
    name: 🎉 Publish GitHub release (${{ matrix.short_sha }})
    needs:
      - metadata
      - create-release
      - compile-binaries
      - manpages
    # Terminal step: flips the draft to a published (immutable) release, so it must wait for every asset-upload job
    # (binaries below, man pages in `manpages`). Gates only on create-release so the release still publishes when
    # binaries or man pages are skipped or fail; always() lets it run despite an upstream job's non-success.
    if: >-
      always()
      && needs.create-release.result == 'success'
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Download binary and attestation artifacts
        # Gate on != 'skipped' (not == 'success') so partial-matrix runs still
        # attach their healthy binaries: see docs/workflows.md "Matrix fail-fast strategy".
        if: needs.compile-binaries.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-${{ matrix.short_sha }}"
          path: ./compile-assets
          merge-multiple: true
      - name: Upload binaries and attestation bundles to release
        # Exclude Python packages (.tar.gz, .whl) already uploaded by create-release.
        if: needs.compile-binaries.result != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        shell: bash
        run: |
          shopt -s nullglob extglob
          files=(./compile-assets/!(*.tar.gz|*.whl))
          if [[ ${#files[@]} -gt 0 ]]; then
            gh release upload "v${CURRENT_VERSION}" \
              "${files[@]}" \
              --repo "${{ github.repository }}" \
              --clobber
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
          REPO: ${{ github.repository }}
        run: >
          gh release edit "v${CURRENT_VERSION}"
          --draft=false
          --repo "${REPO}"

  scan-virustotal:
    name: 🛡️ VirusTotal scan (${{ matrix.short_sha }})
    needs:
      - metadata
      - publish-release
    # Run after publish-release so the release assets exist. Skip if no VT key.
    if: >-
      always()
      && needs.publish-release.result == 'success'
      && needs.metadata.outputs.has_virustotal_key
    strategy:
      matrix: ${{ fromJSON(needs.metadata.outputs.metadata).release_commits_matrix }}
      # Each cell commits scan records to the default branch; serializing the
      # (rare) multi-release runs keeps them from racing on the same files.
      max-parallel: 1
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Scan records and the binaries page are committed on top of the
          # default branch tip, not the release commit. The PAT (when
          # available) lets the push trigger the docs deploy workflow.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: false
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        run: >
          gh release download "v${CURRENT_VERSION}"
          --repo "${{ github.repository }}"
          --pattern "*.bin"
          --pattern "*.exe"
          --dir ./binaries
      - name: Upload to VirusTotal and record detections
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          CURRENT_VERSION: ${{ matrix.current_version }}
        run: >
          uvx --no-progress --from . repomatic scan-virustotal
          --tag "v${CURRENT_VERSION}"
          --binaries-dir ./binaries
          --poll
          --poll-timeout 600
          --records docs/assets/virustotal-scans.json
      - name: Regenerate binaries page
        # See repomatic/binaries_page.py for the page design rationale.
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          uvx --no-progress --from . repomatic sync-binaries
          --repo "${{ github.repository }}"
          --page docs/binaries.md
          --records docs/assets/virustotal-scans.json
          --backfill-records
      - name: Commit and push scan records
        env:
          CURRENT_VERSION: ${{ matrix.current_version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >
          uvx --no-progress --from . repomatic git-commit-push
          --message "Record v${CURRENT_VERSION} binaries"
          --branch "${DEFAULT_BRANCH}"
          docs/binaries.md
          docs/assets/binaries.csv
          docs/assets/virustotal-scans.json

  sync-dev-release:
    name: 🔄 Sync dev pre-release
    needs:
      - metadata
      - compile-binaries
    # Run on non-release pushes to main after builds complete. The wheel comes
    # from the _release-build.yaml lane (release.yaml gates this engine on
    # `needs: build`), downloaded run-scoped below alongside the binaries.
    # Uses always() because compile-binaries may be skipped (no nuitka_matrix or skip_binary_build).
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && !fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
      && fromJSON(needs.metadata.outputs.metadata).current_version
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release_assets
          merge-multiple: true
      - name: Sync dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          uvx --no-progress --from . repomatic sync-dev-release --live
          --upload-assets release_assets
