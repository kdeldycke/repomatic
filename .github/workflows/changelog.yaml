---
name: 🆙 Changelog & versions
"on":
  workflow_call:
    secrets:
      REPOMATIC_PAT:
        required: false
  workflow_dispatch:
  schedule:
    # Run daily at 6:00 UTC for bump-version job.
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - changelog.md
      - "**/pyproject.toml"
      # Trigger on any workflow change to make sure version gets hard-coded everywhere.
      - .github/workflows/*.yaml
      # Trigger on lockfile changes so bump-version recreates its PRs before they conflict.
      - uv.lock
      # Trigger on source and docs changes too, so a reconciliation commit that
      # touches only these gets an immediate PR re-base instead of waiting for the
      # workflow_run backstop below (see the prepare-release job). That backstop
      # re-bases the PR after every successful Build & release, whatever paths it
      # touched, so a commit landing entirely outside this list (a skill, a
      # composite action under .github/actions/, readme.md or claude.md) is caught
      # then rather than leaving the PR stale.
      - "**/*.py"
      - "docs/**"
  # Trigger after release workflow completes to ensure tags exist before bump-version.
  # This avoids race conditions where changelog workflow checks for tags before they're pushed.
  workflow_run:
    workflows:
      # Must match the release workflow's `name:` exactly (emoji included):
      # GitHub silently ignores the trigger when the name has no match.
      - "🚀 Build & release"
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  # Include event_name to prevent cross-event cancellation.
  # See https://repomatic.net/workflows#concurrency-strategies.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See https://repomatic.net/workflows#install-time-cooldown for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  metadata:
    name: 🧬 Project metadata
    # Run on schedule, manual dispatch, push, or after release workflow completes successfully.
    # Push events keep bump-version PRs conflict-free by recreating them on every main change.
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use github.sha, not workflow_run.head_sha (stale after release cycle).
          # See https://repomatic.net/workflows#workflow-run-checkout-pitfall.
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Run repomatic show-metadata
        id: metadata
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' show-metadata
          --output-format github-json --output "$GITHUB_OUTPUT"
          release_commits_matrix changelog_has_entries

  fix-changelog:
    name: 📋 Fix changelog
    needs:
      - metadata
    # Skip during release cycle (push event with release commits).
    # The workflow_run event after "🚀 Build & release" completes handles
    # the post-release case, when the GitHub release is published and
    # visible to the public API.
    if: >-
      github.event_name == 'workflow_run'
      || !fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-tags: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: Fix changelog dates and admonitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' lint-changelog --fix
      - name: Sync pull request
        # This job checks out a detached HEAD at `github.sha`; pr-sync falls
        # back to the default branch from the event payload as its base.
        # Fail fast instead of hanging when the GitHub API is rate-limit starved.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0'
          pr-sync --template fix-changelog
  bump-version:
    name: 🆙 Bump versions
    needs:
      - metadata
    # Always run since metadata already filters appropriate events.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        part:
          - minor
          - major
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use github.sha, not workflow_run.head_sha (stale after release cycle).
          ref: ${{ github.sha }}
          # Fetch tags so bump-version resolves the latest release tag when it
          # decides whether the bump is allowed. Without tags it falls back to
          # "allow" and never closes an orphan PR.
          fetch-tags: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - name: ${{ matrix.part }} version bump
        # Bumps, re-locks with a plain `uv lock` and converges the draft PR when the bump is allowed, or closes the PR
        # an earlier run left open when it no longer is. See repomatic/deps/uv.py::relock for why the lock is plain.
        # Fail fast instead of hanging when the GitHub API is rate-limit starved.
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          PART: ${{ matrix.part }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' bump-version --part "${PART}"

  prepare-release:
    name: 🎬 Prepare release
    needs:
      - metadata
    # Wait for a changelog entry: a release PR cut from an empty section would
    # publish empty release notes, so none opens until a bullet names what moved.
    # Skip only schedule (that trigger exists for the bump-version job alone).
    # workflow_run is intentionally allowed: after every "🚀 Build & release" run
    # that concludes `success`, the condition of the metadata job, it re-bases the
    # PR onto the current HEAD. That is the backstop for a push that did not match
    # this workflow's `paths:` filter (one touching only skills, a composite
    # action, or an unlisted markdown file), which would otherwise leave the PR
    # stale. A failed or cancelled Build & release re-bases nothing: a failure
    # blocks the release anyway, and a newer run supersedes a cancelled one. It
    # double-runs with the push trigger on paths-matching commits, but pr-sync
    # skips the push when the branch already carries the same change, so the
    # extra run is cheap and idempotent.
    if: >-
      github.event_name != 'schedule'
      && fromJSON(needs.metadata.outputs.metadata).changelog_has_entries
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PAT required: bare `git push` authenticates via checkout's own
          # credentials, not the `GH_TOKEN` env set below. See
          # repomatic/github/token.py module docstring.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      # --- Freeze commit: freeze everything to the release version. ---
      - name: Strip dev suffix for release
        # Bump the "dev" part: .dev0 → release (omitted), producing a clean X.Y.Z version.
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0'
          run bump-my-version -- bump --verbose dev
      - name: Sync uv.lock
        # Plain `uv lock`, not `--upgrade`: see repomatic/deps/uv.py::relock. Every
        # version bump in this file re-locks before its commit, so a tag never ships
        # with pyproject.toml ahead of uv.lock.
        run: uv --no-progress lock
      - name: Create freeze commit
        # Updates changelog and citation dates, comparison URL, and removes warning,
        # also hard-coding the version in workflow URLs for kdeldycke/repomatic. Then
        # commits as the CI bot, and hands the release version to the PR step.
        id: freeze
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' prepare-release --commit
          --output "$GITHUB_OUTPUT"
      # --- Unfreeze commit: revert to development references. ---
      - name: Re-target main branch in workflows
        # Reads the release version, so it runs before the patch bump. A no-op outside kdeldycke/repomatic.
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' prepare-release --post-release
      - name: Add new changelog entry
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' changelog
      - name: Version bump
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0'
          run bump-my-version -- bump --verbose patch
      - name: Sync uv.lock
        # Plain `uv lock`, not `--upgrade`: see repomatic/deps/uv.py::relock.
        run: uv --no-progress lock
      - name: Create unfreeze commit
        # The retargeting it repeats changes nothing by now. The commit names the
        # release version and the bumped one.
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0' prepare-release --post-release
          --commit
      - name: Sync pull request
        # The freeze and unfreeze commits above are already committed, so this
        # step carries them through as two commits rather than squashing them:
        # the release lane rebase-merges this PR and both must land intact.
        # Runs after the post-release bump, so the body's attribution footer names that bumped
        # version rather than the code that rendered it: see
        # repomatic/templating.py::render_template.
        # Fail fast instead of hanging when the GitHub API is rate-limit starved.
        timeout-minutes: 10
        env:
          # Authenticated read so the checklist can link the draft dev pre-release
          # (drafts are visible only to maintainers) and resolve the previous tag.
          # We need custom PAT with workflows permission to hard-code version numbers in URLs in
          # .github/workflows/*.yaml files.
          CURRENT_VERSION: ${{ steps.freeze.outputs.version }}
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.0'
          pr-sync --template prepare-release --version "$CURRENT_VERSION"
