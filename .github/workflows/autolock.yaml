# Locks closed issues and pull requests after a period of inactivity, to prevent spam and noise.
---
name: 🔒 Autolock
"on":
  workflow_call:
  workflow_dispatch:
  schedule:
    # Run weekly, every Monday at 00:43.
    - cron: "43 0 * * 1"

permissions: {}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal that tests/test_workflows.py holds
# equal to `[tool.repomatic] minimum-release-age`. Deliberate bypasses are
# per-package CLI flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  lock:
    name: 🔒 Lock inactive threads
    runs-on: ubuntu-slim
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          # Lock down after 3 months.
          issue-inactive-days: '90'
          issue-comment: >
            This issue has been automatically locked since there has not been any recent activity after it was closed.
            Please open a new issue for related bugs.
          pr-inactive-days: '90'
          pr-comment: >
            This pull request has been automatically locked since there has not been any recent activity after it was
            closed. Please open a new issue for related bugs.
