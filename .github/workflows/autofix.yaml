---
name: 🪄 Autofix
"on":
  workflow_call:
    # The Cloudflare token is read only to report whether it exists: the
    # setup-guide job below cannot deploy anything, and never sees a value
    # it does not already have a name for. The account identifier is not
    # asked for at all, since the token resolves it on its own.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      REPOMATIC_NOTIFICATIONS_PAT:
        required: false
      REPOMATIC_PAT:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false
  workflow_dispatch:
  schedule:
    # Run weekly so quiet repositories still pick up dependency, tool, and
    # action-pin updates discovered by the sync jobs below.
    - cron: "27 4 * * 1"
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  setup-guide:
    name: 📖 Setup guide
    # Run on push to the default branch and on manual workflow_dispatch
    # re-runs. Not gated against workflow_call invocations from downstream
    # callers: when called that way the job runs in the caller's repo
    # context (via GITHUB_REPOSITORY) and manages the caller's own
    # setup-guide issue. Runs without `needs: metadata`, so it repeats the
    # version-bump commit gate the metadata job carries.
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !startsWith(github.event.head_commit.message || '', '[changelog] ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Manage setup guide issue
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN && 'true' || '' }}
          HAS_REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT && 'true' || '' }}
          HAS_VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY && 'true' || '' }}
        run: uv --no-progress run --frozen -- repomatic setup-guide

  sync-runner-images:
    name: 🖥️ Sync runner images
    # Schedule-only: the available-images table changes on GitHub's clock, not
    # on a push here, and a deprecation carries months of notice. Running it
    # per-push would re-read that table on every commit to re-propose what it
    # proposed an hour ago.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      # The proposal feeds the pull request body and is not repository content,
      # so it is written outside the work tree rather than written in and then
      # excluded from the commit by a pathspec.
      - name: Propose runner image changes
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          PROPOSAL: ${{ runner.temp }}/runner-images-proposal.md
        run: >
          uv --no-progress run --frozen -- repomatic
          sync-runner-images --output "$PROPOSAL"
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          PROPOSAL: ${{ runner.temp }}/runner-images-proposal.md
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-runner-images
          --template-arg-file proposal="$PROPOSAL"

  metadata:
    name: 🧬 Project metadata
    # Skipping this job propagates to every `needs: metadata` job below, so the
    # workflow costs no runner minutes on version-bump pushes: those commits are
    # machine-generated and ship-gated, any drift they could introduce is caught
    # by the next ordinary push or the weekly scheduled sweep, and the one job
    # whose only firing moment was the release push (update-dep-graph) now lives
    # in the release engine. The PR branch list must stay in sync with
    # repomatic.git_ops.VERSION_BUMP_BRANCHES; the single commit-message clause
    # relies on repomatic.git_ops.CHANGELOG_COMMIT_PREFIX marking every
    # machine-authored version-machinery commit. Both enforced by repomatic's
    # own test suite.
    if: >
      !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
      && !startsWith(github.event.head_commit.message || '', '[changelog] ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run repomatic metadata
        id: metadata
        run: >
          uv --no-progress run --frozen -- repomatic metadata
          --format github-json --output "$GITHUB_OUTPUT"
          gitignore_exists python_files pyproject_files json_files doc_files
          markdown_files is_python_project is_python_package mailmap_exists
          image_files shfmt_files workflow_files active_autodoc uses_myst
          release_commits_matrix

  # --- Formatters: rewrite files to enforce canonical style. ---

  format-python:
    name: 🐍 Format Python
    needs:
      - metadata
    # Ruff can format code in both Python and Markdown files.
    if: fromJSON(needs.metadata.outputs.metadata).python_files || fromJSON(needs.metadata.outputs.metadata).doc_files
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run autopep8
        if: fromJSON(needs.metadata.outputs.metadata).python_files
        # Ruff is not wrapping comments: https://github.com/astral-sh/ruff/issues/7414
        # We use autopep8 to only wrap long-line comments.
        # An explicit file list is required, as autopep8 cannot find files in the
        # ".github" subdirectory on its own: the tool runner resolves it. See
        # `ToolSpec.default_paths` in repomatic/tooling/tool_registry.py.
        run: uv --no-progress run --frozen -- repomatic run autopep8
      # XXX Ruff is planning to support linting and formatting in one unified command at one point.
      #     See: https://github.com/astral-sh/ruff/issues/8232
      - name: Run Ruff
        # `check` uses `--exit-zero` so an unfixable finding (a rule whose only fix is
        # unsafe, like `FLY002`) cannot abort this `set -e` step before `format` runs:
        # that would strand the pending reformatting and skip the pull request below.
        # Linting gates in the lint workflow; here `check` only applies its safe fixes,
        # and the GitHub annotation still surfaces whatever it could not fix.
        run: |
          uv --no-progress run --frozen -- repomatic run ruff -- \
            check --output-format github --exit-zero
          uv --no-progress run --frozen -- repomatic run ruff -- \
            format --output-format github
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template format-python
  format-pyproject:
    name: 📐 Format pyproject.toml
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).is_python_project
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run pyproject-fmt
        # pyproject-fmt returns exit code 1 when it reformats the file, which is
        # the expected outcome in an autofix workflow. Tolerating it is only safe
        # because the tool runner checks the files too: a crash that exits 1
        # without rewriting anything arrives here as 70 and fails the job. See
        # `ToolSpec.rewrite_exit_code`. No file list: the tool runner resolves it,
        # which also drops the xargs that used to translate that 1 into a 123.
        # See `ToolSpec.default_paths` in repomatic/tooling/tool_registry.py.
        run: |
          rc=0
          uv --no-progress run --frozen -- repomatic run pyproject-fmt || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] || exit "$rc"
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template format-pyproject
  format-markdown:
    name: ✍️ Format Markdown
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).markdown_files
    # The heaviest light job, and the only one where the image's CPU shows up at
    # all: it spawns one mdformat per file. ARM would run that pass ~1.26x
    # faster, but mdformat-config pulls taplo, which ships no linux-aarch64
    # wheel and has a broken 0.9.3 sdist, so this job stays on x86 whatever the
    # rest of the fleet does. `shfmt` no longer pins it to a full image either
    # way: `repomatic run mdformat` provisions that through mdformat's
    # `path_tools` instead of apt. See docs/test-matrix.md.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      # Shares the `format-shell` job's shfmt cache: mdformat pulls the same
      # pinned binary through its `path_tools`, keyed off the registry file that
      # pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-
      - name: Auto-format Markdown
        # No file list: the tool runner resolves mdformat's targets and runs it
        # once per file, the way `xargs -n1` used to here. See
        # `ToolSpec.default_paths` in repomatic/tooling/tool_registry.py.
        run: uv --no-progress run --frozen -- repomatic run mdformat
      # Runs inside this job, not its own: it corrects what mdformat just wrote,
      # so a separate job would fight this one across two PRs. See
      # repomatic/awesome_toc.py for rationale.
      - name: Markdown fixes for Awesome Lists
        if: startsWith(github.event.repository.name, 'awesome-')
        run: uv --no-progress run --frozen -- repomatic fix-awesome-toc
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template format-markdown
  format-shell:
    name: 🐚 Format Shell
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).shfmt_files
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-
      - name: Format shell scripts
        # No file list: the tool runner resolves shfmt's targets, and skips the
        # tool outright when there are none. A pathless shfmt reads stdin, and
        # an empty `xargs` list used to hand it exactly that. See
        # `ToolSpec.default_paths` in repomatic/tooling/tool_registry.py.
        run: uv --no-progress run --frozen -- repomatic run shfmt
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template format-shell
  format-json:
    name: 🔧 Format JSON
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).json_files
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-biome-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-biome-
      - name: Format JSON
        # No arguments: the tool runner supplies biome's subcommand, its JSONC
        # parse flags and the file list. See `ToolSpec.default_args` in
        # repomatic/tooling/tool_registry.py.
        run: uv --no-progress run --frozen -- repomatic run biome
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template format-json
  # --- Fixers: correct or improve existing content in-place. ---

  fix-typos:
    name: ✏️ Fix typos
    # Runs without `needs: metadata`, so it repeats the version-bump commit
    # gate the metadata job carries.
    if: >
      !startsWith(github.event.head_commit.message || '', '[changelog] ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PAT required: bare `git push` authenticates via checkout's own
          # credentials, not the `GH_TOKEN` env set below. See
          # repomatic/github/token.py module docstring.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-typos-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-typos-
      - name: Fix typos
        run: uv --no-progress run --frozen -- repomatic run typos
      - name: Sync pull request
        env:
          # We need custom PAT with workflows permissions to fix typos in .github/workflows/*.yaml` files.
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template fix-typos
  fix-vulnerable-deps:
    name: 🛡️ Fix vulnerable deps
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).is_python_project
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - id: fix
        name: Fix vulnerable dependencies
        # GH_TOKEN lets repomatic query the GitHub Advisory Database via the
        # repo's Dependabot alerts. PAT is preferred when present so the
        # token has the Dependabot alerts permission; falls back to the
        # workflow token (which carries the same permission scope under
        # security-events: read).
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic audit --fix
          --repo "${{ github.repository }}"
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_DIFF_TABLE_FILE: ${{ steps.fix.outputs.diff_table_file }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template fix-vulnerable-deps
  sync-repomatic:
    name: 🔄 Sync repomatic
    # Runs without `needs: metadata`, so it repeats the version-bump commit
    # gate the metadata job carries.
    if: >
      !startsWith(github.event.head_commit.message || '', '[changelog] ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PAT required: bare `git push` authenticates via checkout's own
          # credentials, not the `GH_TOKEN` env set below. See
          # repomatic/github/token.py module docstring.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Sync repomatic-managed files
        run: >
          uv --no-progress run --frozen -- repomatic init
          --delete-unmodified --delete-excluded
      - name: Sync pull request
        env:
          # We need custom PAT with workflows permissions to update .github/workflows/*.yaml files.
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-repomatic
  format-images:
    name: 🖼️ Format images
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).image_files
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      # oxipng is no longer installed here: `format-images` pulls it from the
      # `repomatic run` registry, pinned and checksum-verified, where this step
      # used to `dpkg --install` an unverified .deb fetched by hand. jpegoptim
      # cannot follow, as upstream ships source tarballs rather than binaries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-
      - name: Install jpegoptim
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jpegoptim
      # The summary table feeds the pull request body and is not repository
      # content, so it is written outside the work tree rather than written in
      # and then excluded from the commit by a pathspec.
      - name: Format images
        env:
          SUMMARY: ${{ runner.temp }}/format-images-summary.md
        run: >
          uv --no-progress run --frozen -- repomatic format-images
          --output "$SUMMARY"
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          SUMMARY: ${{ runner.temp }}/format-images-summary.md
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template format-images
          --template-arg-file summary="$SUMMARY"
  # --- Syncers: regenerate files from external sources or project state. ---

  sync-gitignore:
    name: 🙈 Sync .gitignore
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).gitignore_exists
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Sync .gitignore
        run: uv --no-progress run --frozen -- repomatic sync-gitignore
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-gitignore
  sync-bumpversion:
    name: 🔄 Sync bumpversion config
    needs:
      - metadata
    # is_python_package, not is_python_project: a uv virtual project
    # ([tool.uv] package = false) has a [project] table but nothing to version.
    if: fromJSON(needs.metadata.outputs.metadata).is_python_package
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Sync bumpversion config
        run: uv --no-progress run --frozen -- repomatic sync-bumpversion
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-bumpversion
  sync-mailmap:
    name: 📬 Sync .mailmap
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).mailmap_exists
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history to extract all contributors.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Sync .mailmap
        run: uv --no-progress run --frozen -- repomatic sync-mailmap --skip-if-missing
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-mailmap
  sync-deps:
    name: 🔗 Sync dependencies
    # Consolidated dependency updater. One runner shares the checkout, the uv
    # install, and repomatic's HTTP cache across all four bumpers, instead of a
    # separate job per bumper each paying that setup. Each bumper still opens its
    # own PR: the working tree is reset before each one so their diffs never
    # bleed, keeping review and revert independent. Mirrors the local
    # `repomatic sync-deps` command; the steps stay per-bumper here only because
    # each needs its own branch and PR body.
    #
    # Sharing a runner also shares a failure, and that is what `!cancelled()` on
    # every bumper's own steps undoes. A failed step otherwise skips the entire
    # remainder of the job, so the second bumper dying takes the third and fourth
    # with it. On kdeldycke/blog the `sync-uv-lock` diff table outgrew what Linux
    # allows in a single environment string, `execve` refused to start the step
    # that reads it, and `sync-action-pins` and `sync-workflow-pins` were skipped
    # on every run for days without ever being the thing that broke: an
    # `html-validate` bump sat unproposed the whole time. Inside a bumper the
    # chain still holds, each step gated on the previous one's `outcome`, so a
    # bumper that failed never opens a PR with an empty body. Nothing is
    # swallowed either: a failed step still reports red, the job now just reports
    # every failure instead of the first. The one thing lost is a short-circuit
    # on the shared setup, which now surfaces as four failing bumpers rather than
    # one; each dies in seconds, and the earliest entry in the log is still the
    # real cause.
    needs:
      - metadata
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history, not the default shallow clone: this job runs
      # create-pull-request several times in one checkout, and a shallow clone
      # trips "shallow file has changed since we read it" on the second call,
      # corrupting the --force-with-lease push (the four standalone jobs never
      # hit this, each having its own checkout with a single create-pull-request).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # PAT required: bare `git push` authenticates via checkout's own
          # credentials, not the `GH_TOKEN` env set on later steps. Without it,
          # a push touching `.github/workflows/*.yaml` (sync-workflow-pins) is
          # rejected. See repomatic/github/token.py module docstring.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      # Persist repomatic's HTTP cache (PyPI/GitHub/npm release metadata) across
      # runs; this mainly speeds up bursts of pushes. TTL-gating bounds staleness
      # at a day rather than preventing it, so a restored cache can miss a
      # release published since it was written. Here that only defers a version
      # bump by a run. A job that writes availability claims must re-confirm
      # live instead: see the retraction gate in repomatic/changelog.py.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic
          key: repomatic-http-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            repomatic-http-${{ runner.os }}-

      # --- sync-dep-sources: adopt released dependencies (Python projects). ---
      - if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Reset tree before sync-dep-sources
        run: git checkout -- .
      - id: sync-dep-sources
        if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Sync dependency sources
        run: >
          uv --no-progress run --frozen -- repomatic sync-dep-sources
          --no-table --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - if: >
          !cancelled()
          && steps.sync-dep-sources.outcome == 'success'
        name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_DIFF_TABLE_FILE: ${{ steps.sync-dep-sources.outputs.diff_table_file }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-dep-sources
      # --- sync-uv-lock: re-lock dependencies (Python projects). ---
      - if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Reset tree before sync-uv-lock
        run: git checkout -- .
      - id: sync-uv-lock
        if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Sync uv.lock
        run: >
          uv --no-progress run --frozen -- repomatic sync-uv-lock
          --no-table --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - if: ${{ !cancelled() && steps.sync-uv-lock.outcome == 'success' }}
        name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_DIFF_TABLE_FILE: ${{ steps.sync-uv-lock.outputs.diff_table_file }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-uv-lock
      # --- sync-action-pins: bump SHA-pinned actions (repos with workflows). ---
      - if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Reset tree before sync-action-pins
        run: git checkout -- .
      - id: sync-action-pins
        if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Sync action pins
        # GH_TOKEN raises the GitHub releases API rate limit when resolving
        # the latest tag and its commit SHA for each pinned action.
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic sync-action-pins --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - if: >
          !cancelled()
          && steps.sync-action-pins.outcome == 'success'
        name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_DIFF_TABLE_FILE: ${{ steps.sync-action-pins.outputs.diff_table_file }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-action-pins
      # --- sync-workflow-pins: bump npm/PyPI literals (repos with workflows). ---
      - if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Reset tree before sync-workflow-pins
        run: git checkout -- .
      - id: sync-workflow-pins
        if: >
          !cancelled()
          && fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Sync workflow pins
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic sync-workflow-pins --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - if: >
          !cancelled()
          && steps.sync-workflow-pins.outcome == 'success'
        name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_DIFF_TABLE_FILE: ${{ steps.sync-workflow-pins.outputs.diff_table_file }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template sync-workflow-pins
      # sync-tool-versions is deliberately absent: it rewrites repomatic's own
      # tool registry, so it lives in the upstream-only self-maintenance.yaml.

  update-docs:
    name: 📚 Update docs
    needs:
      - metadata
    if: >
      fromJSON(needs.metadata.outputs.metadata).is_python_project
      && fromJSON(needs.metadata.outputs.metadata).active_autodoc
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Update docs
        # Runs sphinx-apidoc, converts RST stubs to MyST if applicable, runs docs/docs_update.py, then
        # refreshes self-updating directive blocks with click-extra refresh-directives.
        run: uv --no-progress run --frozen -- repomatic update-docs
      - name: Format regenerated pyproject.toml
        # The project's docs.update-script may regenerate pyproject.toml sections (label rules,
        # keywords). Reformat them only when update-docs actually changed pyproject.toml, so this
        # job's PR stays a pyproject-fmt fixpoint without ping-ponging with format-pyproject. Guard
        # against the empty case: with no doc change, an unconditional reformat would open an
        # update-docs PR carrying only pre-existing formatting drift, a byte-for-byte duplicate of
        # the format-pyproject PR (which owns that drift). Same exit-code handling as that job:
        # pyproject-fmt exits 1 when it reformats.
        env:
          PYPROJECT_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).pyproject_files }}
        run: |
          if echo "${PYPROJECT_FILES}" | xargs git diff --quiet --; then
            echo "update-docs left pyproject.toml unchanged; leaving any formatting drift to format-pyproject."
            exit 0
          fi
          rc=0
          uv --no-progress run --frozen -- repomatic run pyproject-fmt || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ] || exit "$rc"
      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-sync --template update-docs
