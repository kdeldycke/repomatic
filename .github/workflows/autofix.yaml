---
name: 🪄 Autofix
"on":
  workflow_call:
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT:
        required: false
      REPOMATIC_PAT:
        required: false
      VIRUSTOTAL_API_KEY:
        required: false
  workflow_dispatch:
  schedule:
    # Run weekly so quiet repositories still pick up dependency, tool, and
    # action-pin updates discovered by the sync jobs below.
    - cron: "27 4 * * 1"
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal that tests/test_workflows.py holds
# equal to `[tool.repomatic] minimum-release-age`. Deliberate bypasses are
# per-package CLI flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  setup-guide:
    name: 📖 Setup guide
    # Run on push to the default branch and on manual workflow_dispatch
    # re-runs. Not gated against workflow_call invocations from downstream
    # callers: when called that way the job runs in the caller's repo
    # context (via GITHUB_REPOSITORY) and manages the caller's own
    # setup-guide issue.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Manage setup guide issue
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
          REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
          HAS_REPOMATIC_NOTIFICATIONS_PAT: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT && 'true' || '' }}
          HAS_VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY && 'true' || '' }}
        run: uv --no-progress run --frozen -- repomatic setup-guide

  metadata:
    name: 🧬 Project metadata
    runs-on: ubuntu-slim
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Run repomatic metadata
        id: metadata
        run: >
          uv --no-progress run --frozen -- repomatic metadata
          --format github-json --output "$GITHUB_OUTPUT"
          gitignore_exists python_files pyproject_files json_files doc_files
          markdown_files is_python_project mailmap_exists
          image_files shfmt_files workflow_files active_autodoc uses_myst
          release_commits_matrix

  # --- Formatters: rewrite files to enforce canonical style. ---

  format-python:
    name: 🐍 Format Python
    needs:
      - metadata
    # Ruff can format code in both Python and Markdown files.
    if: fromJSON(needs.metadata.outputs.metadata).python_files || fromJSON(needs.metadata.outputs.metadata).doc_files
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Run autopep8
        if: fromJSON(needs.metadata.outputs.metadata).python_files
        # Ruff is not wrapping comments: https://github.com/astral-sh/ruff/issues/7414
        # We use autopep8 to only wrap long-line comments.
        # Explicit list of files is provided, as autopep8 is not able to handle find files in ".github" subdirectory.
        env:
          PYTHON_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).python_files }}
        run: >
          echo "${PYTHON_FILES}" | xargs uv --no-progress run --frozen -- repomatic
          run autopep8 --
      # XXX Ruff is planning to support linting and formatting in one unified command at one point.
      #     See: https://github.com/astral-sh/ruff/issues/8232
      - name: Run Ruff
        # `check` uses `--exit-zero` so an unfixable finding (a rule whose only fix is
        # unsafe, like `FLY002`) cannot abort this `set -e` step before `format` runs:
        # that would strand the pending reformatting and skip the pull request below.
        # Linting gates in the lint workflow; here `check` only applies its safe fixes,
        # and the GitHub annotation still surfaces whatever it could not fix.
        run: |
          uv --no-progress run --frozen -- repomatic run ruff -- \
            check --output-format github --exit-zero
          uv --no-progress run --frozen -- repomatic run ruff -- \
            format --output-format github
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template format-python
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-python
          delete-branch: true

  format-pyproject:
    name: 📐 Format pyproject.toml
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).is_python_project
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Run pyproject-fmt
        # pyproject-fmt returns exit code 1 when it reformats the file, but
        # xargs translates any non-zero child exit to 123. Accept both 0 and
        # 123 since changes are expected in an autofix workflow.
        env:
          PYPROJECT_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).pyproject_files }}
        run: |
          rc=0
          echo "${PYPROJECT_FILES}" \
            | xargs uv --no-progress run --frozen -- repomatic \
              run pyproject-fmt -- || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 123 ] || exit "$rc"
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template format-pyproject
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-pyproject
          delete-branch: true

  format-markdown:
    name: ✍️ Format Markdown
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).markdown_files
    # Back on the lean default: shfmt was the only reason this job needed a full
    # image, and `repomatic run mdformat` now provisions it through mdformat's
    # `path_tools` instead of apt. ARM would run the per-file mdformat pass
    # ~1.26x faster, but mdformat-config pulls taplo, which ships no
    # linux-aarch64 wheel and has a broken 0.9.3 sdist; stay on x86 until taplo
    # publishes an aarch64 wheel. See docs/test-matrix.md.
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      # Shares the `format-shell` job's shfmt cache: mdformat pulls the same
      # pinned binary through its `path_tools`, keyed off the registry file that
      # pins it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-${{
            github.job_workflow_sha || hashFiles('repomatic/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-
      - name: Auto-format Markdown
        env:
          MARKDOWN_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).markdown_files }}
        run: >
          echo "${MARKDOWN_FILES}" | xargs -n1
          uv --no-progress run --frozen -- repomatic run mdformat --
      # Runs inside this job, not its own: it corrects what mdformat just wrote,
      # so a separate job would fight this one across two PRs. See
      # repomatic/awesome_toc.py for rationale.
      - name: Markdown fixes for Awesome Lists
        if: startsWith(github.event.repository.name, 'awesome-')
        run: uv --no-progress run --frozen -- repomatic fix-awesome-toc
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template format-markdown
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "📚 documentation"
          branch: format-markdown
          delete-branch: true

  format-shell:
    name: 🐚 Format Shell
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).shfmt_files
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-${{
            github.job_workflow_sha || hashFiles('repomatic/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-shfmt-
      - name: Format shell scripts
        env:
          SHELL_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).shfmt_files }}
        run: >
          echo "${SHELL_FILES}" | xargs uv --no-progress run --frozen -- repomatic
          run shfmt --
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template format-shell
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-shell
          delete-branch: true

  format-json:
    name: 🔧 Format JSON
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).json_files
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-biome-${{
            github.job_workflow_sha || hashFiles('repomatic/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-biome-
      - name: Format JSON
        # Allow comments and trailing commas for JSONC files.
        # Biome auto-detects well-known JSONC files (tsconfig.json, etc.).
        env:
          JSON_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).json_files }}
        run: |
          echo "${JSON_FILES}" | xargs \
            uv --no-progress run --frozen -- repomatic run biome -- \
            format --write --no-errors-on-unmatched \
            --json-parse-allow-comments=true --json-parse-allow-trailing-commas=true
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template format-json
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: format-json
          delete-branch: true

  # --- Fixers: correct or improve existing content in-place. ---

  fix-typos:
    name: ✏️ Fix typos
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-typos-${{
            github.job_workflow_sha || hashFiles('repomatic/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-typos-
      - name: Fix typos
        run: uv --no-progress run --frozen -- repomatic run typos
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template fix-typos
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # We need custom PAT with workflows permissions to fix typos in .github/workflows/*.yaml` files.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "📚 documentation"
          branch: fix-typos
          delete-branch: true

  fix-vulnerable-deps:
    name: 🛡️ Fix vulnerable deps
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).is_python_project
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - id: fix
        name: Fix vulnerable dependencies
        # GH_TOKEN lets repomatic query the GitHub Advisory Database via the
        # repo's Dependabot alerts. PAT is preferred when present so the
        # token has the Dependabot alerts permission; falls back to the
        # workflow token (which carries the same permission scope under
        # security-events: read).
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic audit --fix
          --repo "${{ github.repository }}"
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - id: pr-metadata
        env:
          REPOMATIC_DIFF_TABLE: ${{ steps.fix.outputs.diff_table }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template fix-vulnerable-deps
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🔗 dependencies"
          branch: fix-vulnerable-deps
          delete-branch: true

  sync-repomatic:
    name: 🔄 Sync repomatic
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Sync repomatic-managed files
        run: >
          uv --no-progress run --frozen -- repomatic init
          --delete-unmodified --delete-excluded
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-repomatic
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # We need custom PAT with workflows permissions to update .github/workflows/*.yaml files.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: sync-repomatic
          delete-branch: true

  format-images:
    name: 🖼️ Format images
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).image_files
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      # oxipng is no longer installed here: `format-images` pulls it from the
      # `repomatic run` registry, pinned and checksum-verified, where this step
      # used to `dpkg --install` an unverified .deb fetched by hand. jpegoptim
      # cannot follow, as upstream ships source tarballs rather than binaries.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-${{
            github.job_workflow_sha || hashFiles('repomatic/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-
      - name: Install jpegoptim
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jpegoptim
      - name: Format images
        id: format
        run: >
          uv --no-progress run --frozen -- repomatic format-images
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - id: pr-metadata
        env:
          GHA_PR_BODY_PREFIX: ${{ steps.format.outputs.markdown }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template format-images
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "📚 documentation"
          branch: format-images
          delete-branch: true

  # --- Syncers: regenerate files from external sources or project state. ---

  sync-gitignore:
    name: 🙈 Sync .gitignore
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).gitignore_exists
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Sync .gitignore
        run: uv --no-progress run --frozen -- repomatic sync-gitignore
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-gitignore
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: sync-gitignore
          delete-branch: true

  sync-bumpversion:
    name: 🔄 Sync bumpversion config
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).is_python_project
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Sync bumpversion config
        run: uv --no-progress run --frozen -- repomatic sync-bumpversion
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-bumpversion
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "🤖 ci"
          branch: sync-bumpversion
          delete-branch: true

  sync-mailmap:
    name: 📬 Sync .mailmap
    needs:
      - metadata
    if: fromJSON(needs.metadata.outputs.metadata).mailmap_exists
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history to extract all contributors.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Sync .mailmap
        run: uv --no-progress run --frozen -- repomatic sync-mailmap --skip-if-missing
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-mailmap
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "📚 documentation"
          branch: sync-mailmap
          delete-branch: true

  sync-deps:
    name: 🔗 Sync dependencies
    # Consolidated dependency updater. One runner shares the checkout, the uv
    # install, and repomatic's HTTP cache across all four bumpers, instead of a
    # separate job per bumper each paying that setup. Each bumper still opens its
    # own PR: the working tree is reset before each one so their diffs never
    # bleed, keeping review and revert independent. Mirrors the local
    # `repomatic sync-deps` command; the steps stay per-bumper here only because
    # each needs its own branch and PR body.
    needs:
      - metadata
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Full history, not the default shallow clone: this job runs
      # create-pull-request several times in one checkout, and a shallow clone
      # trips "shallow file has changed since we read it" on the second call,
      # corrupting the --force-with-lease push (the four standalone jobs never
      # hit this, each having its own checkout with a single create-pull-request).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      # Persist repomatic's HTTP cache (PyPI/GitHub/npm release metadata) across
      # runs; this mainly speeds up bursts of pushes. TTL-gating bounds staleness
      # at a day rather than preventing it, so a restored cache can miss a
      # release published since it was written. Here that only defers a version
      # bump by a run. A job that writes availability claims must re-confirm
      # live instead: see the retraction gate in repomatic/changelog.py.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic
          key: repomatic-http-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            repomatic-http-${{ runner.os }}-

      # --- sync-dep-sources: adopt released dependencies (Python projects). ---
      - if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Reset tree before sync-dep-sources
        run: git checkout -- .
      - id: sync-dep-sources
        if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Sync dependency sources
        run: >
          uv --no-progress run --frozen -- repomatic sync-dep-sources
          --no-table --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - id: sync-dep-sources-meta
        if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        env:
          REPOMATIC_DIFF_TABLE: ${{ steps.sync-dep-sources.outputs.diff_table }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-dep-sources
          --output "$GITHUB_OUTPUT"
      - if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.sync-dep-sources-meta.outputs.commit_message }}
          title: ${{ steps.sync-dep-sources-meta.outputs.title }}
          body: ${{ steps.sync-dep-sources-meta.outputs.body }}
          labels: "🔗 dependencies"
          branch: sync-dep-sources
          delete-branch: true

      # --- sync-uv-lock: re-lock dependencies (Python projects). ---
      - if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Reset tree before sync-uv-lock
        run: git checkout -- .
      - id: sync-uv-lock
        if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        name: Sync uv.lock
        run: >
          uv --no-progress run --frozen -- repomatic sync-uv-lock
          --no-table --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - id: sync-uv-lock-meta
        if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        env:
          REPOMATIC_DIFF_TABLE: ${{ steps.sync-uv-lock.outputs.diff_table }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-uv-lock
          --output "$GITHUB_OUTPUT"
      - if: fromJSON(needs.metadata.outputs.metadata).is_python_project
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.sync-uv-lock-meta.outputs.commit_message }}
          title: ${{ steps.sync-uv-lock-meta.outputs.title }}
          body: ${{ steps.sync-uv-lock-meta.outputs.body }}
          labels: "🔗 dependencies"
          branch: sync-uv-lock
          delete-branch: true

      # --- sync-action-pins: bump SHA-pinned actions (repos with workflows). ---
      - if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Reset tree before sync-action-pins
        run: git checkout -- .
      - id: sync-action-pins
        if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Sync action pins
        # GH_TOKEN raises the GitHub releases API rate limit when resolving
        # the latest tag and its commit SHA for each pinned action.
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic sync-action-pins --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - id: sync-action-pins-meta
        if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        env:
          REPOMATIC_DIFF_TABLE: ${{ steps.sync-action-pins.outputs.diff_table }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-action-pins
          --output "$GITHUB_OUTPUT"
      - if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.sync-action-pins-meta.outputs.commit_message }}
          title: ${{ steps.sync-action-pins-meta.outputs.title }}
          body: ${{ steps.sync-action-pins-meta.outputs.body }}
          labels: "🔗 dependencies"
          branch: sync-action-pins
          delete-branch: true

      # --- sync-workflow-pins: bump npm/PyPI literals (repos with workflows). ---
      - if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Reset tree before sync-workflow-pins
        run: git checkout -- .
      - id: sync-workflow-pins
        if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        name: Sync workflow pins
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uv --no-progress run --frozen -- repomatic sync-workflow-pins --release-notes
          --output "$GITHUB_OUTPUT" --output-format github-actions
      - id: sync-workflow-pins-meta
        if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        env:
          REPOMATIC_DIFF_TABLE: ${{ steps.sync-workflow-pins.outputs.diff_table }}
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template sync-workflow-pins
          --output "$GITHUB_OUTPUT"
      - if: fromJSON(needs.metadata.outputs.metadata).workflow_files
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.sync-workflow-pins-meta.outputs.commit_message }}
          title: ${{ steps.sync-workflow-pins-meta.outputs.title }}
          body: ${{ steps.sync-workflow-pins-meta.outputs.body }}
          labels: "🔗 dependencies"
          branch: sync-workflow-pins
          delete-branch: true

      # sync-tool-versions is deliberately absent: it rewrites repomatic's own
      # tool registry, so it lives in the upstream-only self-maintenance.yaml.

  update-dep-graph:
    name: 🕸️ Update dependency graph
    needs:
      - metadata
    # Only update dependency graph on release to avoid noise from transitive dependency changes.
    if: >
      fromJSON(needs.metadata.outputs.metadata).is_python_project
      && fromJSON(needs.metadata.outputs.metadata).release_commits_matrix
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Generate graph
        # Package name and output path are auto-detected from pyproject.toml.
        run: uv --no-progress run --frozen -- repomatic update-dep-graph
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template update-dep-graph
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "📚 documentation"
          branch: update-dep-graph
          delete-branch: true

  update-docs:
    name: 📚 Update docs
    needs:
      - metadata
    if: >
      fromJSON(needs.metadata.outputs.metadata).is_python_project
      && fromJSON(needs.metadata.outputs.metadata).active_autodoc
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
      - name: Update docs
        # Runs sphinx-apidoc, converts RST stubs to MyST if applicable, runs docs/docs_update.py, then
        # refreshes self-updating directive blocks with click-extra refresh-directives.
        run: uv --no-progress run --frozen -- repomatic update-docs
      - name: Format regenerated pyproject.toml
        # The project's docs.update-script may regenerate pyproject.toml sections (label rules,
        # keywords). Reformat them only when update-docs actually changed pyproject.toml, so this
        # job's PR stays a pyproject-fmt fixpoint without ping-ponging with format-pyproject. Guard
        # against the empty case: with no doc change, an unconditional reformat would open an
        # update-docs PR carrying only pre-existing formatting drift, a byte-for-byte duplicate of
        # the format-pyproject PR (which owns that drift). Same exit-code handling as that job:
        # xargs turns pyproject-fmt's reformat exit 1 into 123.
        env:
          PYPROJECT_FILES: ${{ fromJSON(needs.metadata.outputs.metadata).pyproject_files }}
        run: |
          if echo "${PYPROJECT_FILES}" | xargs git diff --quiet --; then
            echo "update-docs left pyproject.toml unchanged; leaving any formatting drift to format-pyproject."
            exit 0
          fi
          rc=0
          echo "${PYPROJECT_FILES}" \
            | xargs uv --no-progress run --frozen -- repomatic \
              run pyproject-fmt -- || rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 123 ] || exit "$rc"
      - id: pr-metadata
        run: >
          uv --no-progress run --frozen -- repomatic
          pr-body --output-format github-actions
          --template update-docs
          --output "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: ${{ steps.pr-metadata.outputs.commit_message }}
          title: ${{ steps.pr-metadata.outputs.title }}
          body: ${{ steps.pr-metadata.outputs.body }}
          labels: "📚 documentation"
          branch: update-docs
          delete-branch: true

