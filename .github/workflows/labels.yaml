---
name: 🏷️ Labels
"on":
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  # Trigger labellers and sponsor tagger on PR open only to avoid excessive runs.
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs — see
      # https://github.com/actions/runner/issues/1591. The real skip is the
      # `github.head_ref` check in the `metadata` job's `if:` below. Kept
      # here as documentation of intent.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    types: [opened]
  # Trigger labellers and sponsor tagger on issue open only to avoid excessive runs.
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal that tests/test_workflows.py holds
# equal to `[tool.repomatic] minimum-release-age`. Deliberate bypasses are
# per-package CLI flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  sync-labels:
    name: 🔄 Sync labels
    # Restrict job to the main branch pushes and workflow calls only, as this is a project-management task.
    if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: repomatic-${{ runner.os }}-${{ runner.arch }}-labelmaker-${{ hashFiles('repomatic/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-labelmaker-
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.5.0' sync-labels

  metadata:
    name: 🧬 Project metadata
    # Skipping this job propagates to every `needs: metadata` job below.
    # Both the PR branch list and the post-merge commit-message prefixes
    # must stay in sync with repomatic.binary.VERSION_BUMP_BRANCHES and
    # VERSION_BUMP_COMMIT_PREFIXES: tests/test_workflows.py enforces both.
    if: >
      !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
      && !startsWith(github.event.head_commit.message || '', 'Bump major version to ')
      && !startsWith(github.event.head_commit.message || '', 'Bump minor version to ')
      && !startsWith(github.event.head_commit.message || '', '[changelog] Post-release bump ')
    runs-on: ubuntu-slim
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.5.0' metadata
          --format github-json --output "$GITHUB_OUTPUT"
          is_bot

  file-labeller:
    name: 📁 File-based PR labeller
    needs:
      - metadata
    if: >
      github.event_name == 'pull_request'
      && (! fromJSON(needs.metadata.outputs.metadata).is_bot)
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Dump default rules
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.5.0' init labels
      - name: Apply rules
        # repomatic.init_project._serialize_file_rules emits v5+ schema
        # (`any:`/`all:` wrappers, `changed-files` matcher dicts, `head-branch`,
        # `base-branch`). Do not downgrade below v5.0.0.
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: ".github/labeller-file-based.yaml"

  content-labeller:
    name: 📝 Content-based labeller
    needs:
      - metadata
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'issues')
      && (! fromJSON(needs.metadata.outputs.metadata).is_bot)
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Dump default rules
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.5.0' init labels
      - name: Apply rules
        uses: github/issue-labeler@c1b0f9f52a63158c4adc09425e858e87b32e9685 # v3.4
        with:
          configuration-path: ".github/labeller-content-based.yaml"
          enable-versioned-regex: 0
          include-title: 1

  sponsor-label:
    name: 💝 Tag sponsors
    needs:
      - metadata
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'issues')
      && (! fromJSON(needs.metadata.outputs.metadata).is_bot)
    runs-on: ubuntu-slim
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
      - name: Add sponsor label
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.5.0' sponsor-label
