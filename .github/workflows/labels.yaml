---
name: 🏷️ Labels
"on":
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  # Trigger labellers and sponsor tagger on PR open only to avoid excessive runs.
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs: see
      # https://github.com/actions/runner/issues/1591. Kept here as
      # documentation of intent, since the skip only becomes real through a
      # `github.head_ref` check on a job's `if:`, propagated through `needs:`.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    types: [opened]
  # Trigger labellers and sponsor tagger on issue open only to avoid excessive runs.
  issues:
    types: [opened]

permissions: {}

# A newer run supersedes an older one: on a release push, the only job left
# is `sync-labels`, which every later push runs again.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See https://repomatic.net/workflows#install-time-cooldown for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  metadata:
    name: 🧬 Project metadata
    # Runs only for the event of the labelling job below, the one reading it.
    # Skipping this job skips that job too. The PR branch list must stay in
    # sync with repomatic.release.protocol.VERSION_BUMP_BRANCHES, enforced by
    # repomatic's own test suite.
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'issues')
      && !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.0"
      - name: Run repomatic show-metadata
        id: metadata
        run: >
          uv --no-progress run --frozen -- repomatic show-metadata
          --output-format github-json --output "$GITHUB_OUTPUT"
          is_bot

  sync-labels:
    name: 🔄 Sync labels
    # Restrict job to the main branch pushes and manual runs only, as this is a
    # project-management task. A run called from another workflow carries the
    # event of the caller, so a downstream caller reaches this job the same way.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.0"
      # No `needs: metadata` here, so the job reads the pin its cache is keyed on
      # itself: `tool_versions` names the version the registry pins for each tool.
      - name: Read the tool pins
        id: pins
        run: >
          uv --no-progress run --frozen -- repomatic show-metadata
          --output-format github --output "$GITHUB_OUTPUT" tool_versions
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-labelmaker-${{
            fromJSON(steps.pins.outputs.tool_versions).labelmaker }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-labelmaker-
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv --no-progress run --frozen -- repomatic sync-labels

  apply-labels:
    name: 🏷️ Apply labels
    needs:
      - metadata
    # Both labellers in one job, as they share an `if:`: the metadata job above
    # already restricts this one to opened issues and pull requests.
    if: ${{ ! fromJSON(needs.metadata.outputs.metadata).is_bot }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.0"
      - name: Apply labels
        # Content rules run on issues and pull requests alike; file rules need
        # a diff, so the command adds them on pull requests by itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv --no-progress run --frozen -- repomatic apply-labels --live
      - name: Add sponsor label
        # Runs even when the labeller failed: the two read different things.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv --no-progress run --frozen -- repomatic sponsor-label
