---
name: 🏷️ Labels
"on":
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  # Trigger labellers and sponsor tagger on PR open only to avoid excessive runs.
  pull_request:
    branches-ignore:
      # This filter matches the PR's *base* branch (always `main`), not its
      # head, so it does not actually exclude these PRs: see
      # https://github.com/actions/runner/issues/1591. Kept here as
      # documentation of intent, since the skip only becomes real through a
      # `github.head_ref` check on a job's `if:`, propagated through `needs:`.
      - major-version-increment
      - minor-version-increment
      - prepare-release
    types: [opened]
  # Trigger labellers and sponsor tagger on issue open only to avoid excessive runs.
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  metadata:
    name: 🧬 Project metadata
    # Skipping this job propagates to every `needs: metadata` job below.
    # The PR branch list must stay in sync with
    # repomatic.git_ops.VERSION_BUMP_BRANCHES; the single commit-message clause
    # relies on repomatic.git_ops.CHANGELOG_COMMIT_PREFIX marking every
    # machine-authored version-machinery commit. Both enforced by repomatic's
    # own test suite.
    if: >
      !contains(fromJSON('["major-version-increment","minor-version-increment","prepare-release"]'),
      github.head_ref)
      && !startsWith(github.event.head_commit.message || '', '[changelog] ')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      metadata: ${{ steps.metadata.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Run repomatic metadata
        id: metadata
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' metadata
          --format github-json --output "$GITHUB_OUTPUT"
          is_bot

  sync-labels:
    name: 🔄 Sync labels
    # Restrict job to the main branch pushes and workflow calls only, as this is a project-management task.
    if: github.event_name == 'push' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-labelmaker-${{
            github.job_workflow_sha || hashFiles('repomatic/tooling/tool_registry.py') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-labelmaker-
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' sync-labels

  apply-labels:
    name: 🏷️ Apply labels
    needs:
      - metadata
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'issues')
      && (! fromJSON(needs.metadata.outputs.metadata).is_bot)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Apply labels
        # Content rules run on issues and pull requests alike; file rules need
        # a diff, so the command adds them on pull requests by itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' apply-labels --live

  sponsor-label:
    name: 💝 Tag sponsors
    needs:
      - metadata
    if: >
      (github.event_name == 'pull_request' || github.event_name == 'issues')
      && (! fromJSON(needs.metadata.outputs.metadata).is_bot)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
      - name: Add sponsor label
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.14.0' sponsor-label
