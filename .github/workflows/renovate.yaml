---
name: 🆕 Renovate
"on":
  workflow_call:
    secrets:
      REPOMATIC_PAT:
        required: false
  workflow_dispatch:
  schedule:
    # Run weekly.
    - cron: "3 17 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/renovate.yaml"
      - "renovate.json5"
      - "repomatic/data/renovate.json5"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[changelog] Release') }}

jobs:

  migrate-to-renovate:
    name: 🚚 Migrate to Renovate
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Check Renovate prerequisites
        id: checks
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: uvx --no-progress --from . repomatic check-renovate --format=github --output "$GITHUB_OUTPUT"

      # No need to export renovate.json5 here — the renovate job below
      # materializes the bundled default at runtime when absent.
      - name: Remove Dependabot config if present
        if: steps.checks.outputs.dependabot_config_path != ''
        env:
          DEPENDABOT_PATH: ${{ steps.checks.outputs.dependabot_config_path }}
        run: rm -f "${DEPENDABOT_PATH}"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          assignees: ${{ github.actor }}
          commit-message: Migrate from Dependabot to Renovate
          title: Migrate from Dependabot to Renovate
          body: ${{ steps.checks.outputs.pr_body }}
          labels: "🔗 dependencies"
          branch: migrate-to-renovate
          delete-branch: true

  renovate:
    name: 🆕 Renovate
    # Cannot use "ubuntu-slim" here because renovatebot/github-action relies on Docker.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # The Dockerized Renovate engine clones the repo into its own /tmp
      # directory and reads config from there, so a renovate.json5 in the
      # Actions workspace (committed or materialized) is invisible to it.
      # Materialize the effective config (the committed copy if present, else
      # the bundled template) and stage it into /tmp, the action's default
      # docker-volume mount, so the engine loads it below as global config.
      # The workspace file is ephemeral: discarded after the run.
      - name: Stage Renovate config for the engine
        run: |
          test -f renovate.json5 || uvx --no-progress --from . repomatic init renovate
          cp renovate.json5 /tmp/renovate-config.json5

      # Validate remaining prerequisites (Dependabot absent, security
      # updates disabled, commit statuses permission).
      - name: Validate Renovate prerequisites
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: uvx --no-progress --from . repomatic check-renovate

      - uses: renovatebot/github-action@8217b3fc286df088d7c27f3255fe8414463bc0fd # v46.1.15
        with:
          # Custom PAT required for Renovate to function fully.
          # See readme.md for full list of required permissions.
          token: ${{ secrets.REPOMATIC_PAT || github.token }}
          # The staged config (see previous step) is read through this default
          # mount; set it explicitly to document the dependency on it.
          docker-volumes: "/tmp:/tmp"
        env:
          # Self-hosted configuration.
          RENOVATE_PLATFORM: "github"
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Skip onboarding PR; the config is supplied below as global config.
          RENOVATE_ONBOARDING: "false"
          # Drive Renovate from the staged config (global config) and ignore any
          # in-repo copy: downstream repos needn't commit renovate.json5, and a
          # repo that does (like this one) is not double-applied. The engine
          # cannot read the Actions workspace, hence the mounted /tmp path.
          RENOVATE_CONFIG_FILE: "/tmp/renovate-config.json5"
          RENOVATE_REQUIRE_CONFIG: "ignored"
          # Fetch all PRs, not just those created by the current bot.
          # Useful for migrating between bot accounts or taking over existing PRs.
          RENOVATE_IGNORE_PR_AUTHOR: "true"
          # Allow postUpgradeTasks commands to run inside the Renovate container.
          # Two command patterns are allowed:
          # 1. Workflow checksum updates: downloads a pinned uv binary from
          #    GitHub Releases, verifies its SHA-256, extracts uvx, then runs
          #    repomatic update-checksums on the upgraded workflow file.
          # 2. uv hash auto-update: when Renovate bumps the uv version in any
          #    renovate.json5 (root or bundled template), downloads the new
          #    tarball and uses sed to replace the old SHA-256 hash inline
          #    (no binary execution). The [^ ]* prefix matches paths like
          #    repomatic/data/renovate.json5.
          RENOVATE_ALLOWED_COMMANDS: >-
            ["^bash -c 'curl -fsSL
            https://github\\.com/astral-sh/uv/releases/download/[0-9.]+/uv-x86_64-unknown-linux-gnu\\.tar\\.gz
            --output /tmp/uv\\.tar\\.gz
            && echo [a-f0-9]{64}  /tmp/uv\\.tar\\.gz \\| sha256sum --check
            && tar xzf /tmp/uv\\.tar\\.gz --strip-components=1 -C /tmp
            && /tmp/uvx --no-progress
            (--from \\. |)repomatic(==\\d[\\d.]*)? update-checksums",
            "^bash -c 'curl -fsSL
            https://github\\.com/astral-sh/uv/releases/download/[0-9.]+/uv-x86_64-unknown-linux-gnu\\.tar\\.gz
            --output /tmp/uv\\.tar\\.gz
            && sed -i .+ [^ ]*renovate\\.json5'$"]
          # Use containerbase to install tools for Renovate's own manager processing.
          RENOVATE_BINARY_SOURCE: "install"
          RENOVATE_LOG_LEVEL: "debug"
          # Prevent python.org API rate limits (HTTP 429) from aborting the
          # entire Renovate run. Without this, a single throttled request to
          # the python-version datasource causes Renovate to skip all PR
          # creation and dashboard updates for the repository.
          RENOVATE_HOST_RULES: '[{"hostType": "python-version", "abortOnError": false}]'
