# Unsubscribes from notification threads of closed issues and pull requests.
# See repomatic/github/unsubscribe.py for rationale.
---
name: "\U0001F515 Unsubscribe closed threads"
"on":
  workflow_call:
    # Passthrough of the workflow_dispatch inputs below, so generated thin callers can forward
    # a manual dispatch to this workflow. Types and defaults must stay in sync with the
    # workflow_dispatch declarations (enforced by tests/test_workflow_sync.py).
    inputs:
      months:
        default: "3"
        type: string
      max-unsubscribes:
        default: "200"
        type: string
      dry-run:
        default: true
        type: boolean
    secrets:
      REPOMATIC_NOTIFICATIONS_PAT:
        required: false
  workflow_dispatch:
    inputs:
      months:
        description: "Unsubscribe from closed issues/PRs inactive for more than this many months"
        default: "3"
        type: string
      max-unsubscribes:
        description: "Max threads to unsubscribe from per run (the rest defer to a later run)"
        default: "200"
        type: string
      dry-run:
        description: "Dry-run: only list candidates, do not perform unsubscribing"
        default: true
        type: boolean
  schedule:
    # Run weekly, every Monday at 9:13 UTC.
    - cron: "13 9 * * 1"

permissions: {}

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See https://repomatic.net/workflows#install-time-cooldown for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  unsubscribe-threads:
    # Skip schedule/dispatch triggers in the upstream repo. Downstream repos
    # call this via workflow_call, where github.repository is the caller.
    if: github.repository != 'kdeldycke/repomatic'
    name: "\U0001F515 Unsubscribe"
    runs-on: ubuntu-26.04
    # Wider than the default: this job provisions a toolchain, so its runtime tracks how much it has to install.
    timeout-minutes: 30
    # No checkout: the job never runs in this repository, and downstream the CLI
    # call below is frozen to a PyPI pin at release time.
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # The workdir is empty by design, so there are never dependency files
          # for the default cache-dependency-glob to key on: the cache would never
          # invalidate.
          enable-cache: false
          ignore-empty-workdir: true
          version: "0.13.4"
      - name: Unsubscribe from closed threads
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_NOTIFICATIONS_PAT }}
          MONTHS: ${{ inputs.months }}
          MAX_UNSUBSCRIBES: ${{ inputs.max-unsubscribes }}
        # Skip silently when REPOMATIC_NOTIFICATIONS_PAT is not configured.
        # GitHub Actions does not allow secrets.* in job-level if: conditions,
        # so the check is done here at step level via the env var.
        if: env.GH_TOKEN != ''
        # A scheduled run leaves `inputs` empty, so each option is passed only
        # when its input carries a value: the CLI default applies otherwise.
        # stdout (the markdown report) is redirected to the step summary; --verbosity INFO
        # streams per-thread progress to the live job log via stderr.
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==8.0.1' --verbosity INFO
          unsubscribe-threads
          ${MONTHS:+--months "$MONTHS"}
          ${MAX_UNSUBSCRIBES:+--max-unsubscribes "$MAX_UNSUBSCRIBES"}
          ${{ github.event_name == 'workflow_dispatch'
          && inputs.dry-run != false
          && '--dry-run' || '--live' }}
          >> "$GITHUB_STEP_SUMMARY"
