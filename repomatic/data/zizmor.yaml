rules:
  # The jobs that push commits authenticate `git push` with the credentials
  # `actions/checkout` persists, so turning persistence off breaks them. No job
  # uploads an artifact holding `.git/`, the leak this audit guards against.
  artipacked:
    disable: true

  # workflow_run in changelog.yaml is safe by design: it provides timing (ensuring tags exist after
  # the release workflow), not code execution from untrusted sources. See
  # https://repomatic.net/workflows#workflow-run-checkout-pitfall
  dangerous-triggers:
    ignore:
      - changelog.yaml

  # A generated thin caller with no downstream jobs carries no `permissions:` block by design: its
  # job inherits the default of the repository, which the jobs of the reusable workflow then
  # narrow. This audit reads that default as overly broad, so it would flag each such caller.
  excessive-permissions:
    disable: true

  # Secrets are intentionally used without dedicated GitHub environments. Adding environments
  # would require per-repo settings configuration across all downstream repositories.
  secrets-outside-env:
    disable: true

  # The binary matrix of _release-engine.yaml names the manylinux container of each Linux target
  # through `container: ${{ matrix.container }}`, a value built from nuitka.targets. zizmor cannot
  # resolve an expression, so it reads a pinned image as unpinned.
  unpinned-images:
    ignore:
      - _release-engine.yaml
