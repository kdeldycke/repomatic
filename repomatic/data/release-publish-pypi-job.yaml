---
# Caller-side `publish-pypi` job appended to every downstream `release.yaml`
# thin-caller. The composite action it invokes inherits the calling job's
# OIDC context, so the OIDC `job_workflow_ref` claim resolves to the
# downstream's own workflow file: that path is what each downstream registers
# with PyPI as a Trusted Publisher. See pypi/warehouse#11096 for context.
#
# The action ref below is a real, working default (upstream repo at the
# default branch). `repomatic.github.workflow_sync._render_publish_pypi_job`
# rewrites it to the requested {repo, version, sha} via the same `.replace()`
# convention `repomatic.release_prep` uses on workflow files at freeze time.
# No bespoke templating syntax is involved: the fragment is plain YAML with
# real values, copy-pasteable into any workflow.
#
# This file is itself walked by `repomatic.release_prep.freeze_workflow_urls`
# (and its unfreeze counterpart), so wheels built from a freeze commit ship
# with the action ref pinned to the release tag baked in: downstream
# `repomatic init` runs from a published wheel default to that pinned ref
# without any extra rewriting.
publish-pypi:
  name: 🐍 Publish to PyPI (${{ matrix.short_sha }})
  needs: release
  # Gate decoupled from the run's overall result: always() lets this job run
  # even when an unrelated job (like binary tests) failed the run, and
  # package_built confirms the wheel actually built. A wheel that built cleanly
  # should still publish to PyPI even when a binary test fails. The
  # package_built output is defined in repomatic's reusable release.yaml.
  if: >-
    always()
    && needs.release.outputs.package_built == 'true'
    && needs.release.outputs.release_commits_matrix
  strategy:
    # GitHub evaluates `strategy.matrix` during job setup even when `if:` will
    # skip the job. On a non-release push `release_commits_matrix` is the empty
    # string, so a bare `fromJSON('')` aborts the whole run with "Unexpected
    # value ''". Falling back to an empty `{"include":[]}` matrix expands the
    # job to zero runs, so it skips cleanly instead of failing the workflow.
    matrix: ${{ fromJSON(needs.release.outputs.release_commits_matrix || '{"include":[]}') }}
  runs-on: ubuntu-latest
  permissions:
    id-token: write
    # Lets the admonition step below edit the published release notes.
    contents: write
  steps:
    - uses: kdeldycke/repomatic/.github/actions/publish-pypi@main
      with:
        artifact-name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}
    # Backfill the "available on PyPI" admonition onto the release notes after a
    # successful OIDC upload. The reusable workflow publishes the GitHub release
    # without it (it no longer knows the PyPI outcome). continue-on-error keeps a
    # notes-edit hiccup from failing an upload that already succeeded.
    - name: Add PyPI admonition to release notes
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        CURRENT_VERSION: ${{ matrix.current_version }}
        RELEASE_NOTES: ${{ needs.release.outputs.release_notes_with_admonition }}
      run: >
        gh release edit "v${CURRENT_VERSION}"
        --notes-file -
        --repo "${{ github.repository }}" <<< "${RELEASE_NOTES}"
