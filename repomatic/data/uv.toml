# uv configuration for Python projects.
#
# Native format - can be used standalone as uv.toml.
# When merged into pyproject.toml via `repomatic init uv`, the [tool.uv]
# prefix is added automatically. Only the two policy keys below are owned by
# repomatic and kept in sync; every other [tool.uv] key a project defines
# (sources, exclude-newer-package, build-backend, dependency-groups) is left
# untouched. See claude.md for the rationale behind both pins.

# Pin uv to a single minor series so every contributor and CI runner resolves
# uv.lock with the same resolver (astral-sh/setup-uv reads this automatically).
required-version = ">=0.12,<0.13"
# Cooldown buffer before adopting newly released packages.
exclude-newer = "1 week"
