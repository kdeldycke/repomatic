# Ruff linter/formatter configuration for Python projects.
#
# Native format - can be used standalone as ruff.toml or .ruff.toml.
# When merged into pyproject.toml via `repomatic init ruff`,
# the [tool.ruff] prefix is added automatically.

preview = true
fix = true
# Unsafe fixes rewrite semantics, not just style, and the autofix workflow
# commits them unreviewed. Archetype: LOG001's unsafe fix turned a deliberate
# direct `logging.Logger(name, level)` instantiation into `getLogger(name,
# level)`, an invalid call that would also flip the logger into the shared
# registry. See: https://docs.astral.sh/ruff/linter/#fix-safety
unsafe-fixes = false
show-fixes = true
# Report `ISC004` rather than `implicit-string-concatenation-in-collection-literal`.
# Preview mode otherwise prints human-readable rule names, but every knob below
# (and every CI annotation a contributor acts on) speaks in codes, so the code is
# the token you paste into `lint.ignore` to silence what you just read.
# https://docs.astral.sh/ruff/settings/#output-prefer-rule-codes
output-prefer-rule-codes = true
# Enable reformatting of code snippets in docstrings.
# https://docs.astral.sh/ruff/formatter/#docstring-formatting
format.docstring-code-format = true
# D205: 1 blank line required between summary line and description.
#   The first line of a docstring is its summary, read alone by Sphinx and by
#   Click's `--help`, so a summary spilling onto a second line is cut mid-sentence.
#   See: https://docs.astral.sh/ruff/rules/missing-blank-line-after-summary/
# D209: Multi-line docstring closing quotes should be on a separate line.
#   See: https://docs.astral.sh/ruff/rules/new-line-after-last-paragraph/
# E501: Line too long.
#   The formatter wraps code and autopep8 wraps comments, but neither touches a
#   docstring or a string literal, which is where overlong lines survive.
#   See: https://docs.astral.sh/ruff/rules/line-too-long/
# PLC0415: `import` should be at the top-level of a file.
#   A function-local import hides a dependency and escapes isort.
#   See: https://docs.astral.sh/ruff/rules/import-outside-top-level/
# PLW1514: `open` and friends called without an explicit `encoding` argument.
#   Windows defaults text I/O to cp1252, so a bare `open()`, `read_text()` or
#   `write_text()` breaks on non-ASCII content, and only on Windows runners.
#   Preview rule; its type inference misses unannotated `Path` locals, so
#   PEP 597's `PYTHONWARNDEFAULTENCODING=1` remains the complete runtime net.
#   See: https://docs.astral.sh/ruff/rules/unspecified-encoding/
# RUF100, RUF102, RUF103, RUF104: a `# noqa` that no rule needs, that names a
#   rule ruff does not know, or that is malformed, is a suppression nobody
#   reviews. Correct under the full rule set only: selected alone, RUF100 reads
#   every `# noqa` as unused.
#   See: https://docs.astral.sh/ruff/rules/unused-noqa/
# TC: an import used only in annotations belongs in the `if TYPE_CHECKING:` block.
#   Ruff reads the block in its `TYPE_CHECKING = False` form, which spares the
#   `typing` import at runtime.
#   See: https://docs.astral.sh/ruff/rules/#flake8-type-checking-tc
lint.extend-select = [ "D205", "D209", "E501", "PLC0415", "PLW1514", "RUF100", "RUF102", "RUF103", "RUF104", "TC" ]
# D401 and D403 stay out of the selection above, since the rewrite each asks
#   for is wrong here: D401 rejects the noun-phrase docstring a property or a
#   getter opens with (`The options that pick a template`), and D403
#   capitalizes a tool name opening one (`uv`, `macOS`, `ruff`).
# D301: Use `r"""` if any backslashes in a docstring.
#   A Click command's docstring is its `--help` text, and `\b` marks a paragraph
#   Click must not rewrap. The raw prefix this rule asks for turns that backspace
#   character into two printable ones, so the marker stops working and shows up
#   in the help output.
#   See: https://docs.astral.sh/ruff/rules/escape-sequence-in-docstring/
# D400: First line should end with a period.
#   Allows docstrings to end up with any punctuation, not just a period.
#   See: https://github.com/astral-sh/ruff/issues/1858#issuecomment-1382640623
# ERA001: Found commented-out code.
#   Do not remove commented code, as it might be used for documentation.
#   See: https://docs.astral.sh/ruff/rules/#eradicate-era
# LOG015: Root logger calls (logging.info(), etc.).
#   The CLI configures the root logger via Click, so root logger calls are intentional.
#   See: https://docs.astral.sh/ruff/rules/root-logger-call/
lint.ignore = [ "D301", "D400", "ERA001", "LOG015" ]
# Allow rules to add `from __future__ import annotations` in cases where
# this would simplify a fix or enable a new diagnostic.
# https://docs.astral.sh/ruff/settings/#lint_future-annotations
lint.future-annotations = true
lint.isort.combine-as-imports = true