---
# Default content-matching rules for `repomatic apply-labels`, evaluated
# against an issue or pull request's title and body.
#
# A label's patterns are OR'd: any one of them matching applies the label. Each
# is a Python regex, in the JavaScript-flavoured `/body/flags` spelling the
# `github/issue-labeler` action defined and this file kept when the matcher
# moved in-tree. Only `i`, `m` and `s` change anything.
#
# Two conventions every pattern below follows:
#
# - `/…/i`, because users capitalize freely: `Bug`, `README`, `CI`.
# - `\b` on every edge closing on a word character, so `fix` does not fire on
#   `prefix`.
#
# Single-quoted so YAML keeps the backslashes literal.
#
# Tune for precision, not recall. A missing label costs one manual click; a
# wrong one is noise on every issue that trips it. Never key a rule off a token
# the project prints in its own output, or a user pasting a trace sets every
# label at once.
"🐛 bug":
  - '/\bbug\b/i'
  - '/\berror\b/i'
  - '/\bexception\b/i'
  - '/\bfix\b/i'
  - '/\btraceback\b/i'

"🆙 changelog":
  - '/\bchange-log\b/i'
  - '/\bchangelog\b/i'

"🤖 ci":
  - '/\.github\b/i'
  - '/\bactions\b/i'
  - '/\bci-cd\b/i'
  - '/\bcicd\b/i'
  - '/\bcoverage\b/i'
  - '/\bgitignore\b/i'
  - '/\bworkflow\b/i'

"🔗 dependencies":
  - '/\.lock\b/i'
  - '/\bpyproject\.toml\b/i'

"📚 documentation":
  - '/\bdocstring\b/i'
  - '/\blicense\b/i'
  - '/\bmailmap\b/i'
  - '/\bmarkdown\b/i'
  - '/\breadme\b/i'
  - '/\bsphinx\b/i'
  - '/\btypo\b/i'

"💖 sponsor":
  - '/\bfunding\b/i'
  - '/\bsponsor\b/i'
