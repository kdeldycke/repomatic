# The title octicon of every hand-written docs page, across the repositories
# following the conventions of the `sphinx-docs` agent: one key per octicon, in
# alphabetical order, listing the pages that take it. A glob covers each page
# its pattern matches.
#
# The registry table of the `sphinx-docs` agent renders from this file, and the
# `title-octicons` check of `repomatic lint-repo` reads it.

[octicons]
apps = ["commands.md", "groups.md"]
beaker = ["test-suite.md"]
book = ["man.md", "sphinx.md"]
broadcast = ["telemetry.md"]
checklist = ["operation-contracts.md"]
chevron-right = ["carapace.md", "shells.md"]
circle-slash = ["unsupported.md"]
cloud = ["cloudflare.md"]
code = ["machine-readable.md"]
code-of-conduct = ["code-of-conduct.md"]
code-square = ["python-directives.md"]
codespaces = ["platforms.md"]
command-palette = ["cli-*.md", "cli.md"]
container = ["ci.md"]
copilot-warning = ["falsehoods.md"]
cpu = ["architectures.md", "concurrency.md"]
cross-reference = ["upstream.md"]
database = ["context.md"]
dependabot = ["agents.md", "subagent-*.md", "subagents.md"]
desktop-download = ["binaries.md"]
device-camera = ["screenshots.md"]
device-desktop = ["desktop-menus.md"]
diff = ["changelog.md"]
diff-added = ["add-new-manager.md"]
download = ["install.md"]
file-binary = ["nuitka.md"]
file-code = ["pygments.md"]
file-moved = ["dump.md"]
file-submodule = ["managers.md"]
file-symlink-file = ["multicall.md"]
gear = ["upstream-development.md"]
git-commit = ["commit-messages.md"]
git-compare = ["typer.md"]
git-merge = ["add-packaging-channel.md"]
git-pull-request = ["contributing.md"]
globe = ["infrastructure.md"]
history = ["changelog-archive.md", "cooldown.md"]
image = ["snippets.md"]
iterations = ["version.md"]
key = ["sudo.md"]
law = ["license.md"]
light-bulb = ["design.md", "usecase.md"]
log = ["logging.md"]
markdown = ["mkdocs.md"]
mention = ["decorators.md"]
meter = ["pytest.md"]
milestone = ["history.md"]
mortar-board = ["agent-skills.md", "tutorial.md"]
multi-select = ["types.md"]
package-dependencies = ["dependencies.md"]
package-dependents = ["packaging.md"]
paintbrush = ["colorize.md"]
pencil = ["myst-docstrings.md"]
pin = ["envvar.md", "overrides.md"]
pivot-column = ["test-matrix.md"]
play = ["execution.md"]
plug = ["bar-plugin.md", "claude-code-plugin.md", "gnome-shell.md"]
plus-circle = ["augmentations.md"]
project-roadmap = ["layout.md"]
project-template = ["config-schema.md"]
pulse = ["detection.md"]
repo = ["man-page.md"]
rocket = ["releasing.md"]
search = ["config-discovery.md"]
shield-check = ["testing.md"]
shield-lock = ["security.md"]
sliders = ["config.md", "configuration.md"]
stack = ["config-formats.md", "duplicates.md"]
sun = ["theme.md"]
sync = ["spinner.md"]
table = ["output-formats.md", "table.md"]
tag = ["trait.md"]
tasklist = ["todolist.md"]
telescope = ["parameters.md"]
terminal = ["terminals.md", "wrap.md"]
tools = ["tool-runner.md"]
trophy = ["benchmark.md"]
typography = ["styling.md"]
verified = ["config-validation.md", "sbom.md"]
workflow = ["tree.md", "workflows.md"]
zap = ["performance.md"]

# Pages of one repository that document one feature, and so may share the
# octicon of their row: a reader scans them as a group rather than tells them
# apart. Each key is an octicon of the table above.
[families]
dependabot = ["subagent-*.md", "subagents.md"]
plug = ["bar-plugin.md", "gnome-shell.md"]
