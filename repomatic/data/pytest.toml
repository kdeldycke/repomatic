# Pytest configuration for Python projects.
#
# Native format - can be used standalone as pytest.ini.
# When merged into pyproject.toml via `repomatic init pytest`,
# the [tool.pytest] prefix is added automatically.
#
# Note: You should customize --cov=<package_name> to match your project.

# https://docs.pytest.org/en/latest/customize.html#pyproject-toml
addopts = [
    # Show the N slowest tests.
    "--durations=10",
    # Turn coverage on and name what to measure: customize this to your own
    # package. Everything about *how* coverage is measured and reported (branch
    # coverage, precision, and the report.fail_under ratchet) lives in
    # [tool.coverage] instead, via `repomatic init coverage`.
    "--cov=.",
    "--cov-report=term",
    # Run tests in parallel across all logical cores. Requires the
    # pytest-xdist[psutil] test dependency.
    "--numprocesses=auto",
    # Import test modules via importlib instead of prepending their root dir to
    # sys.path. Avoids "import file mismatch" collection errors when an installed
    # copy of the package coexists with the source tree, as in distro builds.
    "--import-mode=importlib",
]
markers = [
    "once: Tests that only need to run once, not across the full CI matrix.",
]
# Restrict collection to the test suite, so pytest never descends into the
# package or an installed copy of it in dual-copy builds.
testpaths = ["tests"]
# Make sure tests that are expected to fail do not resurrect and start working.
xfail_strict = true
