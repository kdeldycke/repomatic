# Typos spell checker configuration for Python projects.
#
# Native format - can be used standalone as typos.toml or _typos.toml.
# When merged into pyproject.toml via `repomatic init typos`,
# the [tool.typos] prefix is added automatically.

# Correct capitalization for proper nouns referenced in claude.md, plus "PNGs":
# typos splits an all-caps run before its trailing lowercase "s", so "PNGs" is
# checked as "PN" + "Gs" and rewritten to "ONGs". Only an identifier accept
# suppresses it, since the word the checker sees is "PN", never "PNGs".
default.extend-identifiers = { Github = "GitHub", IOS = "iOS", Javascript = "JavaScript", MacOS = "macOS", PNGs = "PNGs", PyPi = "PyPI", Typescript = "TypeScript" }
# False positives: "astroid" is a Python AST library (not "asteroid"); "oject" appears when "pyproject.toml" is split across line breaks in CLI help output; "sur" is macOS 11 Big Sur and Homebrew's big_sur bottle tag (not "sure").
default.extend-words = { astroid = "astroid", oject = "oject", sur = "sur" }
# Skip content between <!-- typos:off --> and <!-- typos:on --> markers.
default.extend-ignore-re = [ "(?s)<!-- typos:off -->.*?<!-- typos:on -->" ]
