# Mypy type checking configuration for Python projects.
#
# Native format - can be used standalone as mypy.toml or .mypy.ini.
# When merged into pyproject.toml via `repomatic init mypy`,
# the [tool.mypy] prefix is added automatically.

# Type-check the interior of functions that carry no type annotation.
check_untyped_defs = true
# Warn about unused '[mypy-*]' config sections.
warn_unused_configs = true
# Warn about casts that do nothing.
warn_redundant_casts = true
# Warn about '# type: ignore' comments that are not needed.
warn_unused_ignores = true
# Warn about returning Any from functions with non-Any return type.
warn_return_any = true
# Warn about unreachable code.
warn_unreachable = true
# Use visually nicer output in error messages.
pretty = true
overrides = [
  # `repomatic run mypy` checks at the `requires-python` floor. Sphinx 9.1 and
  # later use the `type` statement of Python 3.12, which stops the whole run
  # on a syntax error below that floor. Skipping the import types every Sphinx
  # name as `Any`.
  { module = [ "sphinx.*" ], ignore_missing_imports = true, follow_imports = "skip" },
]
